{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "prism-link-server.fullname" . }}
  labels:
    {{- include "prism-link-server.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "prism-link-server.selectorLabels" . | nindent 6 }}
{{- end }}
