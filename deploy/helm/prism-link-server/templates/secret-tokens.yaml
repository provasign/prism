{{- if and (not .Values.auth.noAuth) .Values.auth.tokens.file (not .Values.auth.tokens.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism-link-server.tokensSecret" . }}
  labels:
    {{- include "prism-link-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.tokens.key }}: {{ .Values.auth.tokens.file | b64enc }}
{{- end }}
