<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Prism link server architecture</title>
  <desc id="desc">Consumer repositories' CI uploads link bundles with a per-repository token to the Prism link server, which runs as one or more replicas behind HTTPS and keeps bundles in shared storage: AWS S3, Azure Blob Storage, Google Cloud Storage, an S3-compatible store in a private data centre, or a local disk. Developers and coding agents in a library repository ask the server with a read token, and change-impact, verify, test-plan and lookup list every readable consumer site next to the local callers, with what was not covered.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38d996"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="#273241"/>

  <text x="40" y="48" fill="#e6edf3" font-size="22" font-weight="700">Prism link server</text>
  <text x="232" y="48" fill="#9aa7b4" font-size="16">change impact across repositories that are not on your machine</text>

  <!-- Column 1: consumer repositories -->
  <text x="40" y="96" fill="#9aa7b4" font-size="13" font-weight="600" letter-spacing="0.06em">CONSUMER REPOSITORIES · CI ON MERGE</text>
  <g>
    <rect x="40" y="112" width="300" height="78" rx="10" fill="#161b22" stroke="#273241"/>
    <text x="58" y="140" fill="#e6edf3" font-size="16" font-weight="600">payments-api</text>
    <text x="58" y="162" fill="#9aa7b4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CI: prism workspace push --ref main</text>
    <text x="58" y="180" fill="#748190" font-size="12">upload token: this repository only</text>
  </g>
  <g>
    <rect x="40" y="204" width="300" height="78" rx="10" fill="#161b22" stroke="#273241"/>
    <text x="58" y="232" fill="#e6edf3" font-size="16" font-weight="600">checkout-web</text>
    <text x="58" y="254" fill="#9aa7b4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CI: prism workspace push --ref main</text>
    <text x="58" y="272" fill="#748190" font-size="12">upload token: this repository only</text>
  </g>
  <g>
    <rect x="40" y="296" width="300" height="78" rx="10" fill="#161b22" stroke="#273241"/>
    <text x="58" y="324" fill="#e6edf3" font-size="16" font-weight="600">ledger-svc  …  hundreds more</text>
    <text x="58" y="346" fill="#9aa7b4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CI: prism workspace push --ref main</text>
    <text x="58" y="364" fill="#748190" font-size="12">upload token: this repository only</text>
  </g>
  <text x="40" y="408" fill="#e6edf3" font-size="13.5" font-weight="600">Each upload is one commit's link bundle:</text>
  <text x="40" y="430" fill="#9aa7b4" font-size="13">where the repository uses other repositories'</text>
  <text x="40" y="449" fill="#9aa7b4" font-size="13">symbols (compiler-resolved, one line each) and</text>
  <text x="40" y="468" fill="#9aa7b4" font-size="13">its own signatures. No function bodies,</text>
  <text x="40" y="487" fill="#9aa7b4" font-size="13">no machine paths, no uncommitted trees.</text>
  <text x="40" y="520" fill="#748190" font-size="12.5">Go · Java · TypeScript / JavaScript · Python</text>

  <!-- Column 2: the link server -->
  <rect x="404" y="74" width="408" height="534" rx="14" fill="none" stroke="#38d996" stroke-opacity="0.45" stroke-dasharray="6 5"/>
  <text x="424" y="98" fill="#38d996" font-size="13" font-weight="600" letter-spacing="0.06em">YOUR INFRASTRUCTURE · SELF-HOSTED</text>

  <rect x="424" y="112" width="368" height="40" rx="8" fill="#161b22" stroke="#273241"/>
  <text x="608" y="137" fill="#e6edf3" font-size="13.5" text-anchor="middle">HTTPS · optional mTLS · load balancer</text>

  <!-- replicas, stacked -->
  <rect x="444" y="184" width="348" height="168" rx="10" fill="#161b22" stroke="#273241"/>
  <rect x="434" y="176" width="348" height="168" rx="10" fill="#161b22" stroke="#273241"/>
  <rect x="424" y="168" width="348" height="168" rx="10" fill="#1b2430" stroke="#38d996" stroke-opacity="0.8"/>
  <text x="442" y="196" fill="#e6edf3" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prism link-server</text>
  <text x="757" y="196" fill="#38d996" font-size="13" font-weight="600" text-anchor="end">× N replicas</text>
  <text x="442" y="224" fill="#e6edf3" font-size="13">• per-token access: upload · read · admin, expiry</text>
  <text x="442" y="246" fill="#e6edf3" font-size="13">• answers from memory: p99 under 25 ms at</text>
  <text x="454" y="264" fill="#e6edf3" font-size="13">1,000 repositories, ~1 million references</text>
  <text x="442" y="286" fill="#e6edf3" font-size="13">• audit log · rate limits · Prometheus metrics</text>
  <text x="442" y="308" fill="#e6edf3" font-size="13">• retention · integrity check · backup / restore</text>
  <text x="442" y="326" fill="#748190" font-size="12">container image · Helm chart · any number of replicas</text>

  <line x1="608" y1="152" x2="608" y2="166" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="608" y1="352" x2="608" y2="384" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#arrowGrey)" marker-start="url(#arrowGrey)"/>
  <text x="618" y="373" fill="#748190" font-size="12">compare-and-swap writes</text>

  <text x="424" y="406" fill="#9aa7b4" font-size="13" font-weight="600" letter-spacing="0.06em">SHARED STORAGE · PICK ONE</text>
  <g font-size="13" fill="#e6edf3">
    <rect x="424" y="418" width="176" height="36" rx="8" fill="#161b22" stroke="#273241"/>
    <text x="512" y="441" text-anchor="middle">AWS S3</text>
    <rect x="616" y="418" width="176" height="36" rx="8" fill="#161b22" stroke="#273241"/>
    <text x="704" y="441" text-anchor="middle">Azure Blob Storage</text>
    <rect x="424" y="464" width="176" height="36" rx="8" fill="#161b22" stroke="#273241"/>
    <text x="512" y="487" text-anchor="middle">Google Cloud Storage</text>
    <rect x="616" y="464" width="176" height="36" rx="8" fill="#161b22" stroke="#273241"/>
    <text x="704" y="487" text-anchor="middle">Local disk (1 replica)</text>
    <rect x="424" y="510" width="368" height="36" rx="8" fill="#161b22" stroke="#273241"/>
    <text x="608" y="533" text-anchor="middle">Private data centre: MinIO, Ceph, other S3 stores</text>
  </g>
  <text x="424" y="572" fill="#748190" font-size="12">IRSA · AKS and GKE workload identity · managed identity</text>
  <text x="424" y="590" fill="#748190" font-size="12">No cloud SDKs. A store that ignores conditional writes is refused.</text>

  <!-- Column 3: developers and agents -->
  <text x="876" y="96" fill="#9aa7b4" font-size="13" font-weight="600" letter-spacing="0.06em">DEVELOPERS AND CODING AGENTS</text>
  <rect x="876" y="112" width="290" height="104" rx="10" fill="#161b22" stroke="#273241"/>
  <text x="894" y="140" fill="#e6edf3" font-size="16" font-weight="600">shared library repository</text>
  <text x="894" y="164" fill="#9aa7b4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prism.yaml:</text>
  <text x="894" y="182" fill="#9aa7b4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  workspace_server: https://…</text>
  <text x="894" y="204" fill="#748190" font-size="12">read token: the repositories this team may see</text>

  <rect x="876" y="238" width="290" height="196" rx="10" fill="#161b22" stroke="#7dd3fc" stroke-opacity="0.7"/>
  <text x="894" y="266" fill="#7dd3fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ prism change-impact Client.Send</text>
  <text x="894" y="296" fill="#e6edf3" font-size="13">local callers, compiler-resolved</text>
  <text x="894" y="322" fill="#38d996" font-size="13">+ every readable consumer site,</text>
  <text x="906" y="340" fill="#38d996" font-size="13">at its commit, with its version pin</text>
  <text x="894" y="366" fill="#38d996" font-size="13">+ what was not covered: repositories</text>
  <text x="906" y="384" fill="#38d996" font-size="13">never uploaded, unreadable, unreachable</text>
  <text x="894" y="416" fill="#748190" font-size="12">also verify · test-plan · lookup · CLI and MCP</text>

  <text x="876" y="470" fill="#e6edf3" font-size="13.5" font-weight="600">The agent edits with the whole</text>
  <text x="876" y="489" fill="#e6edf3" font-size="13.5" font-weight="600">organization's call sites in view,</text>
  <text x="876" y="508" fill="#9aa7b4" font-size="13">without cloning hundreds of repositories,</text>
  <text x="876" y="527" fill="#9aa7b4" font-size="13">and never claims completeness it lacks.</text>

  <!-- arrows -->
  <line x1="344" y1="243" x2="420" y2="243" stroke="#38d996" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="232" fill="#38d996" font-size="12.5" font-weight="600" text-anchor="middle">upload</text>
  <text x="380" y="262" fill="#748190" font-size="11.5" text-anchor="middle">bundle</text>

  <path d="M872 300 C 840 300, 830 252, 776 252" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="790" y="236" fill="#7dd3fc" font-size="12.5" font-weight="600" text-anchor="start">who uses X?</text>
  <path d="M776 300 C 820 300, 830 352, 872 352" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="866" y="400" fill="#7dd3fc" font-size="12.5" font-weight="600" text-anchor="end">sites + coverage</text>
</svg>
