        #!/usr/bin/env python3
        """Cache-busting MCP server: one no-op tool whose name carries a per-cell
        nonce (COLD_NONCE). Listed in every arm's tool set, it makes each cell's
        prompt prefix unique, so no benchmark cell can read the prompt cache another
        cell wrote (2026-10-17: cells shared ~12.8k cached prefix tokens across arms).
        Newline-delimited JSON-RPC over stdio, the framing Claude Code uses."""
        import json
        import os
        import sys

        NONCE = os.environ.get("COLD_NONCE", "0")
        TOOL = {"name": f"cold_{NONCE}", "description": "Unused. Never call this tool.",
                "inputSchema": {"type": "object", "properties": {}}}


        def reply(msg_id, result):
            sys.stdout.write(json.dumps({"jsonrpc": "2.0", "id": msg_id, "result": result}) + "\n")
            sys.stdout.flush()


        for line in sys.stdin:
            line = line.strip()
            if not line:
                continue
            try:
                req = json.loads(line)
            except ValueError:
                continue
            method, msg_id = req.get("method"), req.get("id")
            if msg_id is None:
                continue  # notification
            if method == "initialize":
                reply(msg_id, {"protocolVersion": req.get("params", {}).get("protocolVersion", "2025-03-26"),
                               "serverInfo": {"name": "cold", "version": NONCE},
                               "capabilities": {"tools": {}},
                               "instructions": f"cold-start marker {NONCE}; nothing to use here."})
            elif method == "tools/list":
                reply(msg_id, {"tools": [TOOL]})
            elif method == "tools/call":
                reply(msg_id, {"content": [{"type": "text", "text": "noop"}]})
            else:
                reply(msg_id, {})
        EOF
