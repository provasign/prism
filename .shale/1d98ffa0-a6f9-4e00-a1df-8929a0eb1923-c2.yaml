    - cmd: "cd /Users/tapabratapal/Projects/provasign/grove && gofmt -l internal/ | grep -v changeimpact_signatures_test; git checkout -q -b feat/compiler-declared-symbols && git add internal/index/indexer.go internal/native/java.go internal/native/javac.go internal/native/javac_resolver.java.txt internal/native/native.go internal/native/tsworker_test.go internal/store/store.go internal/native/javacdecls_test.go && git commit -q -F - <<'EOF'\njava: the compiler's declarations are the universe\n\nchange_impact on gson's TypeAdapter.write reported the family closed and\nsafe to claim complete at 6 of 31 overrides in TypeAdapters.java. javac had\nattributed every override; the parser had not declared the 25 anonymous\nclasses assigned to static fields, so the edges had nowhere to land and the\n\"closed\" verdict was computed over an incomplete universe (2026-10-12).\n\n- The javac resolver emits every type, method, constructor and field it\n  attributes (\"decls\"), in the parser's naming (anonymous classes as\n  <anonymous@line:col>, enum-constant bodies folded into the enum).\n- compilerDeclaredSymbols adds a SymbolRecord for each declaration no parsed\n  symbol covers (same file, same name, span containing the start line);\n  records follow the parser's conventions (ID, ParentSymbol, RawText from\n  the node) and carry the modifier \"compiler-declared\".\n- They join the javac edge join, the Java inheritance pass, the indexer's\n  symbol set (store.InsertSymbols, store order) and the diagnostics:\n  \"javac declared N symbol(s) in M file(s) the parser did not index\".\n\ngson, full index: family 96 -> 128, TypeAdapters.java 6 -> 31 overrides;\nsymbol-level recall/precision against the gold patch 0.77/1.00 -> 1.00/1.00\n(the agent's own text search: 0.97/0.96). JsonWriter.value 0.83/0.93 ->\n1.00/0.96. With astkit's parser fix in place the compiler still declares 17\nsymbols the parser lacks (one-line empty anonymous classes), which is the\npoint: the safety net reports what the parser does not know about yet.\n\nCo-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF\ngit push -q -u origin feat/compiler-declared-symbols 2>&1 | grep -v \"^remote:\\|^$\" | tail -2; gh pr create --base main --head feat/compiler-declared-symbols --title \"java: the compiler's declarations are the universe\" --body-file - <<'EOF'\nchange_impact on gson's `TypeAdapter.write` reported the family closed and safe to claim complete at 6 of 31 overrides in TypeAdapters.java. javac had attributed every override. The parser had not declared the 25 anonymous classes assigned to static fields, so the edges had nowhere to land, and the \"closed\" verdict was computed over an incomplete universe.\n\n**Change**\n- The javac resolver emits every type, method, constructor and field it attributes, in the parser's naming. Anonymous classes become `<anonymous@line:col>`, and enum-constant bodies fold into the enum as the parser does.\n- Each declaration no parsed symbol covers becomes a SymbolRecord with the modifier `compiler-declared`, following the parser's conventions for ID, parent and raw text.\n- They join the javac edge join, the Java inheritance pass, the indexer's symbol set through a new `store.InsertSymbols`, and the diagnostics: \"javac declared N symbol(s) in M file(s) the parser did not index\".\n\n**Measured on gson's full index**\n- family 96 to 128; TypeAdapters.java 6 to 31 overrides.\n- Symbol-level recall/precision against the gold patch: `TypeAdapter.write` 0.77/1.00 to 1.00/1.00, `JsonWriter.value` 0.83/0.93 to 1.00/0.96. The agent's own text search scores 0.97/0.96 and 0.96/0.90.\n- With astkit's companion parser fix the compiler still declares 17 symbols the parser lacks, one-line empty anonymous classes in tests and a benchmark. That is the safety net working.\n\n**Checked:** `go test ./...` green; JDK-gated regression test `TestJavacAddsDeclarationsTheParserMissed`; prism's suite green against this tree; research `ci_invariants` on the compiler build (comment to follow). The astkit bump to the parser fix comes in a follow-up once astkit is tagged.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF"
