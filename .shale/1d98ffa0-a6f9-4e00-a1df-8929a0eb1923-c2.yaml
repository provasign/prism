        resident engine: answer edits from the parse, run the compiler pass in the background

        A resident engine ran the compiler pass (javac, go, tsc) synchronously on
        every edit before answering: 1.7-4s on jackson-sized repos for the first
        query after an edit. Topo's design (2026-10-12): parse-based answers at edit
        time, compiler-backed correction in the background, and a provisional mark
        until it lands.

        - index.Options.DeferNative: an incremental run skips the changed
          languages' analyzers (only those that completed a full pass before), so
          their stored compiler edges are carried and re-pointed to the new symbols
          (the existing carry-forward path), and returns the changed files in
          IndexResult.NativePending. Cold and forced runs never defer.
        - index.Options.ReextractFiles: extract named files again although their
          bytes are unchanged; the deferred pass is an ordinary index run over them.
        - scanTree: the indexer's walk, extracted unchanged into a read-only
          function. Indexer.HasChanges uses it (same walk, stamp and prune rules,
          no writes) so "is the index fresh?" never needs the index lock.
        - Engine: pending set + one background loop draining it under indexMu; the
          loop's exit check and the start check share pendMu, so a file added while
          a pass runs is never stranded. Index answers "fresh" without the lock when
          nothing changed while the pass runs; a real change waits for the pass
          (never cancels it: a pass stopped between its symbol and edge writes would
          leave the store out of step). NativePending / WaitNative for callers.
          Default on for resident engines, off for OneShot; GROVE_DEFER_NATIVE=0 or
          Config.DeferNative turns it off.
        - A background pass leaves the previous run's splice note for the next
          caller-visible result.

        TestDeferredCompilerPassConvergesToColdIndex: an edit adding an override
        inside an anonymous class in a field initializer is reported pending, the
        pass drains it, and symbols and edges equal a cold OneShot index. Existing
