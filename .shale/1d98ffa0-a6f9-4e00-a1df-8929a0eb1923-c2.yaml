 member of the same name is still addressable as `Type.method`.\n\n**2. A silent pick among unrelated declarations.** `request` is a variable in a hono benchmark script, a field of `Hono` with 1,105 sites, and a field of `FetchEvent`. The module-level variable won without a word. A bare data-member name declared both at module level and inside types is now ambiguous unless a file says which. Each listed retry resolves to exactly its declaration.\n\nTests: `TestBareNameWithFileNamesTheTopLevelFunction`, `TestBareDataMemberMixIsAmbiguousUnlessScoped`; `go test ./...` green.\n\nCompanion: prism `fix/bare-name-resolution` (override-family partition for wide bare names in nominal languages), which depends on rule 1 for one test.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF"
