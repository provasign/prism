    - cmd: |-
        git add internal/mcp/tools.go internal/mcp/searchmulti_test.go
        git commit -m "$(cat <<'EOF'
        mcp: truncation warning points at hitRollup before re-query advice

        Real usage (2026-09-02): a truncated OWNER-pattern search on an
        access-control audit reported "AT LEAST 543" against a true 829
        matches. The graph's hitRollup -- a complete, grouped-by-symbol
        breakdown of the WHOLE hit set -- rides along in the same response
        (rollup.go, existing since the truncation-denominator work), but the
        warning text never mentioned it: "Raise limit=, narrow with
        path=/glob=, or use files_only=true" pointed only at re-querying,
        never at the free complete answer already sitting in the payload.

        For a correctness-critical query (access control, ownership, anything
        security-shaped) that's the wrong default: the agent has to already
        know hitRollup exists from the static tool schema to find it, rather
        than being told at the exact moment truncation happens.

        Warning now branches: when hitRollup is non-empty, it leads with "the
        graph's COMPLETE breakdown... is in hitRollup below" and only mentions
        exhaustive=true as the fallback for raw lines instead of grouped
        counts. Falls back to the old re-query wording only when no rollup was
        produced (rollup.go: no graph, search failed, or nothing indexed).

        New test drives this through a real Grove-indexed fixture end to end
        (not a synthetic map, like the existing TestRenderSearchAsText_HitRollup)
        so the assertion exercises the actual handler code path, not just the
        rendering step.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_01HTYLuNJPfgEAXJykbHPpHT
        EOF
        )"
