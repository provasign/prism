        cat > /private/tmp/prism-v0.75.2-release-notes.md <<'EOF'
        Prism v0.75.2 improves search results for follow-up navigation.

        - Compact MCP search results include the body of one unique small symbol match when it fits the response budget.
        - Scoped searches identify the paths searched and distinguish “no indexed symbol” from a completed text search. Results no longer suggest out-of-scope matches as if they were in scope.
        - An empty multiword phrase search offers a bounded, labeled fallback for separate terms within the same scope.
        - Added Click-like regression coverage for small bodies, scoped evidence, and fallback output size.

        The search output is more informative, but a held-out agent run has not established a token or task-success gain from these changes.
        EOF
