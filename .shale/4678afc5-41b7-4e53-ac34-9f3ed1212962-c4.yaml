commands:
    - cmd: |-
        git add -A internal/cli && git commit -q -m "$(cat <<'EOF'
        fix: `prism <cmd> --help` prints usage instead of running the command

        `prism init --help` performed a FULL init — prism.yaml, nine steering
        files and every project MCP registration — because no handler parsed
        -h/--help; the flag fell through to the command body. Same mechanism
        made `prism search --help` search for the string "--help".

        Run() now answers -h/--help once, before dispatch, and prints just that
        command's block from helpText (plus the flag section for init). Aliases
        resolve (install→init, refs→references, arch-check→arch); an unknown
        command falls back to the full help.

        Deliberately narrow: only the flag spellings count, so `prism search
        help` still searches for the word.

        Tests: help_test.go asserts init --help/-h and install --help leave the
        working directory EMPTY, that per-command blocks come back rather than
        the whole help, and that a bare `help` argument is still a query term.

        Gate: go test ./... green (12 packages); ci_invariants.py green
        (6 corpora — ceiling, compile, rename-plan, determinism).

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_01CYfUFhBWrJnDjz7xYyX4Si
        EOF
        )" && git push -q origin main && git tag -a v0.52.1 -m "v0.52.1: prism <cmd> --help prints usage instead of running the command" && git push origin v0.52.1
