        """From the code a session's FIRST prism answer showed, how many call-graph hops to a symbol the gold fix changed,
        and how big is the neighbourhood we would have to attach to get there?"""
        import json,sqlite3,re,sys,collections
        S=sys.argv[1]; cases=json.load(open(f'{S}/hop/cases.json'))
        VARIANTS={'calls+overrides':('calls','overrides','implements'),'+uses-type':('calls','overrides','implements','uses-type')}
        LOC=re.compile(r'([\w./@$-]+\.(?:java|ts|tsx|go|js|mjs|py)):(\d+)(?:-(\d+))?')
        def innermost(db,f,line):
            r=db.execute("select id,kind,span_start,span_end,token_estimate from symbols where file_path=? and span_start<=? and span_end>=? and kind not in ('file','module','package','import') order by (span_end-span_start) limit 1",(f,line,line)).fetchone()
            return r
        for c in cases:
            db=sqlite3.connect(f"{S}/hop/{c['task']}/.grove/grove.db")
            # seeds: every code location the first answer showed
            seeds=set()
            for m in LOC.finditer(c['first_text']):
                r=innermost(db,m.group(1),int(m.group(2)))
                if r: seeds.add(r[0])
            # gold: innermost base symbols around each changed hunk of the gold files
            gold=set(); cur=None
            for l in c['patch'].splitlines():
                if l.startswith('--- a/'): cur=l[6:] if l[6:] in c['gold'] else None
                m=re.match(r'@@ -(\d+)(?:,(\d+))?',l)
                if m and cur:
                    a=int(m.group(1)); b=int(m.group(2) or 1)
                    for ln in range(a,a+max(b,1)):
                        r=innermost(db,cur,ln)
                        if r: gold.add(r[0])
            res=[]
            for vname,types in VARIANTS.items():
                q=f"select from_node,to_node from edges where edge_type in ({','.join('?'*len(types))})"
                adj=collections.defaultdict(set)
                for a,b in db.execute(q,types): adj[a].add(b); adj[b].add(a)
                dist={s:0 for s in seeds}; frontier=set(seeds); sizes=[]
                for h in (1,2):
                    nxt=set()
                    for s in frontier: nxt|={n for n in adj[s] if n not in dist}
                    for n in nxt: dist[n]=h
                    frontier=nxt; sizes.append(len(nxt))
                hit=min((dist[g] for g in gold if g in dist),default=None)
                toks=[sum((db.execute('select token_estimate from symbols where id=?',(n,)).fetchone() or [0])[0] for n in dist if dist[n]==h) for h in (1,2)]
                res.append(f"{vname}: gold at hop {hit if hit is not None else '>2'}; new symbols hop1 {sizes[0]} (~{toks[0]//1000}k tok bodies) hop2 {sizes[1]} (~{toks[1]//1000}k)")
            print(f"## {c['task']}  seeds={len(seeds)} gold_syms={len(gold)} later_hit_at_call={c['hit_at']} resolved={c['resolved']}")
            for r in res: print('   ',r)
        EOF
