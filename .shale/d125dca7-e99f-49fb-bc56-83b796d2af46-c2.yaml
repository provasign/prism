    - cmd: |-
        cd ~/Projects/provasign/prism && gh release edit v0.86.1 --notes "$(cat <<'EOF'
        Grove v0.62.1: Python decorators now count as calls.

        **Fix**
        - **Decorator-driven Python APIs looked unused.** A decorator runs when its definition is evaluated, so `@click.argument("x")` is a call to `click.argument`, but Prism never recorded it. Click's `argument` showed 2 callers against 143 `@click.argument(` uses, and `version_option` showed none. Decorators are now calls made by the scope that evaluates them: the module for top-level functions, the class for methods, the enclosing function for nested ones. Classes also record the calls in their own body.

        | | Before | After |
        |---|---|---|
        | click `argument` | 2 callers, 1 file | callers in 20 files |
        | click `version_option` | 0 callers | 7 callers (all 3 files of a signature-change test, including `examples/repo/repo.py`) |
        | flask edge accuracy vs runtime trace | precision 0.829, recall 0.704 | precision 0.854, recall 0.729 |

        Existing indexes re-extract automatically on first use.

        **Known gap:** decorators on objects stored in plain module variables, such as Flask's `@app.route` and `@bp.route`, are recorded but not yet linked to `route`, because the variable's type isn't inferred.
        EOF
