        import ast, sqlite3, sys, os, collections
        root = sys.argv[1]
        db = sqlite3.connect(os.path.join(root, '.grove/grove.db'))
        syms = collections.defaultdict(list)
        for f, n, s, e in db.execute("select file_path,name,span_start,span_end from symbols where language='python'"):
            syms[f].append((n, s, e or s))
        total, missing, ex = collections.Counter(), collections.Counter(), collections.defaultdict(list)
        for rel in list(syms):
            try:
                tree = ast.parse(open(os.path.join(root, rel), encoding='utf-8', errors='replace').read())
            except Exception:
                continue
            def visit(node, ctx):
                for ch in ast.iter_child_nodes(node):
                    cat = None
                    if isinstance(ch, ast.ClassDef): cat = 'class'
                    elif isinstance(ch, (ast.FunctionDef, ast.AsyncFunctionDef)): cat = 'method' if ctx == 'class' else ('nestedfunc' if ctx == 'func' else 'func')
                    elif isinstance(ch, (ast.Assign, ast.AnnAssign)) and ctx in ('class', 'module'):
                        targets = ch.targets if isinstance(ch, ast.Assign) else [ch.target]
                        for t in targets:
                            if isinstance(t, ast.Name):
                                c = ctx + 'attr'; total[c] += 1
                                if not any(n == t.id and not (s > ch.end_lineno or e < ch.lineno) for n, s, e in syms[rel]):
                                    missing[c] += 1; ex[c].append(f'{rel}:{ch.lineno} {t.id}')
                    if cat:
                        c = ('local' if ctx == 'func' and cat == 'class' else '') + cat
                        total[c] += 1
                        if not any(n == ch.name and not (s > ch.end_lineno or e < ch.lineno) for n, s, e in syms[rel]):
                            missing[c] += 1; ex[c].append(f'{rel}:{ch.lineno} {ch.name}')
                        visit(ch, 'class' if cat in ('class',) else 'func')
                    else:
                        visit(ch, ctx if not isinstance(ch, (ast.Lambda,)) else 'func')
            visit(tree, 'module')
        for c in sorted(total):
            print(f'{c:14} total={total[c]:7} missing={missing[c]:6}')
            for x in ex[c][:3]: print('     ', x)
        EOF
