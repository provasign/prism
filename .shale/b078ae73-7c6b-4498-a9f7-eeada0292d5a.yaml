          now lists it (family closed, safe to claim complete) where it had none.
        - functions, classes, interfaces, enums and type aliases declared inside
          function bodies (modifier "local"), named after their scope (sort.less).
        - the bodyless members of an ambient `declare class` (typeorm's vendored
          mongodb typings: 585 methods/constructors/accessors).
        - overload signatures and object-literal methods stay out, as the parser
          leaves them out.

        The declared symbols join the call/type/member locator, so the checker's
        resolved references land on them: typeorm MongoQueryRunner.getCollection now
        calls MongoClient.db and Db.collection (before: ChangeStreamNameSpace.db, the
        nearest same-named symbol), MongoDriver.disconnect calls MongoClient.close
        (before: DataSource.close), and calls inside nested functions are theirs, not
        the file's <top-level>.

        typeorm full index with typescript resolvable: +614 symbols, +1744 calls
        (1705 to declared symbols, 39 from nested functions), -61 calls (35 moved off
        <top-level>, 26 retargeted from wrong same-named symbols); cold index time
        within run-to-run noise (10.1-11.3s both builds). Incremental edit of
        container.ts re-declares the three symbols at their new lines, no stale rows.

        compilerDecl's signature, modifiers and annotations are now JSON fields
        (sig/mods/ann) so a resolver script can supply them; "function" maps to
        KindFunction; an anonymous class keeps a supplied signature.

