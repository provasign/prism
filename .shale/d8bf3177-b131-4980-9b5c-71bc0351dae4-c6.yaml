        feat(mcp): plain-text response for prism_search — BACKLOG.md item 1

        MCP content is free-form text; JSON was never required, only what this
        server has always sent by default. prism_search's text-scope results now
        render as plain `path:line: text` lines instead of a JSON-encoded map.

        MEASURED (not projected) — same binary, identical current corpus, old vs
        new build, real protocol call:

            query "func "       OLD 2678B  NEW 2092B   -22% (586B)
            query "stringsArg"  OLD 1650B  NEW 1397B   -15% (253B)
            query "Handler"      OLD 2572B  NEW 2496B   -3%  (76B)
            query "search text"  OLD  195B  NEW  107B  -45%  (88B)

        Never a regression across four real queries; savings track hit density.
        This is why the item mattered: prism_search was the highest-call-count
        tool measured (637 calls / 190 cells), and every result sits in the
        session cache for the rest of the run — the envelope is paid again on
        every later turn, not once.

        renderSearchAsText() falls back to JSON (does not attempt to render) for:
          - scope="symbols"/"both" results carrying structured data (signature,
            doc, body, kind) that would lose information if flattened;
          - any field it does not recognise, checked EXPLICITLY (an allowlist of
            known keys) rather than assumed absent -- a shape this function
            doesn't understand must fall back loud, not drop content quiet.

        Untouched, deliberately: the HTTP API (internal/httpapi/http.go) and the
        CLI (internal/cli/commands.go) both call Invoke() directly and JSON-encode
        independently of server.go's MCP tools/call path -- this change is scoped
        to the wire format one real MCP client actually receives.

        Schema: no INPUT schema change (query/scope/etc are unaffected). The tool
        DESCRIPTION is updated to say the text-scope result is plain lines, not
        JSON, so an agent parsing content as an object is told not to.

        Tests: 8 new, covering single-term, multi-term, files_only, cached-file
        entries, and both fallback paths (symbol-bearing, unrecognised field) plus
        an end-to-end Invoke()-through-renderer size assertion.

        Gate: go vet + go test ./... green (new tests included); ci_invariants.py
        green.

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_012P71u7T9Y23k1tiGV4ixhr
        EOF
