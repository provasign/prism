        fix: honor the agent's search request instead of overriding it

        v0.38.4 stopped a venv timeout by adding env/venv/site-packages/node_modules/
        vendor to a prism-authored exclusion list. That was the wrong fix. An agent
        asking for a text search is asking for ripgrep's semantics; prism substituted
        its own policy and became unable to answer "where does this library define X"
        about code that is really present — a silent empty result, the same failure
        class it was trying to remove.

        The engine the agent expects already solves this: rg skips .gitignore'd trees,
        and a virtualenv is normally gitignored. So prism now adds no globs of its
        own beyond .grove (its own state). grep and the built-in scanner, which have
        no ignore logic, read the repo's .gitignore and skip exactly what the PROJECT
        listed — no more.

        Found while fixing: rg honors .gitignore only INSIDE a git repository. A
        worktree, an unpacked tarball or a subdirectory checkout has the ignore file
        but no .git, and rg searched everything the project asked it not to.
        --no-require-git makes the behaviour match the expectation everywhere.

        The rule, stated once: prism may add information to an answer, never remove
        the question. Skipping something it was asked to search must be the project's
        decision, not prism's.

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
