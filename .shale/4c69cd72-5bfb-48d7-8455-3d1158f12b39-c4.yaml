        read guard: forget delivered ranges once the file may have changed

        The tracker only ever added ranges and kept them in one root-level file
        shared by every session, so the guard denied Reads of lines prism had
        delivered before an edit (jackson pr5959: the agent could not re-read code
        it had just changed), and yesterday's ranges could block today's Reads.

        - Tracker also runs PostToolUse on Edit|Write|MultiEdit|NotebookEdit|Bash:
          an edit tool drops that file's ranges; a Bash command that can rewrite
          files (git checkout/stash/reset/apply/restore/switch/merge/rebase/pull,
          patch, sed/perl -i, mv/cp, formatters, codegen, file-writing scripts,
          redirects into non-temp paths) drops all of them.
        - Each range records the file's mtime_ns and size at delivery; the guard
          never blocks a Read of a file that differs on disk (or can't be verified).
        - State is per session (hook session_id) under .claude/prism-read-guard/,
          which carries its own "*" .gitignore; day-old session files expire.
        - A ranges-only op=read (no top-level file) is now tracked.
        - Deny message says the lines were already delivered and unchanged, and
          gives the exact prism op=read call to fetch them again.
        - prism init --read-guard upgrades an existing install in place (adds the
          new PostToolUse entry, deletes the legacy .prism-read-tracker.json);
          --no-read-guard also removes the state dir.
        - Go tests exec the installed scripts with sample hook JSON.

