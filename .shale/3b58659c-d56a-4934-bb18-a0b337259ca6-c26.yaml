        mcp: add rollup_only to prism_search -- skip the sample, keep the rollup

        Real feedback (2026-09-02) on the hitRollup truncation-warning fix:
        should the rollup be surfaced earlier in the response, or as its own
        tool? Neither -- ordering within one response doesn't save tokens
        (deliveredTokens bills the whole payload regardless of read order),
        and a separate tool costs a second call on the common case (wanting
        both the sample and the structure together). The real lever is the
        one prism_search already exposes for the analogous files_only case:
        let the caller skip content they don't want in the first place.

        rollup_only=true drops textHits from a truncated search's response
        when hitRollup exists -- for a caller who already knows "how many,
        and where do they cluster" is all they need, not example lines.
        Measured on jackson-databind's MismatchedInputException search: 5604
        -> 2980 bytes (~47%) with the rollup itself unchanged. Never drops
        textHits when there is nothing to answer with instead (not truncated,
        or a rollup was not producible) -- silently dropping the only content
        in the response would be worse than the tokens.

        Wired through the MCP schema and the CLI (--rollup-only), matching
        --files-only's existing shape exactly.

