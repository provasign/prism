        for arm in control treatment; do
        echo "##################### $arm #####################"
        python3 - "$OUT/$arm.jsonl" <<'EOF'
        import json, sys
        searches, queries, nudges = 0, 0, 0
        for line in open(sys.argv[1]):
            line = line.strip()
            if not line: continue
            try: rec = json.loads(line)
            except Exception: continue
            t = rec.get("type")
            if t == "assistant":
                for b in rec.get("message", {}).get("content", []):
                    if b.get("type") == "tool_use":
                        n, inp = b.get("name"), b.get("input", {})
                        if n == "mcp__prism__prism_search":
                            searches += 1
                            print(f"  prism_search  {json.dumps(inp)[:140]}")
                        elif n == "mcp__prism__prism_query":
                            queries += 1
                            print(f"  PRISM_QUERY   {json.dumps(inp)[:200]}")
                        elif n.startswith("mcp__prism"):
                            print(f"  {n.replace('mcp__prism__',''):13} {json.dumps(inp)[:120]}")
            elif t == "user":
                for b in rec.get("message", {}).get("content", []):
                    if b.get("type") == "tool_result":
                        c = b.get("content")
                        if isinstance(c, list): c = " ".join(x.get("text","") for x in c if isinstance(x, dict))
                        if "sequential search" in str(c): nudges += 1
            elif t == "result":
                print(f"\n  turns={rec.get('num_turns')} cost=${rec.get('total_cost_usd'):.3f}")
        print(f"  prism_search calls: {searches} | prism_query calls: {queries} | nudges delivered: {nudges}")
        EOF
        done
