            items.append({'command':calls[b['tool_use_id']],'result_excerpt':'\n'.join(useful)[-2500:],'output_bytes':len(out.encode()),'is_error':b.get('is_error',False)})
         audit.append({'task':task,'agent_called_tests':bool(items),'commands':items,'transcript':cell['transcript']})
        print('Native agents with actual test tool results:',sum(x['agent_called_tests'] for x in audit),'/',len(audit))
