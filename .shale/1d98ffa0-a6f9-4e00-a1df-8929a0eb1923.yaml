        def task_of(s): return os.path.basename(s).split('.claude')[0]
        lock=__import__('threading').Lock()
        def setup(task):
            t=json.load(open(f'tasks/e2e/{task}.json')); wt=f'{WT}/{task}'
            with lock:
                if not os.path.isdir(wt):
                    subprocess.run(['git','clone','-q','--local','--no-checkout',str(run_e2e._repo_for(t)),wt],check=True,capture_output=True)
            reset(wt,t['base_commit'])
            if not os.path.exists(wt+'/.grove/grove.db'):
                subprocess.run(['/opt/homebrew/bin/prism','index',wt],capture_output=True,timeout=3000)
            return wt
        def one(f):
            sess=os.path.relpath(f,R); task=task_of(sess)
            try: wt=setup(task)
            except Exception as e: return sess,{'err':str(e)}
            msgs=[json.loads(l) for l in open(f) if l.strip()]
            seq=[c['input'] for m in msgs if m.get('type')=='assistant' for c in m['message']['content'] if c.get('type')=='tool_use' and 'prism' in c.get('name','')]
            if not seq: return sess,{'calls':[]}
            m=MCP(BIN,wt); res=[]
            for inp in seq:
                try:
                    d=m.call('tools/call',{"name":"prism","arguments":inp})
                    txt=d['error']['message'] if 'error' in d else '\n'.join(x['text'] for x in d['result']['content'])
                except Exception as e: txt=f'<replay error {e}>'
                res.append({'in':inp,'text':txt})
            m.close()
            return sess,{'calls':res}
        if __name__=='__main__':
            # group by task so two sessions never reset the same worktree at once
            bytask={}
            for f in files: bytask.setdefault(task_of(f),[]).append(f)
            def group(fs):
                return [one(f) for f in fs]
            out={}
            with cf.ThreadPoolExecutor(3) as ex:
                for res in ex.map(group,bytask.values()):
                    for sess,o in res:
                        out[sess]=o
                        print(sess.split('/')[-1][:60],'ERR '+o['err'] if 'err' in o else f"{len(o['calls'])} calls {sum(len(c['text']) for c in o['calls'])} chars",flush=True)
            json.dump(out,open(f'{D}/replay_all_{label}.json','w'))
            print('DONE')
        EOF
