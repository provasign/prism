,t=tally(res,arm)\n    tot=t[\"prism\"]+t[\"grep-code\"]\n    print(f\"{label:22s} n={n} solved={s} bill/session=${b/max(n,1):.2f} prism={t['prism']} grep-code={t['grep-code']} prism-share={t['prism']/max(tot,1):.0%}\")\nEOF\npython3 codesearch.py automode-opus-disc13-2026-10-20:prism_cli_b:\"CLI no reminder\" automode-opus-disc13-2026-10-20:prism_cli:\"CLI reminder\" automode-opus-disc13-2026-10-20:prism_init:\"MCP reminder\" automode12-2026-10-20:prism_cli:\"Sonnet A plain\" automode12-2026-10-20:prism_cli_b:\"Sonnet B injected\""
