        whole-file escape had no size bound — 0.8 coverage on a 951-line file
        delivered all 951 lines verbatim, 5 identical times (werkzeug
        routing/map.py; also click testing.py at 619 lines, 5 times). The
        windows the ranking had already computed held every named anchor and
        its graph-selected neighbors; the collapse added ~700 incidental lines
        per call.

        Two changes:
        - wholeFileMaxLines = 300 bounds the escape. Files above it always get
          the windowed rendering. 300 is data-informed: baseline (grep+sed)
          agents' organic reads ranged 100-300 lines; today's measured-wasteful
          dumps were 333-951.
        - Omission markers now name the exact recovery call:
          "[lines X-Y omitted — prism_read(file, offset=X, limit=N) if needed]"
          (baseline agents needed 1-5 guess-and-retry seds to land the windows
          this ranking picks directly; reaching an omitted range is now one
          precise call).

