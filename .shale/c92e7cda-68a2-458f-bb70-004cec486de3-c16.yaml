    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/prism
        git checkout -b steering-substitution-rules -q
        git add -A
        git commit -q -F - <<'EOF'
        docs: three concrete grep->prism substitution rules in steering

        Not "prefer prism" (measured 12:1 not to route behavior) -- three specific,
        mechanical substitutions, found by reading real baseline-arm transcripts
        (haiku38 + sonnet38) for the actual shapes agents grep in:

        1. grep "a\|b\|c" (unsure which name is right, hedging with alternation) ->
           prism_query(terms=[a,b,c]) in one call. This was the single most common
           pattern across every transcript pulled -- agents run 2-5 sequential greps
           narrowing a guess where one multi-term prism_query call already covers
           the same ground.
        2. grep "Name(" to find constructors/callers -> prism_change_impact's or
           prism_query's resolved caller list, not a paren-guess that also matches
           definitions/comments/type-annotations.
        3. grep "def x" -A10 / sed -n 'N,Mp' (guessing a context-line count) ->
           prism_lookup, whole symbol body regardless of length, no risk of cutting
           a function off early.

        This differs in kind from the grep-denial problem the PreToolUse hook
        solves: "don't use grep" is a prohibition that can be enforced (hard deny +
        hook). "Combine three narrow calls into one multi-term call" cannot be
        enforced by any mechanism available -- there's no hook for "you used more
        calls than necessary". Steering is the only lever that applies here. Given
        tonight's own findings on steering's reliability, this is shipped as a
        plausible improvement, not a proven one -- effectiveness unmeasured, worth
        a real before/after comparison (prism_query call frequency, not just
        presence) next time a benchmark runs.

        Regenerated all 9 committed steering variant files via `prism init
        --refresh` per this repo's own cross-layer-sweep rule. go build / go vet /
        go test ./... all green (docs-only change to the steering const, no code
        path touched).

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_013KQbcGBEfN6F9T7NxAdA3a
        EOF
        git checkout main -q
        git merge --ff-only steering-substitution-rules -q
        git branch -d steering-substitution-rules
        git log --oneline -3
