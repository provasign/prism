    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness
        python3 - <<'EOF'
        import json, glob, re

        grep_re = re.compile(r'(?:^|[\s;&|(])(?:[^\s;&|(]*/)?(?:sudo\s+)?(?:rg|grep)\b')

        for run in ["runs/swebench-live/sonnet38", "runs/swebench-live/haiku38"]:
            for f in sorted(glob.glob(f"{run}/*.baseline.json"))[:8]:
                rec = json.loads(open(f).read())
                trace = rec.get("tool_trace") or []
                # count grep-ish uses
                greps = [i for i, t in enumerate(trace) if t == "Grep" or (isinstance(t,str) and grep_re.search(t))]
                if len(greps) >= 2:
                    print(f"=== {rec['instance_id']} ({run.split('/')[-1]}) — {len(greps)} grep-family calls, {len(trace)} total ===")
                    for i, t in enumerate(trace[:25]):
                        marker = " <-- GREP" if i in greps else ""
                        print(f"  {i:2} {t[:90]}{marker}")
                    print()
        EOF
