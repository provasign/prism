        methods = []; cur = None; cls = None; sfile = None; eff = None
        for line in src:
            m = re.match(r'^Compiled from "(.+)"', line)
            if m: sfile = m.group(1); eff=None; continue
            m = re.match(r'^[\w ]*\b(?:class|interface|enum) ([\w.$]+)', line)
            if m and not line.startswith(" "): cls = m.group(1); continue
            if line == "  static {};" or hdr.match(line) or line.startswith("  ") and line.endswith(");") and not line.startswith("   "):
                mm = hdr.match(line)
                nm = "<clinit>" if line == "  static {};" else (mm.group(1) if mm else "?"+line.strip())
                if "." in nm: nm = "<init>"
                cur = dict(cls=cls, file=sfile, name=nm, inv=[], lines=[], hdr=line, parsed=bool(orig.match(line)))
                if cur["parsed"]: eff = cur
                cur["eff"] = eff
                methods.append(cur); continue
            if cur is None: continue
            m = inv.match(line)
            if m: cur["inv"].append((int(m.group(1)), m.group(2) or cls.replace(".", "/"), m.group(3))); continue
            m = lnr.match(line)
            if m: cur["lines"].append((int(m.group(2)), int(m.group(1))))
        def first(meth): return meth["lines"][0][1] if meth and meth["lines"] else 0
        def pcline(meth, pc):
            best = None
            for p, l in meth["lines"]:
                if p <= pc and (best is None or p >= best[0]): best = (p, l)
            return best[1] if best else 0
        def short(meth): return meth["cls"].split(".")[-1].split("$")[-1] + "." + (meth["cls"].split(".")[-1].split("$")[-1] if meth["name"]=="<init>" else meth["name"])
        srcs = {}
        def text(f, l):
            if f not in srcs: srcs[f] = open(os.path.join(repo, f), errors="replace").read().split("\n")
            return srcs[f][l-1].strip()[:140] if 0 < l <= len(srcs[f]) else "?"
        C = Counter()
        for e in card["falseNegatives"]:
            m = re.match(r"(.*?):(\d+) (.*)", e["caller"]); cf, cl, cn = m.group(1), int(m.group(2)), m.group(3)
            m = re.match(r"(.*?):(\d+) (.*)", e["callee"]); tf, tl, tn = m.group(1), int(m.group(2)), m.group(3)
            tcls, tbase = tn.rsplit(".", 1)
            want = "<init>" if tbase == tcls else tbase
            base = os.path.basename(cf)
            found = []
            for meth in methods:
                if meth["file"] != base or not meth["eff"]: continue
                ef = meth["eff"]
                if not (short(ef).split(".")[-1] == cn.split(".")[-1] and first(ef) == cl): continue
                for pc, c, n in meth["inv"]:
                    if n == want:
                        found.append((meth, pcline(meth, pc)))
            if not found: kind = "UNEXPLAINED"
            else:
                kinds = set()
                for meth, l in found:
                    if meth is not meth["eff"]:
                        kinds.add("ORACLE-CLINIT-UNPARSED" if meth["name"] == "<clinit>" else "ORACLE-HEADER-UNPARSED")
                    elif meth["name"] == "<init>" and (l < first(meth) - 0 and l != first(meth)):
                        kinds.add("FIELD-INIT-IN-CTOR")
                    else:
                        kinds.add("GENUINE")
                kind = "GENUINE" if "GENUINE" in kinds else sorted(kinds)[0]
            C[kind] += 1
            print(kind, "|", e["caller"], "->", e["callee"])
            for meth, l in found[:3]:
                print(f"      true={short(meth)}[{meth['name']}]@{first(meth)} line {l}: {text(cf,l)}")
        print(C)
        EOF
