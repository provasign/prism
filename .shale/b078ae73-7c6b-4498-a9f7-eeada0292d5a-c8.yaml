        """Edit fuzzing: random realistic edits; after each, the incremental index must equal a full index of the same tree.
        usage: fuzz.py <bin> <src-repo> <lang> <steps> <seed>"""
        import json, os, random, re, shutil, sqlite3, subprocess, sys
        BIN, SRC, LANG, STEPS, SEED = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4]), int(sys.argv[5])
        EXT = {"python": ".py", "go": ".go", "typescript": ".ts", "javascript": ".js", "java": ".java", "csharp": ".cs", "c": ".c",
               "rust": ".rs", "php": ".php", "kotlin": ".kt", "swift": ".swift"}[LANG]
        SEMI = "" if LANG in ("python", "go", "kotlin", "swift") else ";"
        W = os.path.join(os.path.dirname(os.path.abspath(__file__)), "fz", os.path.basename(SRC.rstrip("/")) + f"-{SEED}")
        rng = random.Random(SEED)
        shutil.rmtree(W, ignore_errors=True)
        subprocess.run(["rsync", "-a", "--exclude", ".grove", "--exclude", ".git", SRC.rstrip("/") + "/", W + "/inc/"], check=True)
        def index(d):
            r = subprocess.run([BIN, "index", "."], cwd=d, capture_output=True, text=True, timeout=3600)
            return r.returncode
        index(W + "/inc")
        strip = lambda n: re.sub(r"@[0-9a-f]{40}", "", n or "")
        def snapshot(d):
            db = sqlite3.connect(d + "/.grove/grove.db")
            syms = set((strip(i), f, n, k, s, e, p) for i, f, n, k, s, e, p in db.execute("select id,file_path,name,kind,span_start,span_end,coalesce(parent_symbol,'') from symbols"))
            edges = set((strip(a), strip(b), t, src, l) for a, b, t, src, l in db.execute("select from_node,to_node,edge_type,source,lines from graph_edges"))
            return syms, edges
        def funcs(d):
            db = sqlite3.connect(d + "/.grove/grove.db")
            return [(f, n, s, e) for f, n, s, e in db.execute(
                "select file_path,name,span_start,span_end from symbols where kind in ('function','method') and file_path like ? and span_end > span_start + 1 and name not like '<%'", ("%" + EXT,))]
        def edit():
            fs = funcs(W + "/inc")
            if not fs: return "no functions"
            f, name, s, e = rng.choice(fs)
            path = os.path.join(W, "inc", f)
            lines = open(path, errors="replace").read().split("\n")
            if e > len(lines): return "span past EOF"
            other = rng.choice(fs)[1]
            kind = rng.choice(["call", "call", "delete", "add", "rename", "broken"])
            body = s  # 0-based index of the first body line
            while body < e - 1 and not lines[body].strip(): body += 1
            indent = re.match(r"\s*", lines[min(body, len(lines) - 1)]).group(0) or "    "
            if kind == "call":
                lines.insert(body, f"{indent}{other}(){SEMI}")
            elif kind == "delete":
                k = rng.randrange(body, max(body + 1, e - 1))
                if k < len(lines): del lines[k]
            elif kind == "add":
                new = f"fuzz_{rng.randrange(10**6)}"
                tpl = {"python": f"\ndef {new}():\n    {other}()\n", "go": f"\nfunc {new}() {{\n\t{other}()\n}}\n",
                       "typescript": f"\nexport function {new}() {{\n  {other}();\n}}\n", "javascript": f"\nfunction {new}() {{\n  {other}();\n}}\n",
                       "rust": f"\npub fn {new}() {{\n    {other}();\n}}\n", "c": f"\nvoid {new}(void) {{\n    {other}();\n}}\n",
                       "php": f"\nfunction {new}() {{\n    {other}();\n}}\n", "kotlin": f"\nfun {new}() {{\n    {other}()\n}}\n",
                       "swift": f"\nfunc {new}() {{\n    {other}()\n}}\n"}.get(LANG)
                if tpl is None: kind = "call"; lines.insert(body, f"{indent}{other}(){SEMI}")
                else: lines.append(tpl)
            elif kind == "rename":
                k = s - 1
                if k < len(lines) and re.search(r"\b" + re.escape(name) + r"\b", lines[k]):
                    lines[k] = re.sub(r"\b" + re.escape(name) + r"\b", name + "Fz", lines[k], count=1)
                else: kind = "rename-skip"
            elif kind == "broken":
                lines.insert(body, f"{indent}{other}(" + rng.choice(["'x", "\"", "{", "(1,"]))
            open(path, "w").write("\n".join(lines))
            return f"{kind} {f}:{s} {name} other={other}"
        bad = 0
        for step in range(STEPS):
            what = edit()
            index(W + "/inc")
            shutil.rmtree(W + "/full", ignore_errors=True)
            subprocess.run(["rsync", "-a", "--exclude", ".grove", W + "/inc/", W + "/full/"], check=True)
            index(W + "/full")
            (si, ei), (sf, ef) = snapshot(W + "/inc"), snapshot(W + "/full")
            ok = si == sf and ei == ef
            print(f"step {step}: {what} -> {'OK' if ok else 'DIFF'} syms -{len(sf-si)}/+{len(si-sf)} edges -{len(ef-ei)}/+{len(ei-ef)}", flush=True)
            if not ok:
                bad += 1
                for x in sorted(sf - si)[:3]: print("   sym missing", x)
                for x in sorted(si - sf)[:3]: print("   sym extra  ", x)
                for x in sorted(ef - ei)[:4]: print("   edge missing", x)
                for x in sorted(ei - ef)[:4]: print("   edge extra  ", x)
                # resync so later steps test fresh divergence
                shutil.rmtree(W + "/inc/.grove"); shutil.copytree(W + "/full/.grove", W + "/inc/.grove")
        print("DONE", SRC, LANG, "diffs", bad, "of", STEPS)
        EOF
        echo written
