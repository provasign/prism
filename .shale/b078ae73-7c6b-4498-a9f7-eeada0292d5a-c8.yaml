        """Replay each task's prism calls through one MCP session on a checkout at the task's base commit."""
        import json, subprocess, sys, os, time
        from pathlib import Path
        from concurrent.futures import ThreadPoolExecutor
        P2 = Path(__file__).parent
        BIN = sys.argv[1]
        calls = json.load(open(P2 / "calls.json"))
        by = {}
        for c in calls: by.setdefault(c["task"], []).append(c)
        out_dir = P2 / "out"; out_dir.mkdir(exist_ok=True)
        def run(task):
            cs = by[task]; dest = out_dir / (task + ".json")
            if dest.exists(): return task, "cached"
            wt = P2 / "wt" / task
            if not wt.exists():
                subprocess.run(["git", "clone", "-q", "--local", "--no-checkout", cs[0]["repo"], str(wt)], check=True, timeout=1800)
                subprocess.run(["git", "-C", str(wt), "checkout", "-q", cs[0]["base"]], check=True, timeout=1800)
            p = subprocess.Popen([BIN, "mcp", str(wt)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, bufsize=1)
            def rpc(i, method, params):
                p.stdin.write(json.dumps({"jsonrpc": "2.0", "id": i, "method": method, "params": params}) + "\n"); p.stdin.flush()
                while True:
                    l = p.stdout.readline()
                    if not l: return None
                    try: m = json.loads(l)
                    except Exception: continue
                    if m.get("id") == i: return m
            rpc(1, "initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "p2", "version": "0"}})
            p.stdin.write(json.dumps({"jsonrpc": "2.0", "method": "notifications/initialized"}) + "\n"); p.stdin.flush()
            res = []
            for k, c in enumerate(cs):
                t = time.time()
                m = rpc(k + 2, "tools/call", {"name": "prism", "arguments": {"op": c["op"], "args": c["args"]}})
                text = ("ERROR " + m["error"]["message"]) if m and m.get("error") else "\n".join(x.get("text", "") for x in ((m or {}).get("result") or {}).get("content", []))
                res.append({**c, "out": text, "secs": round(time.time() - t, 2)})
            p.stdin.close(); p.wait(timeout=60)
            json.dump(res, open(dest, "w"))
            return task, len(res)
        with ThreadPoolExecutor(4) as ex:
            for r in ex.map(run, sorted(by)): print(r, flush=True)
        EOF
