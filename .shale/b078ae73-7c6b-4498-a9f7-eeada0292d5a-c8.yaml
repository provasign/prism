)):\n        wt = os.path.join(P2, \"wt\", r[\"task\"])\n        out = r[\"out\"]\n        if out.startswith(\"ERROR\"): flag(\"error\", r, out[:200]); \n        check_lines(r, wt)\n        if r[\"op\"] == \"search\":\n            m = re.search(r\"COMPLETE — (\\d+) exact matches across (\\d+) files\", out)\n            a = r[\"args\"]; terms = a.get(\"terms\") or a.get(\"query\") or a.get(\"pattern\")\n            if m and isinstance(terms, list) and len(terms) == 1 and not a.get(\"regex\") and a.get(\"scope\") in (None, \"text\"):\n                paths = []\n                for pl in re.findall(r'restricted to path=\\[(.*?)\\]', out):\n                    paths = re.findall(r'\"([^\"]+)\"', pl)\n                cmd = [\"rg\", \"-F\", \"-c\", \"--hidden\", \"--no-messages\", \"-g\", \"!.grove\", \"-g\", \"!.git\", \"-g\", \"!.claude\", \"-g\", \"!.shale\"]\n                if not a.get(\"case_sensitive\"): cmd.append(\"-i\")\n                for g in a.get(\"glob\") or a.get(\"globs\") or []: cmd += [\"-g\", g]\n                cmd += [\"--\", terms[0]] + (paths or [\".\"])\n                rc = subprocess.run(cmd, cwd=wt, capture_output=True, text=True)\n                total = sum(int(x.rsplit(\":\", 1)[-1]) for x in rc.stdout.split() if \":\" in x) if len(paths or [\".\"]) != 1 or (paths and os.path.isdir(os.path.join(wt, paths[0]))) or not paths else sum(int(x) for x in rc.stdout.split() if x.isdigit())\n                if total != int(m.group(1)): flag(\"search-count\", r, f\"prism {m.group(1)} vs rg {total} term={terms[0]!r} paths={paths}\")\n        if r[\"op\"] == \"lookup\":\n            for m in re.finditer(r\"^// (\\w+) (\\S+)\\s+(\\S+?):(\\d+)-(\\d+)\", out, re.M):\n                kind, qn, fp, s, e = m.groups()\n                src = lines_of(wt, fp)\n                leaf = qn.split(\".\")[-1]\n                if src is None: flag(\"lookup-bad-file\", r, fp); continue\n                window = \"\\n\".join(src[int(s) - 1:int(s) + 4])\n                if leaf not in window and not leaf.startswith(\"<\"): flag(\"lookup-span-wrong\", r, f\"{qn} {fp}:{s}\")\n        if r[\"op\"] == \"change_impact\":\n            # every positioned call names the leaf at line:col\n            q = (r[\"args\"].get(\"name\") or r[\"args\"].get(\"query\") or \"\")\n            q = q[0] if isinstance(q, list) else q\n            leaf = q.split(\".\")[-1].split(\"(\")[0]\n            cur = None\n            for line in out.splitlines():\n                mm = re.match(r\"^\\s+(\\S.*?)\\s+(\\S+\\.\\w+):(\\d+)\\s+(?:\\[test\\]\\s+)?\\[(?:by name at|at) ([^\\];]+)\", line)\n                if not mm: continue\n                fp = mm.group(2); src = lines_of(wt, fp)\n                if src is None: continue\n                for pos in mm.group(4).split(\",\"):\n                    pos = pos.strip(); ln, _, col = pos.partition(\":\")\n                    if not ln.isdigit(): continue\n                    t = src[int(ln) - 1] if int(ln) <= len(src) else \"\"\n                    if leaf and leaf not in t: flag(\"impact-position-no-name\", r, f\"{fp}:{pos} leaf={leaf} line={t.strip()[:80]!r}\")\n            if \"safeToClaimComplete: true\" in out and leaf:\n                flag(\"impact-complete-claim\", r, leaf)  # audited separately\njson.dump(issues, open(P2 + \"/issues.json\", \"w\"), indent=1)\nfor k, v in sorted(issues.items(), [REDACTED:env-secret] kv: -len(kv[1])):\n    print(f\"{len(v):4d} {k}\")\n    for x in v[:4]: print(\"      \", x[\"task\"], x[\"op\"], x[\"detail\"][:160])\nEOF\npython3 check.py"
