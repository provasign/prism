        def _rename_message_keys(raw: str, f: str, a: int, b: int) -> tuple[str, int]:
            """Rename top-level `message` keys of object literals that are direct
            arguments in raw[a:b] (a call's argument span)."""
            m = de.mask(raw, f)
            edits, depth = [], 0
            i = a
            while i < b:
                ch = m[i]
                if ch in "([{":
                    depth += 1
                    if ch == "{" and depth == 1:
                        pass
                elif ch in ")]}":
                    depth -= 1
                elif depth == 1 and m.startswith("message", i) and not (m[i - 1].isalnum() or m[i - 1] in "_$.") \
