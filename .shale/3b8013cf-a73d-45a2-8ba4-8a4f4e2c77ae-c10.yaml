        """pass_to_pass check shared by the language scorers.

        Strict by default: every pass_to_pass test must have PASSED. Seeded wide
        tasks (wide_eval sets task["p2p_allow_renames"]) also accept a pass_to_pass
        test that is MISSING because the agent renamed it along with the code under
        test: 2026-10-10, both arms of deep__rich__loop_helpers_value_first renamed
        test_loop_first -> test_iter_first together with loop_first -> iter_first and
        were scored unresolved although every test passed. A missing test is
        accepted only when its group (test file / class) has no failure and still
        ran at least as many passing tests as pass_to_pass expects from it, so a
        deleted test (count drops) or a failing one still fails.
        """


        def group(name: str) -> str:
            for sep in ("::", " > "):
                if sep in name:
                    return name.split(sep, 1)[0]
            return ""  # e.g. Go test names: the whole run is one group


        def p2p_ok(res: dict, task: dict, ok=lambda r, n: r.get(n) == "PASSED") -> bool:
            p2p = task.get("pass_to_pass", []) or []
            if not task.get("p2p_allow_renames"):
                return all(ok(res, n) for n in p2p)
            missing = [n for n in p2p if n not in res]
            if any(not ok(res, n) for n in p2p if n in res):
                return False
            for g in {group(n) for n in missing}:
                in_group = [n for n in res if group(n) == g]
                if any(res[n] not in ("PASSED", "SKIPPED") for n in in_group if res[n] != "PASSED" and "FAIL" in str(res[n]).upper()):
                    return False
                expected = sum(1 for n in p2p if group(n) == g)
                if sum(1 for n in in_group if res[n] == "PASSED") < expected:
                    return False
            return True
        EOF
        cd .. && python3 - <<'EOF'
        import re
        edits={
         "scoring/docker_eval.py":('    p2p_ok = all(res.get(n) == "PASSED" for n in task.get("pass_to_pass", []))\n','    p2p_ok = p2p_check.p2p_ok(res, task)\n'),
         "scoring/go_eval.py":('    p2p_ok = all(res.get(n) == "PASSED" for n in task.get("pass_to_pass", []))\n','    p2p_ok = p2p_check.p2p_ok(res, task)\n'),
         "scoring/js_eval.py":('    p2p_ok = all(res.get(n) == "PASSED" for n in task.get("pass_to_pass", []))\n','    p2p_ok = p2p_check.p2p_ok(res, task)\n'),
         "scoring/java_eval.py":('    p2p_ok = all(_entry_ok(res, n) for n in task.get("pass_to_pass", []))\n','    p2p_ok = p2p_check.p2p_ok(res, task, _entry_ok)\n'),
        }
        for p,(a,b) in edits.items():
            s=open(p).read(); assert s.count(a)==1,p; s=s.replace(a,b)
            # add import after first import block line
            m=re.search(r'^import .*$',s,re.M)
            s=s[:m.start()]+"import p2p_check  # noqa: E402\n"+s[m.start():] if "import p2p_check" not in s else s
            open(p,"w").write(s)
        p="scoring/wide_eval.py"; s=open(p).read()
        a='    t = dict(task, kind=None, test_patch="", fail_to_pass=[])\n'
        assert a in s
        s=s.replace(a,'    t = dict(task, kind=None, test_patch="", fail_to_pass=[], p2p_allow_renames=True)\n')
        open(p,"w").write(s)
        print("ok")
        EOF
