        import pickle
        requests = pickle.load(open("/tmp/ctx_requests.pkl", "rb"))
        values = [v for v, _ in requests]
        n = len(values)

        def eval_cap(cap):
            clamped = [v for v in values if v > cap]
            lines_saved = sum(v - cap for v in clamped)
            lines_saved_vs_30 = sum(max(v,30) - min(v,30) for v in [])  # unused
            pct_clamped = len(clamped) / n * 100
            return len(clamped), pct_clamped, lines_saved

        print(f"n={n} real context= requests, current shipped cap=30\n")
        print(f"{'cap':>5} {'#clamped':>9} {'%clamped':>9} {'lines cut vs uncapped':>22}")
