                                ctx = inp.get("context")
                                if not ctx: continue
                                q = inp.get("query")
                                qs = q if isinstance(q, list) else [q]
                                # heuristic: single non-list query naming a def/class/function -> lookup-style
                                single_fn_lookup = len(qs) == 1 and any(
                                    kw in str(qs[0]) for kw in ("def ", "class ", "func "))
                                requests.append((ctx, single_fn_lookup))
        requests.sort()
        print(f"total real context= requests logged: {len(requests)}")
        print(requests)
        import pickle
        pickle.dump(requests, open("/tmp/ctx_requests.pkl", "wb"))
        EOF
