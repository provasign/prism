        import json, glob, os, time
        # windowfix fleet sessions = last ~2.5h
        dirs = [d for d in glob.glob(os.path.expanduser("~/.claude/projects/-private-var-folders-*e2e-run-*"))]
        now = time.time()
        recent = [d for d in dirs if now - os.path.getmtime(d) < 2.5*3600]
        old = [d for d in dirs if 20*3600 < now - os.path.getmtime(d) < 40*3600]

        def query_sizes(ds):
            sizes = []
            for d in ds:
                for f in glob.glob(d + "/*.jsonl"):
                    pending = set()
                    for line in open(f, errors="ignore"):
                        try: j = json.loads(line)
                        except: continue
                        if j.get("type") == "assistant":
                            for c in ((j.get("message") or {}).get("content") or []):
                                if isinstance(c, dict) and c.get("type") == "tool_use" and c["name"].endswith("prism_query"):
                                    pending.add(c["id"])
                        if j.get("type") == "user":
                            for c in ((j.get("message") or {}).get("content") or []):
                                if isinstance(c, dict) and c.get("type") == "tool_result" and c.get("tool_use_id") in pending:
                                    content = c.get("content")
                                    text = content[0].get("text","") if isinstance(content, list) and content else str(content)
                                    sizes.append(len(text))
            return sizes

        new = query_sizes(recent)
        prior = query_sizes(old)
        for name, s in (("windowfix fleet", new), ("earlier fleets", prior)):
            if s:
                print(f"{name:18} calls={len(s):3} avg={sum(s)/len(s):7.0f} max={max(s):6} total={sum(s):8}")
        EOF
