           which match nothing — deferred names carry the mcp__prism__ prefix. A
           probe following it verbatim got "No matching deferred tools found" and
           fell back to grep; the two fleet cells that engaged prism had typed the
           full names themselves. The line now uses full names.

        Measured on dubbo__e826b0c20d (wide bed): hop-and-use 4/5 repeats with
        all three fixes vs 2/11 fleet cells before. Guards added:
        TestSteeringBlock_DeferredToolsBootstrap (full-name select present),
