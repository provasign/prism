    - cmd: |-
        cat > /tmp/scan_wide.py <<'PYEOF'
        import subprocess, sys, os, collections, json

        def sh(*a, cwd=None):
            return subprocess.run(a, cwd=cwd, capture_output=True, text=True).stdout

        SRC_EXT = (".go", ".py", ".java", ".ts", ".js")
        def is_src(p):
            return p.endswith(SRC_EXT) and "test" not in p.lower() and "/vendor/" not in p

        repo = sys.argv[1]
        label = sys.argv[2]
        n = int(sys.argv[3]) if len(sys.argv) > 3 else 400
        hashes = sh("git", "log", "--no-merges", "-%d" % n, "--format=%H", cwd=repo).split()
        qual = []
        for h in hashes:
            files = [l for l in sh("git", "show", "--name-only", "--format=", h, cwd=repo).splitlines() if l.strip()]
            src = [f for f in files if is_src(f)]
            if len(src) < 4:
                continue
            subj = sh("git", "log", "-1", "--format=%s", h, cwd=repo).strip()
            qual.append({"sha": h[:10], "n_src": len(src), "subj": subj[:70], "files": src[:8]})
        qual.sort([REDACTED:env-secret] x: -x["n_src"])
        print(f"=== {label}: {len(qual)} commits touching >=4 source files (of {len(hashes)} scanned) ===")
        for q in qual[:12]:
            print(f"  {q['n_src']:3} src  {q['sha']}  {q['subj']}")
        json.dump(qual, open(f"/tmp/wide_{label}.json","w"), indent=1)
        PYEOF
        python3 /tmp/scan_wide.py ~/.cache/prism-research/routing-repos/pallets__werkzeug werkzeug 400
