        steering: make the ToolSearch bootstrap an imperative, not a conditional

        The line restored earlier this session ("If you do not see prism_* in
        your tool list, they are DEFERRED, not absent...") is troubleshooting-
        shaped: it only fires if the agent notices an absence before acting.
        Nothing forces that check, and it competes against a much stronger
        prior -- reach for grep on the described symptom -- that requires
        noticing nothing.

        Transcript review of the wide-bed fleet found this exact failure mode:
        in 5 of 8 prism_plus cells the agent either never called ToolSearch or
        called it only after one or more greps had already run. Two cells
        never called it at all across the whole session.

        Probed the fix directly: swapped the conditional line for an
        unconditional imperative ("Before your first tool call, run this...")
        and reran the same task 15 times across 4 wide-bed tasks (dubbo x3,
        grove, prism). Conditional wording: ToolSearch as the literal first
        tool call in 2/3 sessions, one session never called it. Imperative
        wording: 15/15. Recall was flat either way -- every task in the probe
        sits on its own task-inherent ceiling (ambiguous commit subject, or an
        answer genuinely unreachable without network access) -- so this is a
        routing fix, not a quality claim. An "enticement" variant (imperative +
        a one-call-vs-many-greps benefit line) was also probed and showed no
        separation from the bare imperative at n=3, so it was not shipped;
        the bare imperative is what's landing here.

        Guard test extended: TestSteeringBlock_DeferredToolsBootstrap now
        pins the "Before your first tool call" phrasing and fails if the old
        conditional phrasing reappears.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_01HTYLuNJPfgEAXJykbHPpHT
        EOF
