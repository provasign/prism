        a \"--\" between them, and matches on consecutive lines repeated both
        lines — a reported 988-byte result whose second half was its first half
        again. renderContextHits now collects every line once per file, prints
        in line order, joins contiguous runs, and puts \"--\" only between runs
        that do not touch. Trailing newlines in hit text no longer become blank
        lines.

