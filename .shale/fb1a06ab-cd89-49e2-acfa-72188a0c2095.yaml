    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness && python3 - <<'EOF'
        import read_after_locate as R, json, glob, re, statistics
        R._PATH = re.compile(r"(?<![\w/.-])((?:[\w.-]+/)+[\w.-]+\.[A-Za-z]{1,5})(?=[:\s`)\]\",]|$)")
        R.WINDOW = 100000
        # patch analyze to expose gaps: re-implement minimal walk
        def gaps(tp):
            uses={}; events=[]; t=0
            for line in open(tp,errors='ignore'):
                try: j=json.loads(line)
                except: continue
                if j.get('type')=='assistant':
                    for c in (j.get('message') or {}).get('content') or []:
                        if isinstance(c,dict) and c.get('type')=='tool_use': t+=1; events.append((t,'use',c)); uses[c['id']]=c
                elif j.get('type')=='user':
                    for c in (j.get('message') or {}).get('content') or []:
                        if isinstance(c,dict) and c.get('type')=='tool_result': events.append((t,'result',c))
            located=[]; out=[]; edits_after_read=0; reads=0
            last_read_file=None
            for turn,kind,c in events:
                if kind=='result':
                    u=uses.get(c.get('tool_use_id'))
                    if u and u['name'] in R.PRISM:
                        p=R._paths(R._result_text(c))
                        if p: located.append((turn,p))
                elif kind=='use':
                    if c['name']=='Read':
                        reads+=1; fp=str(c['input'].get('file_path',''))
                        for lt,paths in located:
                            if any(fp.endswith(p) for p in paths): out.append(turn-lt); break
                        last_read_file=fp
                    elif c['name']=='Edit' and last_read_file and str(c['input'].get('file_path',''))==last_read_file:
                        edits_after_read+=1
            return out, reads, edits_after_read
        allg=[]
        for p in sorted(glob.glob('runs/wide/*.prism_plus.v070sample.json')):
            cell=json.load(open(p)); tp=R._fingerprint_match(cell['tool_trace'])
            if not tp: continue
            g,reads,ear=gaps(tp); allg+=g
            print(f"{cell['task']:20} reads={reads:3} after_locate={len(g):3} gap turns: median={statistics.median(g) if g else '-'} <=10:{sum(1 for x in g if x<=10)} >10:{sum(1 for x in g if x>10)}  read->edit-same-file={ear}")
        print('ALL: n=',len(allg),'median gap',statistics.median(allg),'<=10:',sum(1 for x in allg if x<=10),'>10:',sum(1 for x in allg if x>10))
        EOF
