            for l in tl.splitlines(): found.append("xref issue #"+l[:60])
            return t["instance_id"],found
        with ThreadPoolExecutor(6) as ex: res=list(ex.map(check,tasks.values()))
        for iid,f in sorted(res): print(f"{iid:44s} {f if f else 'NONE'}")
