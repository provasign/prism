        def stats(a):
            f = glob.glob(os.path.expanduser(f"~/.claude/projects/*/{a.get('session_id')}.jsonl"))
            t = collections.Counter(); rule = False
            if f:
                for l in open(f[0]):
                    if 'Mechanical renames' in l: rule = True
                    d = json.loads(l)
                    if d.get('type') == 'assistant':
                        for p in d['message'].get('content') or []:
