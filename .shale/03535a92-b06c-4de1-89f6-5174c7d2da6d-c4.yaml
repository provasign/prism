                if re.search(r'extends|implements|\(\s*\w+\s*\)\s*:|: *\w+\s*\{|super\(|@Override|abstract',pat): return 'grep:subtypes/overrides'
                if re.search(r'test',str(ctx),re.I) and not re.search(r'--exclude',str(ctx)): return 'grep:in-tests'
                if DEF.search(pat) or pat.startswith('^'): return 'grep:definition'
                if re.search(r'\\\.|\.\w+\\?\(|\w\\?\($|\\\(|\(',pat): return 'grep:call-sites'
