            c=i.get('command','')
            m=re.search(r'''(?:grep|rg|git grep)\s+(?:-[\w-]+(?:\s+\S+)?\s+)*(?:"([^"]+)"|'([^']+)'|(\S+))''',c)
            return ((m.group(1) or m.group(2) or m.group(3)) if m else c[:80]), c
        def classify(n,i):
            c=i.get('command','') if isinstance(i,dict) else ''
            if n=='Read':
                return 'read:range' if i.get('offset') or i.get('limit') else 'read:whole-file'
            if n=='Glob' or (n.lower()=='bash' and re.search(r'(^|[;&|]\s*)(find|ls)\b',c) and not re.search(r'grep',c)):
                return 'list-files'
            if n.lower()=='bash' and re.search(r'\b(cat|sed -n|head|tail|nl|awk)\b',c) and not re.search(r'\b(grep|rg)\b',c):
                return 'read:range' if re.search(r'sed -n|head|tail|awk',c) else 'read:whole-file'
            if n=='Grep' or (n.lower()=='bash' and re.search(r'\b(grep|rg|git grep)\b',c)):
                if re.search(r'sed -i|perl -pi',c): return None
                pat,ctx=pattern_of(n,i)
