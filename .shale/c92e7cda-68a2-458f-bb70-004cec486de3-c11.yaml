        cd ~/Projects/provasign/prism && git commit -q -m "$(cat <<'EOF'
        feat: explicit grep/rg-blocked warning in steering when denyBuiltinSearch is active (v0.47.0)

        The deny mechanism (v0.38.0+) stops a grep/rg call from succeeding, but
        says nothing to the model in advance -- steering never told it the tool
        was gone. Measured live (2026-08-11): an agent tried grep anyway out of
        habit, ate a denial, recovered via prism_search -- one wasted turn per
        occurrence. A second cell with an explicit warning added ran clean: zero
        grep/rg attempts, zero denials.

        Conditional on denyBuiltinSearch, not unconditional: writeSteeringInstructions
        previously ran BEFORE the deny-prompt resolved, so the flag wasn't known
        yet at write time. Reordered cmdInit so the prompt resolves first, then
        threaded denyBuiltinSearch through to steeringBlock(), which now inserts
        one paragraph ("grep, rg, and the built-in Grep tool are BLOCKED... any
        attempt fails and wastes a turn") only for repos where they actually are
        blocked. Users who decline the deny prompt (most) see no change -- telling
        them grep is blocked would be false.

        Pinned by TestSteeringBlock_GrepWarningOnlyWhenDenied. Repo steering
        regenerated (this machine has deny active on all provasign repos).

        Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
        EOF
