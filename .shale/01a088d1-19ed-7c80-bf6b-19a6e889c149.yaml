        +			t.Errorf("missing %s; calls=%v", want, got)
        +		}
        +	}
        +	for _, bad := range []string{"use.go:UseA -> b/b.go:Run", "use.go:UseB -> a/a.go:Run"} {
        +		if got[bad] {
        +			t.Errorf("alias leaked: %s", bad)
        +		}
        +	}
        +}
