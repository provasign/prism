        feat: text search inside prism, narrower tool surface, delivery dedup

        Agents route around a graph tool when a text tool sits next to it — measured
        12:1 grep-over-prism in the e2e pilot. So text search moves INSIDE prism and
        the agent prices each request itself.

        internal/textsearch: a real full-text search. Backend is prism's choice, made
        once per process and reported by `prism doctor`: ripgrep, then grep (pinned
        LC_ALL=C — GNU grep's multibyte path is several times slower), then a
        built-in Go scanner so the capability exists everywhere with no external
        dependency. Flag-injection safe (pattern after -e, paths after --), fixed
        strings by default with opt-in regex that degrades to literal when it does
        not compile, bounded by per-file/total/line caps and a timeout.

        prism_search gains scope=text|symbols|both and regex. scope="text" is a pure
        grep — exactly the rg hits, cheapest envelope — because routing every locate
        through enriched delivery cost ~46% more for identical results, and letting
        the agent ask for what it needs took that to ~2%. prism_query merges text
        hits into retrieval: a hit inside an already-seeded symbol confirms it, a hit
        inside an indexed symbol the graph missed promotes it to a seed, and a hit no
        symbol encloses is delivered raw. Session-SHA discipline extends to text
        hits: a file already delivered unchanged comes back as line numbers only.

        Noisy searches now say so. Measured over 127 symbols in 6 repos, ~30% of
        whole-word grep hits are not resolved references (98% in one typeorm case:
        372 hits, 1 real). The graph does not find lines grep misses — it knows which
        hits matter — so the note reports the ratio, never a claim of hidden sites,
        and stays silent when grep was already precise.

        Graph-delivery dedup (graphcache.go): the whole-repo ops are prism's fattest
        payloads. Every call recomputes — freshness proven, not assumed — and only a
        byte-identical repeat collapses to a [prism:cached] pointer with group
        counts, gated on the same attention-window confidence the file compressor
        uses. A result that changed by one site is always delivered in full: these
        are complete-set tools, and a delta the agent must mentally merge is the
        failure mode the relay rule exists to prevent. verify and arch_check are
        excluded — a gate's verdict always ships whole (pinned by a test).

        Those same ops now delta-reindex first, for the reason toolVerify already
        did: a long-lived server answered change_impact from a stale graph and the
        dedup then described the stale answer as "recomputed" (found live against
        gin: an added caller stayed invisible until reindex).

        Tool surface 19 -> 15. prism_evidence deleted (no CLI command, no consumer;
        mason's payload isolation superseded it). resolve/edges/cycles/drift stay
        CLI-only and Invoke-able but leave tools/list: search now tags test doubles,
        map already carries cycles, and the gates reindex themselves. A test pins the
        count and the removed names so the surface cannot quietly regrow.

