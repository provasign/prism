        paths=['tasks/grafana-querydata-impact.json','tasks/grafana-checkhealth-impact.json']
        rows=[]
        try:
            for trial in range(1,4):
                for path in paths:
                    task=Task.load(path)
                    rec=run_cell(arm,task,Path(task.workdir or task.repo),'sonnet',out,binary,sha,fresh=True,accounting=accounting)
