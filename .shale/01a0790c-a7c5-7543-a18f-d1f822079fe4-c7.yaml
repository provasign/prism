        from pathlib import Path
        from ab_gate import RunAccounting, arm_for, binary_sha, run_cell
        from schema import Task

        binary=str(Path('~/bin/prism').expanduser().resolve())
        out=Path('runs/agent-reliability-grafana')
        out.mkdir(parents=True, exist_ok=True)
        accounting=RunAccounting(out, {'purpose':'three fresh Sonnet trials per corrected Grafana task','model':'sonnet','trials':3})
        arm=arm_for(binary,'grafana-reliability')
