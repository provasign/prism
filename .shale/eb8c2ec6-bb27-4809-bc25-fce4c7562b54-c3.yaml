    - cmd: |-
        git add internal/cli/formattext_test.go internal/cli/helpers_test.go && git commit -m "$(cat <<'EOF'
        fix(test): drain captured stdout concurrently, not after fn() returns

        captureStdout/capture wrote to an os.Pipe() and only read it back after fn()
        returned. An anonymous pipe's OS buffer is finite and much smaller on
        Windows than Linux/macOS, so any fn() whose stdout exceeded that size
        blocked forever waiting for a reader that never came until fn() finished --
        which fn() couldn't do. Hit in CI (windows-latest only) once cmdDoctor's
        output grew past a few KB with the new per-language capability manifest
        (v0.81.1). Test-only: cmdDoctor and the shipped binary were never affected,
        only these two test helpers.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_015EeaTQYczmqXMfyKzc1mqD
        EOF
