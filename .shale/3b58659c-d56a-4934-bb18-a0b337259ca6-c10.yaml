        import json, glob, os, re
        # Parse query results' markdown for file windows: lines like "### path (lines A-B)",
        # "// path — ..." , backticked paths with :line, and windows headers.
        re_paths = re.compile(r'(?m)(?:^|[`(\s])((?:[A-Za-z0-9_.-]+/)+[A-Za-z0-9_.-]+\.[A-Za-z0-9]{1,8})(?::(\d+))?')
        files = glob.glob(os.path.expanduser("~/.claude/projects/*/*.jsonl"))
        pending = {}
        tot_q = 0; q_overlap = 0; q_chars = 0; q_overlap_est_chars = 0
        for f in files:
            delivered = set()
            try: fh = open(f)
            except Exception: continue
            for line in fh:
                if "mcp__prism__" not in line and "tool_result" not in line: continue
                try: rec = json.loads(line)
                except Exception: continue
                content = (rec.get("message") or {}).get("content")
                if not isinstance(content, list): continue
                for c in content:
                    if c.get("type") == "tool_use" and str(c.get("name","")).startswith("mcp__prism__"):
                        pending[c["id"]] = (c["name"], c.get("input") or {})
                    elif c.get("type") == "tool_result" and c.get("tool_use_id") in pending:
                        name, inp = pending.pop(c["tool_use_id"])
                        body = c.get("content"); s = json.dumps(body) if not isinstance(body, str) else body
                        if name.endswith("prism_read"):
                            delivered.add(inp.get("file",""))
                        elif name.endswith("prism_query"):
                            tot_q += 1; q_chars += len(s)
                            qfiles = {m.group(1) for m in re_paths.finditer(s)}
                            ov = qfiles & delivered
                            if ov:
                                q_overlap += 1
                                # estimate overlapped share: proportion of matched paths already delivered
                                q_overlap_est_chars += int(len(s) * len(ov) / max(len(qfiles),1))
                            delivered |= qfiles
                        elif name.endswith("prism_lookup"):
                            if inp.get("file"): delivered.add(inp["file"])
        print(f"QUERY calls: {tot_q}, total {q_chars} chars")
        print(f"calls touching >=1 already-delivered file: {q_overlap} ({100*q_overlap/max(tot_q,1):.0f}%)")
        print(f"estimated overlapped content: ~{q_overlap_est_chars} chars (~{q_overlap_est_chars//4} tok, {100*q_overlap_est_chars/max(q_chars,1):.0f}% of query bytes)")
        EOF
