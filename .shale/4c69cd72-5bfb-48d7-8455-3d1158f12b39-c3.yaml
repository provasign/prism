        # Why the Prism arm sometimes costs far more tokens than native (heavy-cell review, 2026-09-26)

        Data: `sweep-2026-09-26/headline` (prism ~v0.83.0) and `v0831-lang-2026-09-26/headline` (v0.83.1).
        17 heavy cells (prism/native tokens >= 1.4) and 7 cheap cells (<= 0.5). All 48 transcripts found; recomputed
        token totals match `results.json` exactly. Scripts and per-session traces: `parse.py`, `buckets.py`, `traces/`.

        ## Bottom line

        - In the 17 heavy cells, prism used 26.8M tokens against native's 15.5M. That is 11.3M extra.
        - The biggest Prism-caused share is **large search results carried in context for the rest of the session** (38%).
          Default `search` returns 11-18k characters (grep-style windows with context for every match, plus full
          enclosing bodies, often of test functions). Native Grep returns 0.1-3.5k. Every later turn re-reads that payload
          from cache, so a 15k-char result in turn 1 of a 40-turn session costs ~160k tokens.
        - **Build/test/environment churn is 36%** of the extra tokens, but it is luck, not the arm: across all 93 paired cells
          the prism arm has *fewer* env/build turns (mean 7.5 vs 8.3; prism more in 30 cells, fewer in 50).
        - **Fixed per-turn overhead is 12%**: the prism arm starts every turn ~3.23k tokens heavier (median across 93 cells).
        - The rest: extra discovery turns 6.5%, edits 7% (one-edit-per-turn, broader fix designs).
        - Across all 93 cells prism is still 0.954x native. The cheap cells win by **turn count** (8-14 turns vs 22-41):
          a batched `lookup` with bodies for named symbols, then straight to Edit.

        ## Method

        Each API call costs `context + output`. Context = first-turn context (b0) + everything added since. I split each
        session's total into (1) b0 per turn and (2) "carry": each tool result's size (measured as the context growth after
        that turn, split across parallel calls by characters) times the number of later turns. This split is exact
        (check column = 0). Then:
        - **fixed overhead** = prism turns x (b0_prism - b0_native)
        - **turn-count effect** = (prism turns - native turns) x b0_native
        - **context growth** = the rest (bigger or longer-lived tool results)

        The activity columns below split the same delta differently (exactly additive with fixed overhead): each call is
        charged b0_native for its turn plus its carry. Activities: discovery (prism, Read, Grep/Glob, Bash grep/sed/cat on
        source), edit (Edit/Write on source), env (build, test, installs, ~/.m2, pom, venv, curl, repro scratch files,
        surefire reports, git status/diff/stash).

        ## Where the extra tokens go (17 heavy cells, delta = 11.29M)

        | bucket | tokens | share | Prism-caused? |
        |---|---|---|---|
        | Discovery payload carry (bigger results kept in context) | 4.33M | 38.3% | yes, mostly default `search` size |
        | Env / build / test / repro churn | 4.10M | 36.3% | no; luck and agent persistence (see all-cell check) |
        | Fixed per-turn overhead (schema + steering + server instructions) | 1.35M | 12.0% | yes |
        | Edits (extra edit turns and their carry) | 0.78M | 6.9% | no; agent edit mechanics and fix design |
        | Extra discovery turns | 0.73M | 6.5% | partly (results that did not answer the question) |

        Gross prism-result carry in the heavy prism arms is 4.59M. Of that, 2.51M is payload above ~1.5k tokens per
        search/query call.

        Prism result sizes over all 93 cells: median 3.8k chars, p75 8.9k, p90 14.9k, 84 of 296 results over 8k.
        Native discovery results: median 1.0k, p75 2.7k, p90 5.5k.

        Inside the 22 search results over 8k chars in these cells: ~44% is per-term match listings with ±2 context lines
        (including every test-file hit), ~34% is full enclosing bodies (often test functions or callers, not the target),
        ~19% is symbol lists.

        ## Per-cell decomposition

        Tokens in thousands. "turns" = API calls. disc/edit/env are prism-minus-native by activity.

