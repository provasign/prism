        new2='''    hits = [v for k, v in res.items() if k.split("::")[0] == entry]
            # a @Disabled/assumption-skipped method neither passes nor fails the class
            return "PASSED" in hits and all(v in ("PASSED", "SKIPPED") for v in hits)'''
