        import pickle,re,collections,json
        from parse import cat
        d=pickle.load(open('data.pkl','rb'))
        PATH=re.compile(r'([\w./-]+\.(?:java|go|py|ts|tsx|js|c|h|kt|rs|php|rb))')
        NUM=re.compile(r'^\s*(\d+)(?:\t|[-:] )')
        def delivered(res):
            cur=None; out=collections.defaultdict(set)
            for line in res.split('\n'):
                m=NUM.match(line)
                if m and cur: out[cur].add(int(m.group(1))); continue
                # file:NN: text form
                m2=re.match(r'^\s*([\w./-]+\.\w+):(\d+)[:-] ',line)
                if m2: out[m2.group(1)].add(int(m2.group(2))); continue
                p=PATH.findall(line)
                if p: cur=p[-1]
            return out
        def norm(p): return p.split('/e2e-run-')[-1].split('/',1)[-1] if '/e2e-run-' in p else p
        def match(a,b): return a.endswith(b) or b.endswith(a)
        res={}
        for k,v in d.items():
            P=v['prism']; n=P['n']; b0N=v['native']['b0']
            seen=collections.defaultdict(set); rows=[]
            for t in P['order']:
                cst=(b0N+P['calls'][t['turn']]['out'])/len(P['calls'][t['turn']]['tools'])+t['carry']
                if t['name']=='Read':
                    f=norm(t['input'].get('file_path','')); off=t['input'].get('offset') or 1; lim=t['input'].get('limit') or 2000
                    got=set(ln for ln in t['res'] and [int(m.group(1)) for m in (NUM.match(l) for l in t['res'].split('\n')) if m] or [])
                    prev=set()
                    for sf,ls in seen.items():
                        if match(f,sf): prev|=ls
                    ov=len(got&prev)/max(1,len(got))
                    rows.append((t['turn'],'Read',f,off,len(got),round(ov,2),int(cst),t['reslen']))
                if t['name']=='mcp__prism__prism':
                    for f,ls in delivered(t['res']).items(): seen[f]|=ls
            res[k]=rows
        for k,rows in res.items():
            if d[k]['ratio']<1.4: continue
            for r in rows: print(k[:40],r)
        EOF
