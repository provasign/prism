        		return true
        	}
        	dir := path.Dir(declFile)
        	return dir == module || strings.HasPrefix(dir, module+"/")
        }

        // enclosingSymbolLocked is the tightest indexed symbol spanning file:line.
        func (g *CodeGraph) enclosingSymbolLocked(file string, line int) core.SymbolRecord {
        	var best core.SymbolRecord
        	for _, id := range g.idsInFile(file) {
        		s := g.symbols[id]
