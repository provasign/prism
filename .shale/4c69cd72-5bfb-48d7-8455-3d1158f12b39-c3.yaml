        def bucket(t):
            c=cat(t)
            if c in('prism','read','grep'): return 'disc'
            if c=='navbash':
                return 'env' if ENV.search(t['input'].get('command','')) else 'disc'
            if c in('build','bash-other'): return 'env'
            if c=='edit':
                p=t['input'].get('file_path','')
                return 'env' if re.search(r'(Scratch|zzrepro|play\.ts|Repro|/tmp/)',p) else 'edit'
            if c=='notool': return 'final'
            return 'other'
        B=['disc','edit','env','other']
        def cost(a,b0ref):
            turn=collections.Counter(); carry=collections.Counter(); cnt=collections.Counter()
            for i,c in enumerate(a['calls']):
                rem=a['n']-i-1
                if not c['tools']: turn['final']+=b0ref+c['out']; carry['final']+=c['g']*rem; continue
                k=len(c['tools'])
                for t in c['tools']:
                    b=bucket(t); turn[b]+=(b0ref+c['out'])/k; carry[b]+=t['carry']; cnt[b]+=1/k
            return turn,carry,cnt
        def pcap(a,cap_tok):
            s=0
            for i,c in enumerate(a['calls']):
                rem=a['n']-i-1
                for t in c['tools']:
                    if t['name']=='mcp__prism__prism' and t['input'].get('op') in ('search','query'):
                        s+=max(0,t['size']-cap_tok)*rem
            return s
        agg=collections.Counter()
        rows=[]
        for k,v in sorted(d.items(),[REDACTED:env-secret] x:-x[1]['ratio']):
            N,P=v['native'],v['prism']
            tN,cN,nN=cost(N,N['b0']); tP,cP,nP=cost(P,N['b0'])
            fixed=P['n']*(P['b0']-N['b0'])
            delta=P['total']-N['total']
            r={'cell':k,'ratio':v['ratio'],'delta':delta,'fixed':fixed}
            for b in B+['final']:
                r[b+'_turn']=tP[b]-tN[b]; r[b+'_carry']=cP[b]-cN[b]; r[b+'_n']=(nN[b],nP[b])
            r['check']=fixed+sum(r[b+'_turn']+r[b+'_carry'] for b in B+['final'])-delta
            # prism payload
            pr=[(t['input'].get('op'),t['reslen'],int(t['size']),int(t['carry'])) for t in P['order'] if t['name']=='mcp__prism__prism']
            r['prism_calls']=pr
            r['prism_carry']=sum(x[3] for x in pr)
            r['cap1500']=pcap(P,1500); r['cap1000']=pcap(P,1000)
            rows.append(r)
            if v['ratio']>=1.4:
                for kk in r:
                    if isinstance(r[kk],(int,float)) and kk not in('ratio',): agg[kk]+=r[kk]
        pickle.dump(rows,open('rows.pkl','wb'))
        print('%-42s %5s %8s %7s | %8s %8s | %8s %8s | %8s %8s | %7s %7s | %7s %7s'%('cell','ratio','delta','fixed','discT','discC','editT','editC','envT','envC','chk','pcarry','cap1.5k','cap1k'))
        for r in rows:
            print('%-42s %5.2f %8d %7d | %8d %8d | %8d %8d | %8d %8d | %7d %7d | %7d %7d'%(r['cell'][:42],r['ratio'],r['delta'],r['fixed'],r['disc_turn'],r['disc_carry'],r['edit_turn'],r['edit_carry'],r['env_turn'],r['env_carry'],r['check'],r['prism_carry'],r['cap1500'],r['cap1000']))
        print({k:int(v) for k,v in agg.items()})
