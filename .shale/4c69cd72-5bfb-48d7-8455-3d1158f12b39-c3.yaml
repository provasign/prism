          prism did *not* deliver (surrounding class/file).
        - (c) env churn: pr5994, pr5943, dubbo16391, zod, pr5959, hono, click3471 — 36% of the delta, arm-agnostic.
        - (d) broader design: jansson731, commons-lang1709, xml827.
        - (e) edit mechanics (1750: 9 single edits), wrong tool name (5959), cleanup turns.

        ## What the cheap cells did right

        Seven cells where prism was <= 0.5x (prism 3.42M vs native 9.57M): the prism arm finished in 8-14 turns vs 17-41.
        Turn-count effect -4.0M, growth -2.3M.

        - **gson pr3000 (0.34x):** one `lookup {"name":["JsonReader.nextInt","JsonReader.nextLong","JsonReader.nextDouble"],
          "fields":["signature","body"]}` (5.3k) -> 3 Edits -> mvn. No Read. Native: 2 Greps, a 370-line Read (13.8k chars),
          3 more small Reads between 9 Edits.
        - **urfave/cli pr2290 (0.31x):** batched `lookup` of 3 names with bodies, one `read`, one search, Edit. Native: 13
          Greps, then `git log -p -L`, `git show` archaeology.
        - **click pr3473 (0.26x):** symbols search + one 4-name lookup with bodies + one text search -> 2 Edits. Native:
          10 Reads, 10 grep/sed, uv/pytest version churn (41 turns).
        - **jackson-databind pr6008 (0.39x):** two big searches (13.7k, 17.6k) still paid off because the session was 13
          turns; native spent 36 turns on git archaeology and a wider 5-file edit.

        Pattern: named symbols in the issue -> one batched lookup with bodies -> edit. Big payloads also appear in cheap
        cells, but a short session carries them for few turns. Payload size matters in proportion to the remaining turns.

        ## Fixed overhead, measured

        Median first-turn context difference prism - native over 93 cells: **3,231 tokens** (range 2,476-3,239).
        On the released v0.83.3 binary:

        | part | size | est. tokens |
        |---|---|---|
        | Tool schema (`tools/list`, one `prism` tool under `--compact`; description 76 chars, inputSchema 4,198) | 4,327 chars JSON | ~1.4-1.6k |
        | CLAUDE.md block written by `prism init` | 2,317 chars | ~0.6k |
        | MCP server instructions (`initialize.instructions`) | 1,418 chars | ~0.35k |
        | unattributed (host wrappers for MCP tool/instructions, CLAUDE.md framing) | — | ~0.7-0.9k |

        Token counts are estimates (no API key here for `count_tokens`). The v0.83.1 transcripts show the same sizes
        (CLAUDE.md 2,291, instructions 1,427). The CLAUDE.md block and the server instructions repeat the same op map
        (lookup/read/search/query/change_impact, batching, terms array, verify policy). CLAUDE.md also carries a ToolSearch
        bootstrap and a CLI fallback that do nothing when the tool is resident (the harness sets `alwaysLoad`).

        Across all 93 cells the overhead is ~5.1M (1,571 prism turns x 3.2k), 5.3% of prism-arm tokens. In dollars it is
        mostly cache reads.

        ## Observed host behavior worth knowing

        - **Edit did not require a prior Read in these sessions.** All 64 prism-arm Edits succeeded, including many with no
          Read of that file at all (gin4698 `recovery.go`, click3471, jansson, gson, urfave2290). The server-instructions
          wording ("In hosts that require a native Read before Edit, use one tight native Read") is correct. Steering must not
          assume a Read is mandatory.
        - Every v0.83.1 prism session's first result ended with a 416-char "multiple Prism installations" warning
          (`/opt/homebrew/bin/prism` v0.82.2 is installed on the bench machine). Small (~100 tokens x turns), but it is
          a harness artifact.
        - The harness read-guard denied a Read of a range after the file had been edited (pr5959). The guard should drop
          a file's delivered ranges when the file changes.

        ## Proposed Prism changes, ranked by estimated savings on the 17 heavy cells

        Savings are carry-model estimates (payload above the new size x remaining turns). They do not include possible
        follow-up calls, which I estimate separately. Percentages are of the 11.29M extra.

        ### 1. A size budget for default `search` output (est. -2.2M net, ~20% of the extra; ~-0.3M more in the cheap cells)

        Capping each search/query result near 1.5k tokens (~6k chars) saves 2.51M of carry in these cells (a 1k cap: 2.80M).
        Subtract ~0.3M for maybe 6 follow-up turns at ~50k each when something needed was cut.
        Keep the part that saves turns and cut the part that rides along:
        - Per-term match listings: bare `file:line: text` (no ±2 context) once a term has more than ~8 hits; cap ~25 lines
          per term with `+N more in M files (exhaustive=true for all)`. Group test-file hits into per-file counts unless
          `paths`/`glob` targets tests.
        - Bodies: at most one, for the top non-test anchor, capped ~60 lines. No full bodies of test functions or of callers
          picked by "evidence rank" (echo3006 got `TestConcurrentRouter_Remove`; the probe below got the 97-line caller
          `writeSteeringInstructions` for a one-line target).
        - Probe on v0.83.3 (prism's own repo, `terms:["steeringBlock","compactInstructions"]`): default = 14.7-15.4k chars;
          with `scope=text, files_only` = 593 chars.

        Risk: v0.82.0 shipped full-body search to cut turns (turn-economics work). Removing the *one* top body would bring the
        follow-up lookup back, so keep it. The break-even is about 20 remaining turns: a follow-up turn costs ~45-60k, and
        2.5k extra tokens carried for 20 turns costs the same. Heavy sessions run 15-58 turns. Gate on the fail-fast A/B
        (recall must not drop).

        ### 2. Honor `files_only` in every scope (est. -0.3M; zero risk, bug)

        v0.83.3 repro: `search {"terms":[...],"files_only":true}` (default scope) = 3,036 chars with a symbol list, caller
        summaries and match lines. With `"scope":"text"` = 593 chars. In pr5959 the agent asked for test files only and got
        18,246 chars. The steering tells agents to use `files_only` for tests, so this bug hits exactly the recommended path.

        ### 3. `scope=symbols` returns locators only; a class `lookup` returns an outline (est. -0.2 to -0.3M; low risk)

        dubbo16395: `scope=symbols` returned 8.6k chars of bodies inside a 15.6k result; `lookup AbstractStateRouter` returned
        the whole 7.4k class. A class outline (members with signatures and line ranges) plus "lookup Class.member for a body"
        fits the need. commons-lang1750 shows the reverse gap: a symbols list with no bodies led to a 350-line Read. A
        `lookup` that returns all overloads' bodies up to a budget would have covered it.

        ### 4. Cut the duplicated fixed overhead (est. -0.3 to -0.43M here, -1.1 to -1.6M across all 93 cells)

        Target ~0.7-1k tokens per turn:
        - Keep the op map in one surface. In Claude Code both CLAUDE.md and the server instructions load, so the op map,
          batching rule, terms-array rule and verify policy appear twice.
        - `prism init --harness claude` with a resident tool could drop the ToolSearch and CLI-fallback lines.
        - Trim schema descriptions (the repeated "ops: X." prefixes, rarely used args such as `base`, `max_results`).

        Risk: highest of the list. Past steering trims lowered adoption, and zod6439 made zero prism calls even with the full
        text. CLAUDE.md survives context compaction and server instructions are missing on some hosts, so choose which copy
        to keep per harness. A/B adoption and recall first.

        ### 5. A pointer to narrow ranges when prism's result lacks surrounding context (est. -0.3 to -0.5M; advisory)

        Reads over 60 lines in the heavy prism arms cost 1.03M above a 60-line cap (0.56M of it in xml827; dubbo16395 read
        561 lines, dubbo16391 363, commons-lang1750 350). These are mostly not re-reads: prism gave the method, and the agent
        wanted the class around it. Options: a one-line footer on lookup/search results
        (`more context: prism read ranges=[{file,from,to}] (<=80 lines)`), and a class-outline shape (item 3).
        Risk: advisory steering has held up poorly; only enforcement (the read-guard) moved behavior. Expect partial effect.

        ### 6. Batching hints (est. -0.2 to -0.3M)

        There were 13 consecutive same-op prism calls in the heavy prism arms: 3 lookups in a row in commons-lang1709,
        4 `read`s of one file in jansson731, 3 searches in echo3006. That is 0.62M of turn context. About half look
        independent enough to batch. A cheap in-band hint on the second consecutive same-op call ("batch: name/terms take up
        to 10; ranges takes up to 10 windows") uses the failure-moment channel that has worked before.

        ### Not Prism, but worth fixing in the harness (36% of the extra, both arms)

        - Pre-seed `~/.m2` with the SNAPSHOT parents the Jackson tasks need (`jackson-base 2.22.0-SNAPSHOT`,
          `3.1.3-SNAPSHOT`). pr5994, pr5943 and pr5959 lost 20-30 turns each to that. Also pin node/bun per task (zod, hono).
        - Remove `/opt/homebrew/bin/prism` v0.82.2 from the bench host so results stop carrying the multi-install warning.
        - Make the read-guard forget a file's ranges after Edit/Write or a git checkout/stash of that file.
        - Env churn swings single cells by 2-4x in either direction. Heavy/cheap cell lists are mostly noise unless paired
          across repeats; the all-cell ratio (0.954x) is the number to track.
