        import json, glob, os, sys, datetime
        from pathlib import Path
        sys.path.insert(0, '/Users/tapabratapal/Projects/provasign/research/harness')
        from aggregate.usage_account import analyze_transcript

        FULL38 = Path('/Users/tapabratapal/Projects/provasign/research/harness/results/swebench-live/full38')
        PROJ = Path.home() / '.claude' / 'projects'

        def proj_dir(instance, arm):
            return PROJ / f"-private-tmp-swebench-wt-{instance.replace('__','--')}--{arm}"

        rows = []
        missing = 0
        for f in sorted(FULL38.glob('*.json')):
            rec = json.load(open(f))
            inst, arm = rec['instance_id'], rec['arm']
            d = proj_dir(inst, arm)
            if not d.exists():
                missing += 1; continue
            # candidate transcripts: pick the one whose assistant message count is closest to rec turns
            best = None
            for jl in d.glob('*.jsonl'):
                a = analyze_transcript(jl)
                # per-request max context
                maxctx = 0; n_over200k = 0; n_req = 0
                for line in open(jl, errors='replace'):
                    try: j = json.loads(line)
                    except: continue
                    if j.get('type') != 'assistant' or j.get('isSidechain') or j.get('parent_tool_use_id'): continue
                    u = (j.get('message') or {}).get('usage') or {}
                    ctx = sum(u.get(k, 0) or 0 for k in ('input_tokens','cache_creation_input_tokens','cache_read_input_tokens'))
                    if ctx > maxctx: maxctx = ctx
                mtime = datetime.datetime.fromtimestamp(jl.stat().st_mtime).date().isoformat()
                cand = (abs(a['messages'] - (rec['turns'] or 0)), mtime, a, maxctx, jl.name)
                if best is None or cand[0] < best[0]: best = cand
            if best is None:
                missing += 1; continue
            diff, mtime, a, maxctx, name = best
            t = a['tokens']
            rec_fresh = rec['fresh_input_tokens']; rec_cache = rec['cache_read_tokens']; rec_out = rec['output_tokens']
            tr_fresh = (t['input_uncached'] or 0) + (t['cache_creation'] or 0)
            rows.append(dict(inst=inst[:28], arm=arm, turns=rec['turns'], msgs=a['messages'], mtime=mtime,
                             rec_fresh=rec_fresh, tr_fresh=tr_fresh,
                             rec_cache=rec_cache, tr_cache=t['cache_read'],
                             rec_out=rec_out, tr_out_step=a['step_output_observed'],
                             maxctx=maxctx, cost=rec['cost_usd'], dup=a['duplicate_lines'], warn=len(a['warnings'])))

        print(f"cells matched: {len(rows)}  missing transcript dir: {missing}")
        print(f"{'inst':28} {'arm':8} {'turns':>5} {'msgs':>5} {'mtime':10} {'rec_fresh':>9} {'tr_fresh':>9} {'rec_cache':>10} {'tr_cache':>10} {'rec_out':>7} {'tr_out':>7} {'maxctx':>7} {'cost':>6}")
        for r in rows:
            print(f"{r['inst']:28} {r['arm']:8} {r['turns']:>5} {r['msgs']:>5} {r['mtime']:10} {r['rec_fresh']:>9} {r['tr_fresh']:>9} {r['rec_cache']:>10} {str(r['tr_cache']):>10} {r['rec_out']:>7} {str(r['tr_out_step']):>7} {r['maxctx']:>7} {r['cost']:>6.2f}")
        # summary ratios where transcript date matches Aug 2026 and turn diff small
        import statistics
        ok = [r for r in rows if r['tr_cache'] is not None and r['rec_cache']]
        if ok:
            print()
            print("cache_read ratio transcript/recorded:", [round(r['tr_cache']/r['rec_cache'],2) for r in ok][:20])
            print("fresh ratio transcript/recorded:", [round(r['tr_fresh']/r['rec_fresh'],2) if r['rec_fresh'] else None for r in ok][:20])
            print("cells with any request context > 200k:", sum(1 for r in rows if r['maxctx'] > 200_000), "/", len(rows))
            print("max single-request context overall:", max(r['maxctx'] for r in rows))
        EOF
