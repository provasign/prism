        import re

        text = open('full38.scored.log').read()
        cells = text.split('==============================================================================\nCELL')[1:]
        print('num cells', len(cells))

        both_resolved=0; only_prism=0; only_baseline=0; neither=0
        prism_fewer_redundant=0; base_fewer_redundant=0; tie_redundant=0
        disagree = []
        for c in cells:
            name = c.strip().split()[0]
            bm = re.search(r'baseline\s+(RESOLVED|FAIL)', c)
            pm = re.search(r'prism\s+(RESOLVED|FAIL)', c)
            if not bm or not pm: continue
            b_res = bm.group(1)=='RESOLVED'
            p_res = pm.group(1)=='RESOLVED'
            if b_res and p_res: both_resolved+=1
            elif b_res and not p_res: only_baseline+=1; disagree.append((name,'baseline_only'))
            elif p_res and not b_res: only_prism+=1; disagree.append((name,'prism_only'))
            else: neither+=1

            br = re.search(r'baseline\s+bash=.*?retry_loops=(\d+) \((\d+) redundant\)', c, re.S)
            pr = re.search(r'prism\s+bash=.*?retry_loops=(\d+) \((\d+) redundant\)', c, re.S)
            if br and pr:
                b_red = int(br.group(2)); p_red = int(pr.group(2))
                if p_red < b_red: prism_fewer_redundant+=1
                elif p_red > b_red: base_fewer_redundant+=1
                else: tie_redundant+=1

        print('both resolved:', both_resolved)
        print('only baseline resolved:', only_baseline)
        print('only prism resolved:', only_prism)
        print('neither resolved:', neither)
        print('disagreements:', disagree)
