        	return b == '_' || ('a' <= b && b <= 'z') || ('A' <= b && b <= 'Z') || ('0' <= b && b <= '9')
        }

        func methodLeafInSig(sig string) string {
        	for k := 0; k < len(sig); k++ {
        		if sig[k] != '(' {
        			continue
        		}
        		e := k
        		s := e
        		for s > 0 && isIdentByte(sig[s-1]) {
        			s--
        		}
        		if s < e {
        			return sig[s:e]
        		}
        	}
        	return ""
        }

        func main() {
        	// Realistic Go method signature: a handler-registration method taking a
        	// function-typed parameter. "func(" is itself an ident-preceded paren
        	// (the keyword "func" is made of ident bytes), and it comes BEFORE the
        	// real method name's paren.
        	sig := "func (p *Plugin) Register(handler func(x int) string)"
        	fmt.Println("got:", methodLeafInSig(sig))
