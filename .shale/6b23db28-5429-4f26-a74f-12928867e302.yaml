        cd /Users/tapabratapal/Projects/provasign/research/harness/results/swebench-live/full38 && python3 -c "
        import json, glob, statistics

        rows = []
        for f in sorted(glob.glob('*.prism.json')):
            base_f = f.replace('.prism.json', '.baseline.json')
            try:
                p = json.load(open(f))
                b = json.load(open(base_f))
            except FileNotFoundError:
                continue
            grep_calls_base = sum(1 for tc in b.get('tool_calls',[]) if isinstance(tc,dict) and tc.get('name') in ('Grep','Bash') and 'grep' in json.dumps(tc.get('input',{})).lower())
            delta = b['cost_usd'] - p['cost_usd']  # positive = prism cheaper
            rows.append((grep_calls_base, delta, f))

        rows.sort()
        xs = [r[0] for r in rows]
        ys = [r[1] for r in rows]
        n = len(xs)
        mx, my = statistics.mean(xs), statistics.mean(ys)
        cov = sum((x-mx)*(y-my) for x,y in zip(xs,ys))/n
        sx = statistics.pstdev(xs); sy = statistics.pstdev(ys)
        corr = cov/(sx*sy) if sx>0 and sy>0 else float('nan')
        print('n=', n, 'pearson r (grep_count vs prism_saving) =', round(corr,3))
        print()
        # bucket
        low = [d for g,d,f in rows if g<=2]
        high = [d for g,d,f in rows if g>2]
        print('cells with baseline grep<=2:', len(low), 'mean saving', round(statistics.mean(low),3))
        print('cells with baseline grep>2 :', len(high), 'mean saving', round(statistics.mean(high),3))
        "
