        git init -q
        cat > pkg/cache.py <<'EOF'
        """A tiny LRU-ish cache used by the ingest pipeline."""


        class Cache:
            def __init__(self, capacity):
                self.capacity = capacity
                self._store = {}
                self._order = []

            def get(self, key):
                if key not in self._store:
                    return None
                self._order.remove(key)
                self._order.append(key)
                return self._store[key]

            def put(self, key, value):
                if key in self._store:
                    self._order.remove(key)
                elif len(self._store) >= self.capacity:
                    # BUG: evicts the most-recently-used key instead of the
                    # least-recently-used one — pops from the wrong end.
                    oldest = self._order.pop()
                    del self._store[oldest]
                self._store[key] = value
                self._order.append(key)
        EOF
        mkdir -p tests
        cat > tests/test_cache.py <<'EOF'
        import sys, os
        sys.path.insert(0, os.path.join(os.path.dirname(__file__), ".."))
        from pkg.cache import Cache


        def test_evicts_least_recently_used():
            c = Cache(capacity=2)
            c.put("a", 1)
            c.put("b", 2)
            c.get("a")          # "a" is now most-recently-used
            c.put("c", 3)        # should evict "b" (least-recently-used), not "a"
            assert c.get("a") == 1
            assert c.get("b") is None
            assert c.get("c") == 3


        if __name__ == "__main__":
            test_evicts_least_recently_used()
            print("PASS")
        EOF
        git add -A && git commit -q -m init
