        cd /Users/tapabratapal/Projects/provasign/research/harness/runs/swebench-live/sonnet38/
        python3 - <<'EOF'
        import json, glob
        from collections import defaultdict

        rows = defaultdict(dict)
        for f in glob.glob("*.baseline.json") + glob.glob("*.prism.json"):
            rec = json.loads(open(f).read())
            iid = rec["instance_id"]
            arm = "prism" if f.endswith(".prism.json") else "baseline"
            rows[iid][arm] = rec

        pairs = {k: v for k, v in rows.items() if "baseline" in v and "prism" in v}
        n = len(pairs)
        print(f"{len(rows)} instances touched, {n} complete pairs")

        def cost(r): return r.get("cost_usd") or 0
        def turns(r): return r.get("turns") or 0

        bcost = sum(cost(v["baseline"]) for v in pairs.values())
        pcost = sum(cost(v["prism"]) for v in pairs.values())
        bturns = sum(turns(v["baseline"]) for v in pairs.values())
        pturns = sum(turns(v["prism"]) for v in pairs.values())
        prism_used = sum(1 for v in pairs.values() if v["prism"].get("prism_used"))
        denied_attempts = sum(v["prism"].get("denied_search_attempts", 0) for v in pairs.values())
        cheaper = sum(1 for v in pairs.values() if cost(v["prism"]) < cost(v["baseline"]))

        if n:
            print(f"total cost: baseline ${bcost:.2f}, prism ${pcost:.2f}  (prism {pcost/bcost*100:.1f}% of baseline)")
            print(f"avg turns:  baseline {bturns/n:.1f}, prism {pturns/n:.1f}")
            print(f"prism cheaper on {cheaper}/{n} pairs")
            print(f"prism_used: {prism_used}/{n}")
            print(f"total denied grep/rg attempts (prism arm): {denied_attempts}")
        EOF
