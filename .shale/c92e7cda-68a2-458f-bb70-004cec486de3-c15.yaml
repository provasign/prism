        git add -A internal/
        git commit -q -F - <<'EOF'
        fix: scope=text CLI --format text fallthrough, rank files before capping

        Two real bugs, both found live during today's grep-vs-graph size
        comparison, not from routine testing.

        1. printTextOutput never rendered prism_search(scope="text") as text.
           scope="text" responses have no "symbols" key (only textHits/textBackend/
           etc), and printTextOutput's text-match branch was nested inside the
           m["symbols"] check -- so this shape fell through every branch to the
           JSON fallback, silently, printing an escaped-JSON dump instead of plain
           lines. This directly contradicts what the steering, README, and the
           PreToolUse hook's own deny message all promise: "prism search <query>
           --format text" as the zero-extra-round-trip path when already in a
           shell. It never worked for exactly the call scope=text is for.

        2. renderTextMatches' file cap (textRenderFileCap=10) operated on raw scan
           order, not relevance. Reproduced live: prism_search("RequestContext") on
           a2a-python has 251 real hits across 28 files; the raw collection
           (MaxHits, defaulting to the requested `limit`=25) stopped after the
           first 25 lines of rg's stdout, in whatever order rg happened to emit
           them -- 9 files survived, ZERO of them the actual implementation
           (tests/samples/CHANGELOG only). Fixed two ways: (a) raw collection now
           floors at textScanCeiling=300 regardless of the agent's requested
           `limit` -- `limit` was conflating "how much to scan" with "how much to
           display", and display is separately bounded by
           textRenderFileCap/textRenderHitsPerFile regardless; (b) renderTextMatches
           now ranks files before applying the cap: real implementation files
           before test doubles (same convention prism_search's symbol results
           already use), then more hits before fewer within each tier.

        Known, accepted limit of fix (b): pure scope="text" ranking by hit
        frequency still can't reliably surface a symbol's DEFINITION specifically
        -- a class definition mentions its own name once or twice; every call site
        mentions it repeatedly, so frequency-ranking structurally favors usage
        over definition. Verified this is not a regression: scope="symbols"/"both"
        (the graph path) already finds the definition correctly and immediately --
        that's what those modes are for. scope="text" is deliberately pure grep;
        this fix makes it a better grep, not a symbol resolver.

        Both regression-tested: TestFormatTextRendersScopeTextSearch (bug 1),
        TestRenderTextMatchesRanksRealFilesBeforeTestDoubles +
        TestRenderTextMatchesRanksByHitCountWithinTier (bug 2). go build / go vet /
        go test ./... all green. Verified live against the exact failing case
        (RequestContext on a real a2a-python checkout) before and after.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_013KQbcGBEfN6F9T7NxAdA3a
        EOF
