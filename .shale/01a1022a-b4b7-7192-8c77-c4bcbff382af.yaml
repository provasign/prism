        import tempfile,subprocess,json,os,select
        from pathlib import Path
        root=Path(tempfile.mkdtemp(prefix='prism-turn-probe-',dir='/private/tmp'))
        for i in range(1,4):
         (root/f'range{i}.txt').write_text(''.join(f'file {i} line {n:03d}: '+('x'*100)+'\n' for n in range(1,81)))
        (root/'calls.go').write_text('''package probe

        type A struct{}
        type B struct{}
        func (A) Send() {}
        func (B) Send() {}
        func Work(a A, b B) {
         a.Send()
         b.Send()
         a.Send()
        }
        ''')
        env=dict(os.environ,GROVE_NATIVE='false')
        p=subprocess.Popen(['prism','mcp','--compact',str(root)],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,env=env)
        def call(n,method,params):
         p.stdin.write(json.dumps({'jsonrpc':'2.0','id':n,'method':method,'params':params})+'\n');p.stdin.flush()
         if not select.select([p.stdout],[],[],20)[0]:raise RuntimeError('MCP response timeout')
         return json.loads(p.stdout.readline())
        def tool(n,args):return call(n,'tools/call',{'name':'prism','arguments':{'op':'read','args':args}})
        def content(r):return '\n'.join(x.get('text','') for x in r.get('result',{}).get('content',[]))
        try:
         init=call(1,'initialize',{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'turn-audit','version':'1'}})
         batch=tool(2,{'ranges':[{'file':f'range{i}.txt','from':1,'to':80} for i in range(1,4)]})
         cached=tool(3,{'file':'range1.txt','from':1,'to':5})
         forced=tool(4,{'file':'range1.txt','from':1,'to':5,'force':True})
         print('probe_root',root)
         print('batch_footer',content(batch)[-900:])
         print('repeated_read',content(cached))
         print('force_read',content(forced))
         (root/'mcp-results.json').write_text(json.dumps({'batch':batch,'cached':cached,'forced':forced},indent=2))
        finally:
         p.terminate();p.wait(timeout=5)
        r=subprocess.run(['prism','change-impact','A.Send',str(root),'--format','json'],capture_output=True,text=True,env=env,timeout=30)
        (root/'impact-result.json').write_text(r.stdout)
        print('impact_exit',r.returncode)
        print(r.stdout[:6500])
        PY
