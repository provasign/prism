            d2 = S / 'wt' / (a.name + '-tags')
            clone(d2); rename(d2, dict(env, GOFLAGS=env.get('GOFLAGS', '') + ' -tags=' + tags))
            ch1 = set(sh('git', '-C', str(wt), 'diff', '--name-only').split())
            for f in sh('git', '-C', str(d2), 'diff', '--name-only').split():
                t2 = (d2 / f).read_text()
