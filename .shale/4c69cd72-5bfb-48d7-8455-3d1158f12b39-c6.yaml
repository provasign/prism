            edits=[c.count('Edit')+c.count('MultiEdit')+c.count('Write') for c in calls]
            multi_tool=sum(1 for c in calls if len(c)>1)
            return dict(api=len(calls), tools=sum(len(c) for c in calls), edit_calls=sum(1 for e in edits if e), edits=sum(edits), multi=multi_tool)
        agg={'native':defaultdict(int),'prism':defaultdict(int)}
