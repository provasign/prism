        // impls <dir> <ifaceName> <method>: every named type (tests included) in the
        // module whose value or pointer method set implements an interface named
        // ifaceName that declares method; prints the concrete method's position and
        // whether a static conversion was needed (informational). Generic types with
        // a same-named method are listed as GENERIC for manual review.
        package main

        import (
        	"fmt"
        	"go/types"
        	"os"
        	"path/filepath"

        	"golang.org/x/tools/go/packages"
        )

        func main() {
        	dir, iname, mname := os.Args[1], os.Args[2], os.Args[3]
        	cfg := &packages.Config{Mode: packages.LoadAllSyntax, Tests: true, Dir: dir}
        	if len(os.Args) > 4 {
        		cfg.BuildFlags = []string{"-tags=" + os.Args[4]}
        	}
        	pkgs, err := packages.Load(cfg, "./...")
        	if err != nil {
        		panic(err)
        	}
        	var ifaces []*types.Interface
        	seenI := map[types.Object]bool{}
        	packages.Visit(pkgs, nil, func(p *packages.Package) {
        		if p.Types == nil {
        			return
        		}
        		o := p.Types.Scope().Lookup(iname)
        		if o == nil || seenI[o] {
        			return
        		}
        		if it, ok := o.Type().Underlying().(*types.Interface); ok {
        			seenI[o] = true
        			ifaces = append(ifaces, it)
        		}
        	})
        	seen := map[string]bool{}
        	for _, p := range pkgs {
        		if p.Types == nil {
        			continue
        		}
        		sc := p.Types.Scope()
        		check := func(tn *types.TypeName) {
        			named, ok := tn.Type().(*types.Named)
        			if !ok {
        				return
        			}
        			if _, isI := named.Underlying().(*types.Interface); isI {
        				return
        			}
        			ms := types.NewMethodSet(types.NewPointer(named))
        			var m *types.Func
        			for i := 0; i < ms.Len(); i++ {
        				if f := ms.At(i).Obj().(*types.Func); f.Name() == mname {
        					m = f
        				}
        			}
        			if m == nil {
        				return
        			}
        			pos := p.Fset.Position(m.Pos())
        			rel, _ := filepath.Rel(dir, pos.Filename)
        			key := fmt.Sprintf("%s:%d:%d", rel, pos.Line, pos.Column)
        			if seen[key] {
        				return
        			}
        			if named.TypeParams().Len() > 0 {
        				seen[key] = true
        				fmt.Printf("GENERIC %s %s\n", tn.Name(), key)
        				return
        			}
        			for _, it := range ifaces {
        				if types.Implements(named, it) || types.Implements(types.NewPointer(named), it) {
        					seen[key] = true
        					fmt.Printf("IMPL %s.%s %s\n", tn.Name(), mname, key)
        					return
        				}
        			}
        			seen[key] = true
        			fmt.Printf("SAME-NAME-ONLY %s.%s %s\n", tn.Name(), mname, key)
        		}
        		for _, n := range sc.Names() {
        			if tn, ok := sc.Lookup(n).(*types.TypeName); ok {
        				check(tn)
        			}
        		}
        		// function-local types
        		for _, o := range p.TypesInfo.Defs {
        			if tn, ok := o.(*types.TypeName); ok && tn.Parent() != sc {
        				check(tn)
        			}
        		}
        	}
        }
        EOF
