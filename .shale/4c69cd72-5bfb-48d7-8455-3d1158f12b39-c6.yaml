        """Replay recorded prism searches through `<binary> mcp` on each task's base
        checkout. usage: replay.py <binary> <out.json> [--only-follow]"""
        import json, os, subprocess, sys, time
        from pathlib import Path
        H = Path('/Users/tapabratapal/Projects/provasign/research/harness')
        sys.path[:0] = [str(H / 'runners'), str(H / 'scoring')]
        import run_e2e  # noqa

        HERE = Path(__file__).parent
        WT = HERE / 'worktrees.json'   # task -> checkout, reused across binaries

        class MCP:
            def __init__(self, binary, cwd):
                self.p = subprocess.Popen([binary, 'mcp'], cwd=cwd, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                          stderr=subprocess.DEVNULL, text=True, bufsize=1)
                self.i = 0
                self.call('initialize', {'protocolVersion': '2025-06-18', 'capabilities': {},
                                         'clientInfo': {'name': 'replay', 'version': '0'}})
                self.send({'jsonrpc': '2.0', 'method': 'notifications/initialized'})
                tools = self.call('tools/list', {})['tools']
                self.tool = next(t['name'] for t in tools if t['name'].endswith('prism'))

            def send(self, msg):
                self.p.stdin.write(json.dumps(msg) + '\n'); self.p.stdin.flush()

            def call(self, method, params):
                self.i += 1
                self.send({'jsonrpc': '2.0', 'id': self.i, 'method': method, 'params': params})
                while True:
                    line = self.p.stdout.readline()
                    if not line:
                        raise RuntimeError('mcp exited')
                    m = json.loads(line)
                    if m.get('id') == self.i:
                        if 'error' in m:
                            raise RuntimeError(m['error'])
                        return m['result']

            def search(self, args):
                r = self.call('tools/call', {'name': self.tool, 'arguments': {'op': 'search', 'args': args}})
                return ''.join(c.get('text', '') for c in r.get('content', []))

            def close(self):
                self.p.stdin.close(); self.p.wait(timeout=30)

        def main():
            binary, out = sys.argv[1], Path(sys.argv[2])
            only_follow = '--only-follow' in sys.argv
            cases = json.loads((HERE / 'cases.json').read_text())
            wts = json.loads(WT.read_text()) if WT.exists() else {}
            done = json.loads(out.read_text()) if out.exists() else {}
            by = {}
            for i, c in enumerate(cases):
                if only_follow and not c['follow']:
                    continue
                by.setdefault(c['task'], []).append(i)
            for task, idx in by.items():
                if all(str(i) in done for i in idx):
                    continue
                t = json.loads((H / 'tasks/e2e' / f'{task}.json').read_text())
                wt = wts.get(task)
                if not wt or not Path(wt).exists():
                    wt = str(run_e2e._worktree(t)); wts[task] = wt; WT.write_text(json.dumps(wts, indent=1))
                subprocess.run([binary, 'index', wt], capture_output=True, timeout=1800)
                m = MCP(binary, wt)
                for i in idx:
                    t0 = time.time()
                    try:
                        txt = m.search(cases[i]['args'])
                    except Exception as e:
                        txt = f'REPLAY ERROR: {e}'
                    done[str(i)] = {'text': txt, 's': round(time.time() - t0, 2)}
                m.close()
                out.write_text(json.dumps(done))
                print(task, len(idx), flush=True)
            print('REPLAY DONE', flush=True)

        if __name__ == '__main__':
            main()
        EOF
