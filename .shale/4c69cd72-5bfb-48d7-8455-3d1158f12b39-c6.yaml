        """rope Rename(in_hierarchy=True, docs=False) plus rope's own UNSURE
        occurrences (receiver type not inferable), each accepted only if listed
        (file:line) in an accept file after hand audit.
        usage: rope_audit.py root relfile Class meth new [accept_file]
        Prints every unsure occurrence with ACCEPT/reject."""
        import sys, re, os
        from rope.base.project import Project
        from rope.refactor.rename import Rename
        root, relfile, cls, meth, new = sys.argv[1:6]
        accept = set()
        if len(sys.argv) > 6 and os.path.exists(sys.argv[6]):
            accept = {l.split('#')[0].strip() for l in open(sys.argv[6]) if l.split('#')[0].strip()}
        proj = Project(root, ropefolder=None)
        res = proj.get_resource(relfile)
        src = res.read()
        m = re.search(rf'class {cls}\b.*?\n(\s+)def {meth}\(', src, re.S)
        off = m.end() - len(meth) - 1
        seen = []
        def unsure(occ):
            key = f"{occ.resource.path}:{occ.lineno}"
            ok = key in accept
            line = occ.resource.read().splitlines()[occ.lineno - 1].strip()
            seen.append((key, ok, line))
            return ok
        changes = Rename(proj, res, off).get_changes(new, in_hierarchy=True, docs=False, unsure=unsure)
        for k, ok, line in sorted(set(seen)):
            print(f"UNSURE {'ACCEPT' if ok else 'reject'} {k}  {line[:110]}")
        missing = accept - {k for k, _, _ in seen}
        if missing:
            print("ACCEPT ENTRIES NOT SEEN:", sorted(missing))
        proj.do(changes)
        proj.close()
        EOF
