        from a fresh base clone under each extra tag set (union, identical-edit check);
        gofmt -l -w changed .go files; write SCRATCH/gold/<name>.diff; compile check."""
        import sys, subprocess, os, shutil, argparse
        from pathlib import Path
        S = Path(__file__).resolve().parent
        GOLD = S.parent / 'gold'
        ap = argparse.ArgumentParser()
        ap.add_argument('name'); ap.add_argument('repo'); ap.add_argument('base'); ap.add_argument('new')
        ap.add_argument('pos'); ap.add_argument('--tags', action='append', default=[])
        a = ap.parse_args()
        def sh(*c, cwd=None, env=None, check=True):
            r = subprocess.run(c, cwd=cwd, capture_output=True, text=True, env=env)
            if check and r.returncode:
                sys.exit(f'FAIL {c}: {r.stdout[-2000:]} {r.stderr[-2000:]}')
            return r.stdout
        def clone(d):
            if d.exists(): shutil.rmtree(d)
            sh('git', 'clone', '-q', '--local', str(Path.home() / 'gvg-corpus' / a.repo), str(d))
            sh('git', '-C', str(d), 'checkout', '-q', '--detach', a.base)
        def rename(d, env):
            for p in a.pos.split(','):
                sh('gopls', 'rename', '-w', p, a.new, cwd=d, env=env)
