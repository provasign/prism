        import re, os
        HIT = re.compile(r'^(\S+?):(\d+): ')
        HDR = re.compile(r'^\*\*`([^`]+)`\*\*')
        NUM = re.compile(r'^(\d+)\t')

        def shown(text):
            """{file: set(lines)} a rendered search result shows verbatim."""
            out, cur, fence = {}, None, False
            for ln in text.splitlines():
                m = HDR.match(ln)
                if m:
                    cur = m.group(1); continue
                if ln.startswith('```'):
                    fence = not fence; continue
                if fence and cur:
                    m = NUM.match(ln)
                    if m:
                        out.setdefault(cur, set()).add(int(m.group(1)))
                    continue
                m = HIT.match(ln)
                if m:
                    out.setdefault(m.group(1), set()).add(int(m.group(2)))
            return out

        def coverage(text, follow, file_len=None):
            """Fraction of the follow-up Read window the result already showed."""
            lines = shown(text)
            f = follow['file']
            got = set()
            for k, v in lines.items():
                if k == f or f.endswith('/' + k) or k.endswith('/' + f):
                    got |= v
            to = follow['to'] if file_len is None else min(follow['to'], file_len)
            win = range(follow['from'], to + 1)
            return sum(1 for n in win if n in got) / max(1, len(win))
        EOF
