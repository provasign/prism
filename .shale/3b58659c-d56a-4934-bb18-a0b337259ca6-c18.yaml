        #!/usr/bin/env python3
        """Real-enforcement fleet with v0.61.2 (empty-result evidence fix), same
        12-task bed and same --disallowedTools setup as the original e-enforced
        run this fix was built to address. Fail-fast at 2 resolve regressions."""
        import os, sys, json, glob, subprocess

        SCRATCH = "/private/tmp/claude-501/-Users-tapabratapal-Projects-provasign-prism/3b58659c-d56a-4934-bb18-a0b337259ca6/scratchpad"
        PRISM = f"{SCRATCH}/prism-cand3"
        PATH_DIR = f"{SCRATCH}/newprism-path"
        os.makedirs(PATH_DIR, exist_ok=True)
        link = os.path.join(PATH_DIR, "prism")
        if os.path.lexists(link):
            os.remove(link)
        os.symlink(PRISM, link)
        os.environ["PATH"] = PATH_DIR + os.pathsep + os.environ["PATH"]

        sys.path.insert(0, os.path.expanduser("~/Projects/provasign/research/harness"))
        import ab_endtoend_arms as arms  # noqa: E402
        (arms.CFG_DIR / "prism.json").write_text(json.dumps({"mcpServers": {"prism": {
            "type": "stdio", "command": PRISM, "args": ["mcp"]}}}))
        import run_e2e  # noqa: E402

        _orig_run_cloud = run_e2e._run_cloud
        DISALLOW = sorted(arms._SEARCH)
        import subprocess as _sp, time as _time

        def _patched_run_cloud(model, arm, wt, task):
            if arm != "prism_native":
                return _orig_run_cloud(model, arm, wt, task)
            spec = arms.ARMS[arm]
            tail = run_e2e.SEEDED_TAIL if task.get("kind") == "seeded_refactor" else run_e2e.TASK_TAIL
            prompt = spec["guidance"] + "\n\nISSUE:\n" + task["problem_statement"] + tail
            cmd = ["claude", "-p", prompt, "--model", model, "--output-format", "json",
                   "--dangerously-skip-permissions", "--strict-mcp-config",
                   "--allowedTools", *spec["allowed"], "--disallowedTools", *DISALLOW]
            if spec["mcp"]:
                cmd += ["--mcp-config", spec["mcp"]]
            t0 = _time.monotonic()
            r = _sp.run(cmd, cwd=wt, capture_output=True, text=True, timeout=1800)
            blob = (r.stdout + r.stderr).lower()
            if r.returncode != 0 and any(h in blob for h in run_e2e.RATE_HINTS):
                raise run_e2e.RateLimited(blob[-300:])
            rec = {"wall_s": round(_time.monotonic() - t0, 1)}
            try:
                j = json.loads(r.stdout)
                rec.update(turns=j.get("num_turns"), cost_usd=j.get("total_cost_usd"))
            except Exception:
                if any(h in blob for h in run_e2e.RATE_HINTS):
                    raise run_e2e.RateLimited(blob[-300:])
                rec["agent_error"] = (r.stderr or r.stdout)[-200:]
            rec["tool_trace"] = run_e2e._tool_trace_for(wt)
            return rec

        run_e2e._run_cloud = _patched_run_cloud

        HARNESS = os.path.expanduser("~/Projects/provasign/research/harness")
        TAG = "e-enforced-fix"
        TASKS = [
            "pallets__click__pr3228", "pallets__werkzeug__pr3038",
            "pydantic__pydantic__pr13516", "pallets__click__pr3473",
            "pallets__click__pr3244", "pallets__werkzeug__pr3006",
            "Textualize__rich__pr3938", "urllib3__urllib3__pr5093",
            "urllib3__urllib3__pr5020", "pallets__werkzeug__pr3081",
            "pallets__click__pr3533", "urllib3__urllib3__pr3786",
        ]

        def ref(tid):
            f = f"{HARNESS}/runs/e2e/{tid}.opus.prism_native.rerun-v061.json"
            if os.path.exists(f):
                d = json.load(open(f))
                return d.get("resolved"), d.get("turns"), d.get("cost_usd")
            return None, None, None

        def old_enforced(tid):
            f = f"{HARNESS}/runs/e2e/{tid}.opus.prism_native.e-enforced.json"
            if os.path.exists(f):
                d = json.load(open(f))
                return d.get("resolved"), d.get("turns"), d.get("cost_usd")
            return None, None, None

        mode = sys.argv[1] if len(sys.argv) > 1 else "probe"
        todo = TASKS[:1] if mode == "probe" else TASKS
        regressions = []
        for tid in todo:
            outfile = f"{HARNESS}/runs/e2e/{tid}.opus.prism_native.{TAG}.json"
            if os.path.exists(outfile):
                rec = json.load(open(outfile)); cached = True
            else:
                cached = False
                tf = glob.glob(f"{HARNESS}/tasks-e2e*/{tid}.json")
                task = json.load(open(tf[0]))
                try:
                    rec = run_e2e.run_cell(task, "prism_native", "opus", tag=TAG)
                except subprocess.TimeoutExpired:
                    print(f"{tid} TIMEOUT", flush=True); continue
                except Exception as e:
                    print(f"{tid} ERROR: {str(e)[:150]}", flush=True); continue
                json.dump(rec, open(outfile, "w"), indent=1)
            r_res, r_turns, r_cost = ref(tid)
            o_res, o_turns, o_cost = old_enforced(tid)
            print(f"{tid:38} ref(res={r_res},t={r_turns},${r_cost}) "
                  f"old-enforced(res={o_res},t={o_turns},${o_cost}) -> "
                  f"fixed(res={rec.get('resolved')},t={rec.get('turns')},${rec.get('cost_usd')}) "
                  f"{'(cached)' if cached else ''}", flush=True)
            if r_res and not rec.get("resolved"):
                regressions.append(tid)
                if len(regressions) >= 2:
                    print(f"HARD STOP: {regressions}", flush=True)
                    sys.exit(2)
        print(f"done regressions={regressions}", flush=True)
        PYEOF
        echo written
