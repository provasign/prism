        import json, glob, os, sys, re, datetime
        OUT = os.path.dirname(os.path.abspath(__file__))
        sessions = []
        for f in glob.glob(os.path.expanduser('~/.claude/projects/*e2e-run*/*.jsonl')):
            calls = []; results = {}; cwd = None; first_ts = None; edit_idx = None; seq = 0
            order = []
            try:
                lines = open(f).read().splitlines()
            except Exception: continue
            for line in lines:
                try: j = json.loads(line)
                except Exception: continue
                cwd = cwd or j.get('cwd')
                ts = j.get('timestamp')
                if ts and not first_ts: first_ts = ts
                m = j.get('message') or {}
                content = m.get('content')
                if not isinstance(content, list): continue
                for c in content:
                    if not isinstance(c, dict): continue
                    if c.get('type') == 'tool_use':
                        seq += 1
                        order.append((seq, c['name'], c.get('id'), c.get('input')))
                    elif c.get('type') == 'tool_result':
                        results[c.get('tool_use_id')] = c.get('content')
            sid = os.path.basename(f)[:-6]
            sessions.append(dict(file=f, session_id=sid, cwd=cwd, first_ts=first_ts, mtime=os.path.getmtime(f),
                                 tools=[(s, n, i, inp) for s, n, i, inp in order], results=results))
        # keep compact
        out = []
        for s in sessions:
            out.append(dict(file=s['file'], session_id=s['session_id'], cwd=s['cwd'], first_ts=s['first_ts'], mtime=s['mtime'],
                            ntools=len(s['tools']), nprism=sum(1 for t in s['tools'] if t[1].startswith('mcp__prism'))))
        json.dump(out, open(os.path.join(OUT, 'work/sessions_index.json'), 'w'))
        from collections import Counter
        print(len(out), 'sessions')
        print('with prism', sum(1 for o in out if o['nprism']))
        c = Counter((o['first_ts'] or '')[:10] for o in out if o['nprism'])
        print(sorted(c.items()))
        names = Counter()
        for s in sessions:
            for t in s['tools']:
                if t[1].startswith('mcp__prism'): names[t[1]] += 1
        print(names)
        EOF
