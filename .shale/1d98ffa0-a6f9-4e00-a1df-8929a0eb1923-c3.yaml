        func TestZZDebugDeferRealRepo(t *testing.T) {
        	src := os.Getenv("DEBUG_REPO")
        	if src == "" {
        		t.Skip()
        	}
        	ctx := context.Background()
        	work := t.TempDir()
        	if out, err := exec.Command("rsync", "-a", "--exclude", ".grove", src+"/", work+"/").CombinedOutput(); err != nil {
        		t.Fatal(err, string(out))
        	}
        	on := true
        	eng, err := Open(ctx, Config{RepoRoot: work, DeferNative: &on})
        	if err != nil {
        		t.Fatal(err)
        	}
        	if _, err := eng.Index(ctx, ""); err != nil {
        		t.Fatal(err)
        	}
        	rel := os.Getenv("DEBUG_FILE")
        	p := filepath.Join(work, rel)
        	data, _ := os.ReadFile(p)
        	lines := strings.Split(string(data), "\n")
        	anchor := os.Getenv("DEBUG_ANCHOR")
        	for i, l := range lines {
        		if strings.Contains(l, anchor) {
        			lines = append(lines[:i+1], append([]string{"    // probe"}, lines[i+1:]...)...)
        			break
        		}
        	}
        	os.WriteFile(p, []byte(strings.Join(lines, "\n")), 0o644)
        	res, err := eng.Index(ctx, "")
        	if err != nil {
        		t.Fatal(err)
        	}
        	t.Logf("pending after edit: %v", res.NativePending)
        	if !eng.WaitNative(ctx, 5*time.Minute) {
        		t.Fatal("not drained")
        	}
        	_, memEdges, _ := eng.SnapshotGraph(ctx)
        	eng.Close()
        	re, _ := Open(ctx, Config{RepoRoot: work, OneShot: true})
        	_, storeEdges, _ := re.SnapshotGraph(ctx)
        	re.Close()

        	cold := t.TempDir()
        	exec.Command("rsync", "-a", "--exclude", ".grove", work+"/", cold+"/").Run()
        	ref, _ := Open(ctx, Config{RepoRoot: cold, OneShot: true})
        	ref.Index(ctx, "")
        	_, coldEdges, _ := ref.SnapshotGraph(ctx)
        	ref.Close()
        	key := func(es []Edge, root string) map[string]bool {
        		m := map[string]bool{}
        		for _, e := range es {
        			m[e.From+" "+string(e.Type)+" "+e.To+" "+string(e.Source)] = true
        		}
        		return m
        	}
        	diff := func(name string, a, b map[string]bool) {
        		var onlyA, onlyB []string
        		for k := range a {
        			if !b[k] {
        				onlyA = append(onlyA, k)
        			}
        		}
        		for k := range b {
        			if !a[k] {
        				onlyB = append(onlyB, k)
        			}
        		}
        		sort.Strings(onlyA)
        		sort.Strings(onlyB)
        		t.Logf("%s: only-first %d only-cold %d", name, len(onlyA), len(onlyB))
        		for i := 0; i < len(onlyA) && i < 2; i++ {
        			t.Logf("   first: %s", onlyA[i])
        		}
        		for i := 0; i < len(onlyB) && i < 2; i++ {
        			t.Logf("   cold : %s", onlyB[i])
        		}
        	}
        	c := key(coldEdges, cold)
        	diff("in-memory vs cold", key(memEdges, work), c)
        	diff("store vs cold", key(storeEdges, work), c)
        }
