    - cmd: "cd /Users/tapabratapal/Projects/provasign/grove && gh pr create --draft --base feat/compiler-declared-symbols --head feat/deferred-native --title \"resident engine: optional background compiler pass (off by default)\" --body-file - <<'EOF'\nOptional mode, `GROVE_DEFER_NATIVE=1` or `Config.DeferNative`. An edit is indexed from the parse first, and the compiler pass (javac, go, tsc) runs in the background. **Off by default**, and the reason is measured.\n\n**Measured on jackson-databind**, first change_impact after an edit:\n\n| mode | seconds | compiler-backed |\n|---|---|---|\n| synchronous, today | 1.7 to 2.5 | yes |\n| deferred, no wait | about 1.05 | no, provisional |\n| deferred, wait for the pass | about 2.5 | yes |\n\njavac is about 0.7 s of the edit. Edge construction plus the store write, about 0.75 s, run twice in deferred mode, so a compiler-backed answer arrives about 0.8 s later than today. Only a provisional answer arrives sooner.\n\n**Mechanism**\n- `index.Options.DeferNative`: an incremental run skips the changed languages' analyzers, but only those that completed a full pass before. It carries their stored compiler edges, re-pointed to the new symbols through the existing carry-forward path, and returns the changed files in `IndexResult.NativePending`. Cold and forced runs never defer.\n- `index.Options.ReextractFiles`: the deferred pass is an ordinary index run over those files.\n- `scanTree`: the indexer's walk, extracted unchanged into a read-only function. `Indexer.HasChanges` uses it, so \"is the index fresh?\" needs no lock while a pass runs.\n- Engine: a pending set and one background loop. A new edit waits for a running pass and never cancels it, because a cancelled pass could leave symbols and edges out of step. `NativePending` and `WaitNative` are exposed for callers.\n\n**Verified**\n- `TestDeferredCompilerPassConvergesToColdIndex` covers the in-memory graph and, after reopening from disk, the stored graph.\n- `pkg/grove` under `-race`, repeated runs, green. Two existing tests now wait for the pass and the splice-check test pins synchronous mode.\n- A live prism session on gson: edit, provisional answer at 0.53 s, compiler-backed at 1.1 s. The stored symbols and edges equal a cold index.\n\nPrism companion: `feat/compiler-provisional`. Graph answers say PROVISIONAL and never claim completeness while a pass runs.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF\ncd ../prism && gh pr create --draft --base main --head feat/compiler-provisional --title \"graph answers say PROVISIONAL while a background compiler pass runs\" --body-file - <<'EOF'\nCompanion to grove's optional background compiler pass (`GROVE_DEFER_NATIVE=1`, off by default). With the grove default, prism's behaviour is unchanged.\n\nWhen the mode is on:\n- Graph-claim tools wait up to `PRISM_COMPILER_WAIT` for the pass. That's change_impact, rename plan, missing implementations, dead code, map and cycles. The default wait is 2 s.\n- If the pass is still running, the answer carries a PROVISIONAL warning naming the pending files. Its completeness and familyCompleteness become `provisional` and safeToClaimComplete becomes false.\n- A provisional answer is never collapsed into an \"already delivered\" pointer. A live test showed that pointer hiding the mark.\n- verify, the gate, waits up to 5 minutes instead, because a verdict is final.\n- Search, lookup, query and read don't wait. They answer from freshly parsed symbols and text and make no family-completeness claim.\n\nTests: `TestImpactAfterEditIsProvisionalUntilTheCompilerPassLands` (live), `TestAttachStaleWarningDowngradesOnlyProvisional`, `TestProvisionalAnswerIsNeverDeduplicated`.\n\nNeeds grove `feat/deferred-native` for `NativePending` and `WaitNative`.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF"
