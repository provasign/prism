        permissions.deny [Grep, Bash(grep:*), Bash(rg:*)] into the worktree.
        Nothing in the shipped product has done that since v0.52.0 reverted the
        whole denial arc — no hook, no deny rules — so for three prism releases
        every prism-arm cell measured a configuration no user gets.

        Caught in the v054-smoke traces: 4 denied grep calls in the prism arm, 0
        in baseline. octodns spent turns 2 and 3 on greps that were refused, then
        loaded prism at turn 4 and searched again.

        The damage is not noise, it is sign. An arm that cannot grep turns "did
        the agent choose prism?" into "the agent had no alternative", and that
        reads as ADOPTION in every downstream metric — a broken run looks like a
        good result. Adoption percentages from affected runs are suspect;
        ab38-*/haiku38/sonnet38 are dated 2026-08-15 and may be affected.

        Changes:

        - `prism init`, no flags. The agent gets .mcp.json, the steering block,
          and a free choice between grep and prism — which is the actual
          question being asked.
        - After init, read the worktree's .claude/settings.json and RAISE if
          permissions.deny is non-empty. Same verify-don't-assume posture as the
          wrong-code checkout guard, and this failure mode is worse because it
          fails in the flattering direction.
        - prism_provenance(): path, version, sha256 of the binary, mtime, and
          the tool list the MCP server actually advertises. Printed at startup,
          written to prism_provenance.json beside the cells. `prism version` on
          a local build says only "prism dev" and ~/bin/prism is rebuilt
          constantly, so the hash is what pins a results directory to a build.
          Refuses to start if --prism does not exist.
        - parse_stream now records MCP tool ARGUMENTS (tool_calls), not just
          names. It read `input` and used it only for Bash/ToolSearch, so no run
          could answer "did the agent batch its search terms?" — the question a
          tool-surface change lives or dies on, and the reason v054-smoke was
          uninterpretable. tool_trace keeps its string shape for existing
          analyses; lists survive as lists so query=["a","b"] is visible.
        - SHORT_PRISM_STEERING marked unwired and stale (nothing passes
          steering_variant="short"; it describes the v0.50 surface).

        Tests rewritten, 4 passing, all free and all before the first paid cell:
        plain init with grep available; matched INVESTIGATION_GUIDANCE with zero
