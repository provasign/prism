        Bash(prism:*), CLI-first steering, and NO MCP server, .mcp.json, or tool
        schemas. This is what commit 119d8ff ran before 2bec8bf replaced it with
        the MCP deployment, and it matters because those two CLI beds are where
        prism came out cheaper in 76% of cells against 44% for the MCP beds
        (median -$0.279 vs +$0.032, resolve rates flat across both).

