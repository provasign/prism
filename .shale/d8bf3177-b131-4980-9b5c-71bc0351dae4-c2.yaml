        fix(search): truncation now carries a denominator, and the agent can ask
        for completeness

        Two related holes, both surfaced by the beets-5890 cell in the running
        38-task A/B — a task whose gold patch touches 90 files and 1,024 lines
        ("convert every .format() call to an f-string").

        1. A CAPPED RESULT LOOKED COMPLETE. prism_search returned at most 25 hits
           with `truncated: true` and NO total. Measured on this repo: "func "
           returned 22 hits and said truncated, against 1,311 real matches across
           157 files. An agent cannot tell 22-of-25 from 22-of-1311, and the
           capped list reads as the whole picture. That is precisely what HANDOFF
           §5.7 forbids -- "never let the graph narrow a result silently, state
           both counts" -- and the failure SWE-Explore measures as the expensive
           one: missing evidence costs far more than noise.

           runLineTool broke out of the scan at the cap, discarding the rest of
           stdout it had already read. It now counts every match and keeps the
           first MaxHits, so Result carries TotalHits and FilesMatched, and the
           tool result carries an explicit warning: "showing 25 of AT LEAST 1311
           matches across 157 files -- this is a SAMPLE".

           AT LEAST, not exactly: the backend runs under a per-file cap, so a file
           with 200 matches contributes at most MaxPerFile. Stated rather than
           implied.

        2. THE AGENT COULD NOT ASK FOR EVERYTHING. exhaustive=true removes both
           caps. The agent declares it -- prism does not guess, the same principle
           that took the phase inference out of prism_query. "Where is X" wants a
           sample and a count; "rewrite every call site" wants all 1,024, and a
           capped answer to the second is worse than useless. Pair with
           files_only=true and it stays cheap: 157 files, uncapped, no lines.

           CLI: --exhaustive / --all.

        Verified against ripgrep: exhaustive + files_only returns 157 files,
        truncated=false. rg -l reports 100 and rg -l --hidden 132 -- prism
        searches hidden paths by design (the steering promises grep semantics),
        so more is expected here, and the direction is the safe one.

