        arms, and the biggest bucket is test-running plus Python environment
        wrangling (36% of baseline's Bash). Code navigation is ~10%. A tool that
        changes how an agent NAVIGATES is competing for a tenth of what the agent
        does, which bounds any navigation effect in this benchmark and explains
        why cost deltas here are so noisy relative to the effect being measured.

        It also caught that sonnet38 (43) and haiku38 (68) ran with grep denied,
        while ab38-t1/t2/f1 have no permission_denials field at all — so the
        older beds cannot be checked either way.

