        import json,glob,os,collections
        beds=['ab38-f1','ab38-t1','ab38-t2','haiku38','sonnet38']
        cells=0
        has=collections.Counter()          # per-cell presence
        pair=collections.Counter()
        qcells=[]                          # cells where query was called
        def tools(obj):
            """yield tool names from whatever trace shape this is"""
            out=[]
            def walk(o):
                if isinstance(o,dict):
                    for k,v in o.items():
                        if k in ('tool','tool_name','name') and isinstance(v,str) and v.startswith('prism_'):
                            out.append(v)
                        else: walk(v)
                elif isinstance(o,list):
                    for x in o: walk(x)
            walk(obj); return out
        for bed in beds:
            for f in sorted(glob.glob(f'{bed}/*.prism.json')):
                try: d=json.load(open(f))
                except Exception: continue
                cells+=1
                t=set(tools(d))
                for x in t: has[x]+=1
                if 'prism_query' in t:
                    qcells.append((bed,os.path.basename(f),sorted(t)))
                if 'prism_query' in t and 'prism_search' in t: pair['both']+=1
                elif 'prism_query' in t: pair['query only']+=1
                elif 'prism_search' in t: pair['search only']+=1
                else: pair['neither']+=1
        print('prism cells parsed:',cells)
        print('per-cell presence:',dict(has.most_common()))
        print('overlap:',dict(pair))
        PY
