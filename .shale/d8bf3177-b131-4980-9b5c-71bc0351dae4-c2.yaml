    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness/runs/swebench-live && python3 - <<'PY'
        import json,glob,re,collections
        beds=['ab38-f1','ab38-t1','ab38-t2','haiku38','sonnet38']
        VERBS=['query','search','read','lookup','change-impact','change_impact','node','map','verify',
               'references','dead-code','rename-plan','missing-implementations','arch','index']
        def verbs_in(call):
            s=call if isinstance(call,str) else str(call)
            out=set()
            for v in VERBS:
                if re.search(r'\bprism[ _]'+re.escape(v)+r'\b', s):
                    out.add(v.replace('_','-'))
            return out
        cells=0; presence=collections.Counter(); overlap=collections.Counter()
        calls=collections.Counter()
        order=collections.Counter()   # did search precede query in the same cell?
        for bed in beds:
            for f in sorted(glob.glob(f'{bed}/*.prism.json')):
                d=json.load(open(f)); cells+=1
                tr=d.get('tool_trace') or []
                seq=[]
                for c in tr:
                    vs=verbs_in(c)
                    for v in vs: calls[v]+=1
                    seq.append(vs)
                flat=set().union(*seq) if seq else set()
                for v in flat: presence[v]+=1
                q,s='query' in flat,'search' in flat
                overlap['both' if (q and s) else 'query only' if q else 'search only' if s else 'neither']+=1
                if q and s:
                    iq=min(i for i,x in enumerate(seq) if 'query' in x)
                    isr=min(i for i,x in enumerate(seq) if 'search' in x)
                    order['search first' if isr<iq else 'query first' if iq<isr else 'same call']+=1
        print('cells:',cells)
        print('\nCALLS   ',dict(calls.most_common()))
        print('\nCELLS   ',dict(presence.most_common()))
        print('\nquery vs search per cell:',dict(overlap))
        print('when both, which came first:',dict(order))
        PY
