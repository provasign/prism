        import json,glob,re,collections
        ALLOW={'git','grep','rg','find','cat','ls','sed','head','tail','python','python3'}
        den=[]
        for f in glob.glob('runs/swebench-live/ab38-v055/*.json'):
            if 'provenance' in f: continue
            for x in json.load(open(f)).get('permission_denials') or []:
                c=str(x.get('tool_input',{}).get('command',''))
                if c: den.append(c)

        def parts(c):
            # split on shell operators the way a per-subcommand allowlist would
            return [p.strip() for p in re.split(r'&&|\|\||;|\|', c) if p.strip()]
        def lead(p):
            p=p.strip()
            m=re.match(r'^([A-Za-z_]\w*=\S*\s+)+',p)
            if m: p=p[m.end():]
            p=p.lstrip('(')
            return p.split()[0] if p.split() else ''

