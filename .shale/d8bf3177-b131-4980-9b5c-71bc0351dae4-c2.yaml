        feat(search): accept multiple terms in one call, and render text results as text

        prism_search's query now takes a string OR an array of up to 10 terms.
        Results come back grouped under the term that produced them; a single
        term keeps the exact flat shape, so every existing caller, formatter and
        test is untouched.

        Why: in the 190-cell A/B, 490 of 900 search calls (54%) sat in
        back-to-back runs of 2-10 — 188 runs total. Each was its own turn, and
        each result is then re-read on every later turn (cache reads dominate:
        a result at turn 3 of 28 is paid ~25 times). Batching collapses those
        188 runs into 188 calls instead of 490.

        Terms past the cap are dropped with a note, never silently — SWE-Explore
        measures missing evidence as far more expensive than noise, and a quiet
        truncation reads to the agent as "searched everything, found nothing".

        CLI: `prism search a b c [--dir <path>]`. Bare arguments are all terms
        now. The documented `prism search <term> <dir>` form still works when the
        second argument really is a directory, and says so on stderr — the same
        two words are now also a legitimate two-term search, so the
        disambiguation must not be silent.

        Fixed alongside, pre-existing and costly: `prism search X --scope text
        --format text` printed JSON. A pure-text result has only textHits and
        fell past every branch of printTextOutput to the JSON fallback. That is
        the exact invocation the steering block gives Bash-only subagents, and
        it is 2.1x the bytes of the line-oriented form it asked for (4,411 vs
        2,105 on a 25-hit search). Present in v0.53.0 and every release before.

