        for c in den:
            ps=parts(c)
            bad=[lead(p) for p in ps if lead(p) and lead(p) not in ALLOW]
            if len(ps)>1 and bad: compound+=1
            for b in bad: offenders[b]+=1
        print(f"{len(den)} denials; {compound} ({compound/len(den):.0%}) are COMPOUND with a disallowed sub-command\n")
        print("most common disallowed sub-command leaders:")
