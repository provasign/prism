        feat(search): path scoping — the missing shape that sent agents back to grep

        prism_search gains path=, glob= and files_only=. Whole-tree-only was the
        last thing keeping an agent on grep when it already knew where to look.

        The evidence is behavioural, not theoretical. In the 2026-08-15 A/B cells,
        12 of 20 grep invocations named a path (matching the 511-of-946 v0.51.0
        mining), and the cells where the agent DECLINED prism open like this:

            grep -n "autolim" .../mplot3d/axes3d.py     <- knew the file
            grep -n "alias" octodns/manager.py          <- knew the file
            grep -rn "client_metadata" authlib/         <- knew the package

        The one cell that ADOPTED prism is the one where the issue did not say
        where to look. So the decline was not habit: prism could not express the
        query. HANDOFF §4 already called this "the strongest candidate for
        re-landing on its own".

            path=       one or more repo-relative files or directories
            glob=       rg --glob / grep --include, e.g. "*.py"
            files_only= paths without lines, the cheapest "where does this live"

        Composes with multi-term: query=["a","b"] + path="pkg/" is one call.

        Out-of-root scopes are REFUSED, not widened. Containment is checked on the
        symlink-resolved path (same rule as the native scanner), and when every
        requested scope is rejected the search returns NOTHING plus rejectedPaths
        and a warning. Falling back to the whole tree would answer a question
        about one directory with hits from everywhere else, which reads as success
        — the failure mode this repo keeps re-learning.

        Two bugs found while building it, both invisible without path scoping:

        - rg and grep OMIT the filename when given a single FILE operand, emitting
          "988:text" instead of "path:988:text". runLineTool parses path:line:text,
          so a search scoped to one file silently returned zero hits. Fixed with
          --with-filename / -H. Directory operands never showed it.
        - files_only cannot use rg --files-with-matches / grep -l for the same
          reason: bare-path output breaks the shared parser. The delivery layer
          drops the lines instead, which is where the token saving lands anyway.

