    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness && python3 - <<'PY'
        import json,glob,collections,statistics

        def phases(d):
            calls=d['tool_calls']
            edited=set()
            for c in calls:
                if c['name'] in ('Edit','Write','MultiEdit'):
                    fp=c['input'].get('file_path','')
                    if fp: edited.add(fp.split('/')[-1])
            if not edited: return None
            fe=next((i for i,c in enumerate(calls) if c['name'] in ('Edit','Write','MultiEdit')), None)
            ft=None
            for i,c in enumerate(calls):
                blob=json.dumps(c.get('input',{}))
                if any(f in blob for f in edited): ft=i; break
            if fe is None or ft is None: return None
            return dict(locate=ft, comprehend=fe-ft, implement=len(calls)-fe, total=len(calls))

        for arm in ('no-prism','prism'):
            rows=[]
            for f in glob.glob(f'runs/swebench-live/smoke5-v0551/*.{arm}.json'):
                p=phases(json.load(open(f)))
                if p: rows.append(p)
            if not rows: continue
            tot=sum(r['total'] for r in rows)
            print(f"{arm} — {len(rows)} cells, {tot} actions")
            for k in ('locate','comprehend','implement'):
                v=sum(r[k] for r in rows)
                print(f"  {k:12} {v:4} {v/tot:5.1%}  median {statistics.median(r[k] for r in rows):.0f}")
            print()
        PY
