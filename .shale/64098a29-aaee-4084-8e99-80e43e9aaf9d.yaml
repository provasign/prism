        import re
        def cls(c):
            n=c['name']; i=c['input']
            if 'prism' in n: return 'prism.'+str(i.get('op'))
            if n in('Read',): return 'Read'
            if n in('Grep','Glob'): return 'Grep'
            if n in('Edit','Write','MultiEdit'): return 'Edit'
            if n.lower()=='bash':
                cmd=i.get('command','')
                if re.search(r'\b(mvn|gradle|go (test|build|vet)|pytest|python3? -m pytest|npm|pnpm|yarn|bun|vitest|jest|tsc|cargo|javac|python3? -c|python3? \S+\.py|node )',cmd): return 'Bash.run'
                if re.search(r'\bsed -i|perl -pi|cat >|tee ',cmd): return 'Bash.edit'
                if re.search(r'\b(grep|rg|find|ls|git (log|grep|show|diff))\b',cmd): return 'Bash.find'
                if re.search(r'\b(cat|sed -n|head|tail|awk)\b',cmd): return 'Bash.read'
