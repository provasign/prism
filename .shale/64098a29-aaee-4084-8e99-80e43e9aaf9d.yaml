        		real, ok := uniqueClosestPath(files, p)
        		if !ok {
        			return p
        		}
        		notes = append(notes, fmt.Sprintf("path %q does not exist; used %s", p, real))
        		return real
        	}
        	fixList := func(key string) {
        		switch v := args[key].(type) {
        		case string:
        			args[key] = fix(v)
        		case []any:
        			for i, item := range v {
        				if s, ok := item.(string); ok {
        					v[i] = fix(s)
        				}
        			}
        		case []string:
        			for i := range v {
