        // cmdHookPostToolUse implements PostToolUse enrichment (prototype,
        // 2026-08-15): after the agent Reads a file, append what the graph knows
        // and the file itself cannot show — who depends on it. Design constraints,
        // each one a measured lesson from this project:
        //   - rides the tool-result channel (the only channel measured to steer);
        //   - requires NO adoption: the model already chose to Read;
        //   - silent unless there is real signal, once per file per session
        //     (resolvedRefNote's anti-wallpaper discipline; 14 repeated nudges
        //     measurably did nothing);
        //   - fails open on EVERYTHING (no index, timeout, parse error): a hook
        //     that slows or breaks Read trains the agent away from prism.
        func cmdHookPostToolUse() int {
        	var in struct {
        		SessionID string         `json:"session_id"`
        		CWD       string         `json:"cwd"`
        		ToolName  string         `json:"tool_name"`
        		ToolInput map[string]any `json:"tool_input"`
        	}
        	if err := json.NewDecoder(os.Stdin).Decode(&in); err != nil {
        		return 0
        	}
        	if in.ToolName != "Read" || in.CWD == "" {
        		return 0
        	}
        	fp, _ := in.ToolInput["file_path"].(string)
        	if fp == "" {
        		return 0
        	}
        	// Only enrich files inside an ALREADY-indexed project: AutoIndexIfEmpty
        	// would otherwise cold-index arbitrary repos as a side effect of a Read.
        	if _, err := os.Stat(filepath.Join(in.CWD, ".grove", "grove.db")); err != nil {
        		return 0
        	}
        	rel, err := filepath.Rel(in.CWD, fp)
        	if err != nil || rel == ".." || strings.HasPrefix(rel, ".."+string(filepath.Separator)) {
        		return 0
        	}
        	rel = filepath.ToSlash(rel)

        	// Once per file per session.
        	sid := in.SessionID
        	if len(sid) > 8 {
        		sid = sid[:8]
        	}
        	seenFile := filepath.Join(in.CWD, ".grove", "hook-enrich-"+sid+".txt")
        	if raw, err := os.ReadFile(seenFile); err == nil {
        		for _, line := range strings.Split(string(raw), "\\n") {
        			if line == rel {
        				return 0
        			}
        		}
        	}

        	// Watchdog: enrichment must never make Read feel slow. Miss the budget,
        	// skip the enrichment — never the other way around.
        	type res struct {
        		brief map[string]any
        		err   error
        	}
        	ch := make(chan res, 1)
        	go func() {
        		b, err := postToolUseBrief(in.CWD, rel)
        		ch <- res{b, err}
        	}()
        	var brief map[string]any
        	select {
        	case r := <-ch:
        		if r.err != nil {
        			return 0
        		}
        		brief = r.brief
        	case <-time.After(2500 * time.Millisecond):
        		return 0
        	}

        	msg := formatFileBrief(rel, brief)
        	if msg == "" {
        		return 0
        	}
        	f, err := os.OpenFile(seenFile, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
        	if err == nil {
        		fmt.Fprintln(f, rel)
        		f.Close()
        	}
        	printJSON(map[string]any{
        		"hookSpecificOutput": map[string]any{
        			"hookEventName":     "PostToolUse",
        			"additionalContext": msg,
        		},
        	})
        	return 0
        }

        // formatFileBrief renders the enrichment line. Empty string = no signal, say
        // nothing. Hard cap keeps it a footnote, never a payload.
        func formatFileBrief(rel string, brief map[string]any) string {
        	if brief == nil {
        		return ""
        	}
        	deps, _ := brief["dependents"].([]string)
        	if deps == nil {
        		if raw, ok := brief["dependents"].([]any); ok {
        			for _, d := range raw {
        				if s, ok := d.(string); ok {
        					deps = append(deps, s)
        				}
        			}
        		}
        	}
        	if len(deps) == 0 {
        		return "" // nothing the agent could not see by reading the file
        	}
        	shown := deps
        	more := 0
        	if len(shown) > 3 {
        		more = len(shown) - 3
        		shown = shown[:3]
        	}
        	msg := fmt.Sprintf("[prism] %d file(s) depend on %s: %s", len(deps), rel,
        		strings.Join(shown, ", "))
        	if more > 0 {
        		msg += fmt.Sprintf(" (+%d more)", more)
        	}
        	msg += ". Before changing a signature defined here, prism_change_impact(\\"<Type.method>\\") returns the complete caller set."
        	if len(msg) > 600 {
        		msg = msg[:600]
        	}
        	return msg
        }

        func cmdCompact(args []string) int {'''
