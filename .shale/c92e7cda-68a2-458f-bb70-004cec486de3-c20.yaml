        		})
        	}
        	out := map[string]any{"file": rel, "defines": defined}
        	// Same dependents derivation as nodeFile: edges whose To side lives in
        	// this file, grouped by the depending file.
        	if edges, err := h.Grove.Deps(ctx, rel); err == nil {
        		prefix := rel + "::"
        		seen := map[string]bool{}
        		dependents := []string{}
        		for _, e := range edges {
        			if !strings.HasPrefix(e.To, prefix) {
        				continue
        			}
        			from := e.From
        			if i := strings.Index(from, "::"); i >= 0 {
        				from = from[:i]
        			}
        			from = strings.TrimPrefix(from, "file:")
        			if from == "" || from == rel || seen[from] {
        				continue
        			}
        			seen[from] = true
        			dependents = append(dependents, from)
        		}
        		sort.Strings(dependents)
        		out["dependents"] = dependents
        	}
        	return out, nil
        }

