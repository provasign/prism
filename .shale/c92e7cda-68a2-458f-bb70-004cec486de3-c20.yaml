        new = '''// postToolUseBrief fetches graph structure for one file. A var so tests can
        // stub the engine; the default goes through the same handler dispatch as
        // every CLI verb (internal-only tool, absent from tools/list).
        var postToolUseBrief = func(root, rel string) (map[string]any, error) {
        	out, err := invokeWithPersistentLedger(root, "prism_file_brief", map[string]any{"file": rel})
        	if err != nil {
