            for iid in ids:
                rows.append((trial,iid,verdict(trial,'baseline',iid),verdict(trial,'prism',iid)))
        def table(rs,label):
            n=len(rs); b=sum(r[2] for r in rs); p=sum(r[3] for r in rs)
            bo=sum(1 for r in rs if r[2] and not r[3]); po=sum(1 for r in rs if r[3] and not r[2])
            # McNemar exact two-sided
            d=bo+po
            pval=sum(comb(d,k) for k in range(0,min(bo,po)+1))*2/2**d if d else 1.0
            pval=min(1.0,pval)
            print(f'{label}: n={n} | baseline {b} ({b/n:.1%}) prism {p} ({p/n:.1%}) | discordant {bo} vs {po} | McNemar p={pval:.3f}')
            return [ (r[1]) for r in rs if r[2]!=r[3]]
        disc=table(rows,'POOLED all 76 cells        ')
        table([r for r in rows if r[1] not in EXCL],'POOLED excl cheater tasks  ')
        table([r for r in rows if r[0]=='ab38-t1'],'  trial 1                  ')
        table([r for r in rows if r[0]=='ab38-t2'],'  trial 2                  ')
        # do the same tasks flip in both trials?
        from collections import Counter
        c=Counter(disc)
        print('tasks discordant in BOTH trials:', [k for k,v in c.items() if v==2])
        EOF
