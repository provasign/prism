        Fixes a real regression found via the Sonnet ab_gate: change_impact on a
        bare method name ambiguous across many receivers (e.g. an interface with
        no local declaration, only implementors) invited the agent to loop over
        candidates one at a time and still miss sites reachable only by text
        search. Past a candidate-count threshold, the engine now resolves one
        inferred external-interface family in a single call instead of inviting
        per-candidate guessing; exhaustive text search results list every exact
        file/line/symbol instead of collapsing into directory summaries past the
        flat cap; large impact payloads omit redundant signatures/call excerpts
        for exact (non-heuristic) edges.

        Verified on this exact commit before tagging:
        - go test ./... green; ci_invariants (engine ceiling gate): all 13
          invariants held.
        - Deterministic change-impact oracle: 5/5 identical runs, recall 1.0 on
          the regressed task (grafana-querydata-impact), byte-identical payload
          each time — the engine fix is reproducible, not agent-noise-dependent.
        - Full 9-task Sonnet ab_gate (fresh, no cache) vs v0.71.1: PASS. Mean
          recall delta +0.027, mean precision delta +0.064, request tokens -45%,
          aggregate billed cost 0.71x baseline — the first run this project has
          measured where the candidate is cheaper than baseline in aggregate,
          not just within the not-broken threshold.
        - Native-tools comparison (no prism at all) on the same 9 tasks, one
          trial each: mean recall delta +0.315, mean precision delta +0.185,
          aggregate cost 0.40x. Best result yet against real native tools;
          single-trial, not yet repeated for noise.

        Known gaps, not fixed in this release: the same ambiguous-impact failure
        shape (bare name, no local interface declaration to anchor a family
        query) still reproduces on Django (quote_name, get_connection_params,
        adapt_datetimefield_value), commons-lang (appendDetail), and gin
        (CloseNotify) per a deterministic oracle sweep — this release's fix
        generalizes the mechanism but has only been validated end-to-end on the
        Grafana task class it was built for. The original wide-bed finding
        (prism not shown cheaper at completing edits, only at locating sites)
        was not re-tested against this build.

