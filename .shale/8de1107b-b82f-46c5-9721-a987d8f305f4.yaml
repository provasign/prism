        func csharpArgTypes(idx *edgeIndex, symbol *core.SymbolRecord) map[string]string {
        	out := map[string]string{}
        	record := func(typ, name string) {
        		if typ = csNormalizeType(typ); typ != "" && name != "" {
        			out[name] = typ
        		}
