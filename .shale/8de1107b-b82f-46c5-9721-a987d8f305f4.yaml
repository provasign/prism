        static oracles

        A receiver typed by a class or interface runs whichever subtype's override
        the instance carries. narrowByLocalType now returns the subclass overrides
        and interface implementors (subclassOverrides, per-language subclass map;
        maxDispatchFanout=64) as reason=dispatch edges for every class language,
