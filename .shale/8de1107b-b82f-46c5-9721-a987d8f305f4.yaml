        		t = "string"
        	case "Boolean", "boolean":
        		t = "bool"
        	case "Int32":
        		t = "int"
        	case "Int64":
        		t = "long"
        	case "Int16":
        		t = "short"
        	case "Byte":
        		t = "byte"
        	case "Char":
