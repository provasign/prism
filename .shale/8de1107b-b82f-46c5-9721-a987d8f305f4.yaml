        	}
        	for {
        		trimmed := strings.TrimLeft(src, " \t\r\n")
        		switch {
        		case strings.HasPrefix(trimmed, "/*"):
        			end := strings.Index(trimmed, "*/")
        			if end < 0 {
        				return trimmed
        			}
        			src = trimmed[end+2:]
        		case strings.HasPrefix(trimmed, "//"):
        			nl := strings.IndexByte(trimmed, '\n')
        			if nl < 0 {
        				return trimmed
        			}
        			src = trimmed[nl+1:]
        		case strings.HasPrefix(trimmed, "["):
        			depth := 0
        			k := 0
        			for ; k < len(trimmed); k++ {
        				if trimmed[k] == '[' {
        					depth++
        				} else if trimmed[k] == ']' {
        					depth--
        					if depth == 0 {
        						break
        					}
        				}
        			}
        			if k >= len(trimmed) {
        				return trimmed
        			}
        			src = trimmed[k+1:]
        		default:
        			return trimmed
        		}
        	}
        }

