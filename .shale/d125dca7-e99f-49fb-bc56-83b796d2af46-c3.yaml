        import json,glob,time,os,sys,collections
        H='/Users/tapabratapal/Projects/provasign/research/harness/'
        man=json.load(open(H+'results/seeded32-manifest.json')); arms=['native','prism_body_exp']
        seen=set(json.load(open(sys.argv[1])) if len(sys.argv)>1 and os.path.exists(sys.argv[1]) else [])
        logpos=0; state=sys.argv[1] if len(sys.argv)>1 else None
        while True:
            R=collections.defaultdict(dict)
            for f in glob.glob(H+'results/e2e-seeded32/*.json'):
                try: r=json.load(open(f)); R[r['task']][r['arm']]=r
