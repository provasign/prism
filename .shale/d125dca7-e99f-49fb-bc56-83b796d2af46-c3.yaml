        """Where Prism answers repeat themselves: per line, bytes spent on a file path equal to the previous line's,
        on a trailing [Symbol] tag equal to the previous line's, and on other repeated prefixes."""
        import json,glob,os,re,collections,sys
        H='/Users/tapabratapal/Projects/provasign/research/harness/results'
        PJ=os.path.expanduser('~/.claude/projects')
