        Grove v0.62.2: Python calls on objects built elsewhere now resolve.

        **Fixes**
        - **Methods inherited through an aliased base class.** Flask's public `Blueprint` subclasses `Blueprint as SansioBlueprint`, and `route` lives further up on `Scaffold`. Prism lost the call entirely. It now follows each base class to the module it was imported from.
