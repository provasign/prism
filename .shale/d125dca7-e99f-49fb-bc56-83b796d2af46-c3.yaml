        PATHLINE=re.compile(r'^(\s*)([\w./@$+-]+\.[A-Za-z]{1,6})(:\d+(?:-\d+)?[:\s])')
        TAG=re.compile(r'(\s+\[[^\]\n]{1,80}\])\s*$')
        for run in runs:
            tot=collections.Counter(); ops=collections.Counter(); answers=0
            examples={}
            for f in glob.glob(f'{H}/{run}/*.json'):
                r=json.load(open(f))
                if r.get('arm')!='prism_body_exp': continue
                for p in glob.glob(f"{PJ}/*/{r.get('session_id')}.jsonl"):
                    uses={}
                    for l in open(p):
                        m=json.loads(l).get('message') or {}
                        for b in (m.get('content') if isinstance(m.get('content'),list) else []):
                            if not isinstance(b,dict): continue
                            if b.get('type')=='tool_use' and b['name'].startswith('mcp__prism'): uses[b['id']]=b['input'].get('op')
                            if b.get('type')=='tool_result' and b.get('tool_use_id') in uses:
                                c=b.get('content'); txt=c if isinstance(c,str) else ''.join(x.get('text','') for x in (c or []) if isinstance(x,dict))
                                answers+=1; op=uses[b['tool_use_id']]; ops[op]+=len(txt)
                                tot['all']+=len(txt)
                                prev_path=prev_tag=None
                                for line in txt.splitlines():
                                    m1=PATHLINE.match(line)
                                    if m1:
                                        path=m1.group(2)
                                        if path==prev_path:
                                            tot['repeated path']+=len(path); examples.setdefault('repeated path',line[:120])
                                        prev_path=path
                                    m2=TAG.search(line)
                                    if m2:
                                        tag=m2.group(1)
                                        if tag==prev_tag:
                                            tot['repeated [Symbol] tag']+=len(tag); examples.setdefault('repeated [Symbol] tag',line[-120:])
                                        prev_tag=tag
                                    else: prev_tag=None
                                    if line.startswith('// root: '): tot['root header line']+=len(line); examples.setdefault('root header line',line[:120])
                                    if re.match(r'^\s*\d+\t',line): tot['line-number prefix (read bodies)']+=len(line)-len(line.lstrip()) + len(line.lstrip().split('\t',1)[0])+1
            a=tot['all']
            print(f'## {run}: {answers} prism answers, {a/1000:.0f}k chars (~{a//4000}k tokens)')
            for k,v in tot.most_common():
                if k=='all': continue
                print(f'   {k:36} {v/1000:7.1f}k chars  {100*v/a:5.1f}% of all answer text')
            print('   by op:', {k:f'{100*v/a:.0f}%' for k,v in ops.most_common()})
            for k,e in examples.items(): print(f'   e.g. {k}: {e!r}')
        EOF
