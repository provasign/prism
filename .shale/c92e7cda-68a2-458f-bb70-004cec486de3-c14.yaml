    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness/runs/swebench-live/haiku38/ 2>/dev/null
        python3 - <<'EOF'
        import json, glob
        from collections import defaultdict

        rows = defaultdict(dict)
        for f in glob.glob("*.baseline.json") + glob.glob("*.prism.json"):
            rec = json.loads(open(f).read())
            iid = rec["instance_id"]
            arm = "prism" if f.endswith(".prism.json") else "baseline"
            rows[iid][arm] = rec

        pairs = {k: v for k, v in rows.items() if "baseline" in v and "prism" in v}
        print(f"{len(rows)} instances with >=1 cell, {len(pairs)} complete pairs\n")

        def cost(r): return r.get("cost_usd") or r.get("total_cost_usd") or 0
        def turns(r): return r.get("num_turns") or r.get("turns") or 0
        def used(r): return r.get("prism_used")

        bc = pc = 0
        bcost = pcost = 0.0
        bturns = pturns = 0
        for iid, v in sorted(pairs.items()):
            b, p = v["baseline"], v["prism"]
            bc += bool(b.get("resolved")); pc += bool(p.get("resolved"))
            bcost += cost(b); pcost += cost(p)
            bturns += turns(b); pturns += turns(p)
            print(f"{iid[:44]:<45} base={str(b.get('resolved')):<6} prism={str(p.get('resolved')):<6} "
                  f"base_turns={turns(b):<3} prism_turns={turns(p):<3} used={used(p)}")

        n = len(pairs)
        print(f"\nraw self-reported resolve: baseline {bc}/{n}, prism {pc}/{n}")
        print(f"avg cost: baseline ${bcost/n:.2f}, prism ${pcost/n:.2f} (ratio {pcost/bcost:.2f}x)" if n else "")
        print(f"avg turns: baseline {bturns/n:.1f}, prism {pturns/n:.1f}" if n else "")
        EOF
