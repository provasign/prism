        cd /Users/tapabratapal/Projects/provasign/prism
        git commit -q -F - <<'EOF'
        enforce: prism as a Claude Code PreToolUse hook; drop dead task param; compact text-search output

        Three fixes from today's haiku38 benchmark wrap-up and a real-usage report
        of an agent bypassing prism via ad-hoc python reads.

        1. PreToolUse hook (the main change). `prism init --deny-builtin-search`
           now also registers `prism hook pretooluse` on the Bash/Grep matchers in
           the project's .claude/settings.json, alongside the existing
           permissions.deny rule. A hook's `deny` decision fires before permission
           rules are evaluated and feeds permissionDecisionReason back to the model
           as tool-result text ("use prism_search instead") instead of a bare
           failure — verified live (forced-grep smoke test) that the block itself
           is byte-identical with or without permissions.deny present; the deny
           rule is now a failsafe, not the enforcement mechanism. Scope is
           deliberately narrow: only grep/rg is ever denied, python is untouched
           (explicit product decision — python is legitimate for tests/repro
           scripts, and reliably distinguishing "python reimplementing grep" from
           normal use isn't attempted here).

        2. Removed prism_read's `task` param (schema, handler, compression.Options)
           — documented as intentionally unused by CompressFileRead ("does NOT
           influence a first read"), but the schema still described it as "used
           for relevance ranking," which was actively misleading agents into
           writing verbose task strings expecting narrowed output.

        3. renderTextMatches (prism_search scope=text, prism_query's merged
           textMatches) now renders compact file:line:text plain-text lines
           instead of nested JSON objects — cut per-match envelope overhead
           (measured ~2-12 tokens/match, worse when hits scatter across files)
           while keeping the session-SHA cache discipline (already-delivered files
           still collapse to a one-line summary). Simplified the CLI's
           `--format text` path in the process: printTextMatches used to
           reconstruct text from the JSON shape; now it prints the string.

        README.md / AGENT_SETUP_PROMPT.md updated: both described
        --deny-builtin-search as only writing permissions.deny, no longer accurate
        now that the hook is the primary mechanism.

        go build / go vet / go test ./... all green. Hook behavior verified with a
        live claude -p smoke test (forced grep instruction) comparing hook+deny vs
        hook-only — enforcement identical in both; not committed to CI, this was a
        manual verification pass.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_013KQbcGBEfN6F9T7NxAdA3a
        EOF
        git log -1 --stat | head -25
