        # Prism: compact MCP schema repair + steering rewrite

        Repo: provasign/prism (Go). Work on a branch. Do NOT tag or release.
        Done = `GOWORK=off go test ./...` green + report the new compact schema byte size.

        ## Why (measured, not speculative)

        - GPT-5.5 on v0.73.0: `change_impact(name=…, limit=…)` → retry `query=…, limit=…` → retry `query=…`.
          3 turns for 1 result, 7 wasted calls across 3 cells. Correct on all tasks; efficiency gain erased.
        - Root cause is mechanical. `CompactToolSchemas` (internal/mcp/tools.go ~354-420) unions every
          op's properties, keeps the FIRST contributor of each name (ops walked lookup, read, search,
          query, change_impact, verify), and strips every `description`. Result:
            * `limit` = read's, with `maximum: 240` — but search allows 2000, query means "candidate cutoff".
              Three meanings, one name, no description left to tell them apart.
            * `name` is advertised (lookup only) so `change_impact(name=…)` is schema-valid, then rejected
              after the fact by `validateCompactArguments`. The schema invites the call it refuses.
            * `query` = search's string|array, so `change_impact(query=[…])` passes schema and means nothing.
            * `file` has three meanings (read path / lookup hint / change_impact disambiguator).
        - Transcript data (6,996 tool-bearing turns): cross-call batching 0.0% (1 turn). Within-call
          batching (arrays in name/terms/path) 21%. Spend knobs (`exhaustive`, `budget`, `delivery`,
          `max_files`) set in ~6% of prism calls; `context` 12%; scoping knobs (`scope`/`path`/`glob`)
          52%/18%/6%. Conclusion: agents enrich a call they are already making; they do not add calls or
          set cost knobs. Defaults must be right without cooperation.

        ## Hard constraints

        1. Top-level schema stays FLAT. No root `oneOf`/`anyOf` — older MCP hosts drop tools carrying it
           (see comment above `CompactToolSchemas`). Discrimination is expressed by DISJOINT FIELD NAMES
           plus an `ops:` prefix in each field description, not by composition keywords.
        2. `compact_test.go` asserts compact JSON < half of legacy `ToolSchemas()` JSON (legacy ≈ 9,784 B,
           so budget ≈ 4,892 B; today's compact is 4,690 B). Keep descriptions to the literal `ops:` list
           plus at most one short clause. If the 2x gate binds after that, report it — do not delete the
           `ops:` prefixes to fit.
        3. `additionalProperties: false` on `args` stays. Unknown or wrong-op fields are rejected with an
           error that lists the fields accepted BY THE SELECTED OP (extend `validateCompactArguments`).
        4. No aliases for removed names (`limit`, `offset`, `query`, `context`, …). Listing an alias
           re-creates the collision. Reject with "use <new name>".
        5. Do NOT add `_meta.anthropic/alwaysLoad` (residency). Separate decision, needs its own A/B.
        6. One `op` per call. Do NOT add an `ops[]` batch envelope — 0/6,996 turns batch across calls.

        ## Schema (compact `prism` tool)

        op: enum lookup | read | search | query | change_impact | verify
            description carries the per-op field map, verbatim:
            "lookup: name[,symbol_file,fields] | read: file,from,to or ranges | search: terms[,scope,paths,
             glob,regex,files_only,max_results,exhaustive] | query: task,terms[,paths,glob] |
             change_impact: name[,symbol_file,signature] | verify: removed_symbols. Known symbol → lookup;
             search only when location is unknown."

        args (every field lists its owning ops in its description; no field has two meanings):

          name            ops: lookup, change_impact. Symbol(s). string | array ≤10 of string | {name,file}.
                          change_impact accepts one symbol (string or 1-element array); error otherwise.
                          Maps to legacy lookup.name / change_impact.query.
          symbol_file     ops: lookup, change_impact. Disambiguating file scope. string.
                          Maps to legacy lookup.file / change_impact.file.
          fields          ops: lookup. Unchanged enum.
          signature       ops: change_impact. Unchanged.
          file            ops: read. Repo-relative path. string.
          from, to        ops: read. Inclusive 1-based line range. Span > 240 is CLAMPED to 240 with a note
                          (degrade, never error). Omit both = whole file subject to the same clamp.
                          Maps to legacy read.offset/limit.
          ranges          ops: read. array ≤10 of {file, from, to}. Multi-window read in ONE call. Same
                          per-range clamp; total delivered lines capped at 600 (tunable const), clamped
                          ranges listed in the result note.
          terms           ops: search, query. string | array ≤10. Never join identifiers with spaces.
                          Maps to legacy search.query / query.terms.
          task            ops: query. Natural-language task. string.
          scope           ops: search. both|text|symbols. Unchanged.
          paths, glob     ops: search, query. Unchanged shapes.
          regex           ops: search.
          files_only      ops: search.
          max_results     ops: search. integer ≤ 2000. Maps to legacy search.limit.
          removed_symbols ops: verify. Unchanged.
          exhaustive      ops: search. Forces completeness past the adaptive default (below).

        REMOVED from the surface (become server defaults): limit, offset, query, context, budget,
        delivery, max_files, rollup_only, include, model, profile, context_used, base.
        For each: confirm against `toolSchema(<legacy tool>)`; if a removed field is required by a
        legacy op with no sane default, say so in the report rather than silently keeping it.

        Compact→legacy mapping lives in `expandCompactCall` / `validateCompactArguments`
        (internal/mcp/server.go ~134). Legacy tools and their schemas are untouched; only the compact
        gateway changes.

        ## Server defaults that the removals depend on

        These are what make dropping the knobs safe. Implement in the same change:

        a. Adaptive completeness (search, text pass): if the complete hit inventory fits a token budget
           (const, start 4,000 tokens via `ranking.EstimateTokens`), return it complete and drop the
           "Text matches are a SAMPLE" warning. Otherwise sample as today and keep the warning.
           `textsearch.Options` already has an `Adaptive` flag — start there. `exhaustive=true` still
           forces the full inventory.
        b. Context lines on text hits default to 2 (was 0 unless the agent set `context`). The field's
           own old description said "instead of a follow-up read"; make that the default.
        c. Locator auto-escalation (search, symbol pass): when ≤ 3 symbol hits and their bodies fit the
           same token budget, inline the bodies and omit the "locator result — use op=lookup" note.
           Otherwise unchanged.

        ## Steering (replace `steeringInstructions` const in internal/cli/commands.go; it is the single
        source written to CLAUDE.md / AGENTS.md / copilot-instructions.md / GEMINI.md by `prism init`)

        ## Prism — context delivery

        Repository discovery starts with Prism. Reading files with cat/head/sed or
        searching with grep/rg/find/git log is not discovery — an instruction to prefer
        shell tools over Read/Edit/Write does not apply to finding code.

        First action on any code task, in this order. Stop at the first that works:
          1. The `prism` MCP tool (`mcp__prism__prism` in Claude Code), if callable.
          2. If a `ToolSearch` tool exists: `ToolSearch("select:mcp__prism__prism")`, once.
             Prism not being listed does not mean it is absent.
          3. The `prism` CLI: `prism query "<task>" --terms X`, `prism lookup <pkg.Func>`,
             `prism search <term> --scope text --format text`, `prism change-impact Type.method`.

        Pick the op:
          known symbol      -> lookup          unknown location/text -> search
          known file/range  -> read            callers/tests/related -> query
          pre-edit sites    -> change_impact

        Put every symbol and term you already know into ONE call: `name` and `terms`
        take up to 10; `ranges` reads several windows at once. Two lookups in a row is
        one lookup you did not batch.

        Obligations:
          - change_impact before editing a signature, public contract, override, or any
            symbol whose callers you have not enumerated. Relay its sites as-is.
          - verify({removed_symbols:[...]}) before a removal; verify({}) before finishing
            a multi-site or signature change.
          - Report gaps; never narrow scope to fit what was found.

        <!-- prism:end -->

        Keep the `<!-- prism:end -->` marker (bounded section; re-init replaces only up to it).

        ## Tests to update (they assert on current phrasing/shape)

        - internal/mcp/compact_test.go — op enum unchanged; the "lookup for any known symbol" description
          assert; the `limit maximum == 240` assert (field is gone; assert `to`/`ranges` shape instead);
          the 2x size gate; add: no two fields share a name with different meanings (every field's
          description starts with "ops:"), `change_impact(name=)` validates, `change_impact(query=)`
          and `search(limit=)` reject with a message naming the accepted fields for that op.
        - internal/mcp/searchmulti_test.go `TestToolSchemas_NoResidency` — extend to `CompactToolSchemas()`
          so residency stays a deliberate change.
        - internal/cli/steeringdelivery_test.go, internal/cli/init_test.go — phrase asserts;
          init_test.go:434 requires "mcp__prism__prism" and "prism query" in CLAUDE.md (both present).
        - Add tests for (a)(b)(c) defaults: small inventory returns complete with no SAMPLE warning;
          large inventory still samples; text hits carry 2 context lines by default; ≤3 symbol hits inline
          bodies and drop the locator note.
        - Align the MCP server `instructions` string (server-level, delivered on initialize) with the
          steering's first paragraph; it currently says "Do not begin with native Read/Grep/search" and
          should also name cat/head/sed/find/git log.

        ## Report back

        - New compact schema byte size vs legacy, and whether the 2x gate bound.
        - Any removed field a legacy op could not default.
        - `go test ./...` output.
        - Do not run the A/B or ci_invariants; those are run by the owner before any tag.
        EOF
