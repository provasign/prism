        import json,re
        from pathlib import Path
        root=Path('/private/tmp/prism-verify-policy-bench-20260912')

        def verify_commands(path):
            calls=[]
            for line in path.read_text().splitlines():
                try: event=json.loads(line)
                except json.JSONDecodeError: continue
                if event.get('type')!='item.started': continue
                item=event.get('item') or {}
                if item.get('type')=='command_execution' and re.search(r'\bprism\s+verify\b',item.get('command','')):
                    calls.append(item.get('command'))
                if item.get('type')=='mcp_tool_call' and (item.get('tool')=='prism_verify' or (item.get('tool')=='prism' and isinstance(item.get('arguments'),dict) and item['arguments'].get('op')=='verify')):
                    calls.append('MCP '+item.get('tool'))
            return calls
        rows=[]
        for arm,folder in [('generic_optional','baseline3'),('language_aware','candidate2')]:
            for measurement in sorted((root/folder/'evidence').glob('*/measurement.json')):
                d=json.loads(measurement.read_text())
                rows.append({'bed':'real_python','arm':arm,'task':d['task'],'resolved':d['resolved'],'audited_valid':d['audited_valid'],'tokens':d['total_tokens'],'cost_usd':d['cost_usd'],'agent_wall_s':d['wall_s'],'tool_calls':d['tool_calls'],'prism_actions':d['prism_actions'],'verify_commands':verify_commands(measurement.parent/'stdout.jsonl'),'evidence':str(measurement)})
        for lang in ('go','python'):
            for arm in ('release','candidate'):
                folder=root/'controlled'/f'{lang}-{arm}'
                d=json.loads((folder/'measurement.json').read_text())
                rows.append({'bed':'controlled','arm':arm,'task':lang,'passed':d['score_exit_code']==0,'tokens':d['usage'].get('input_tokens',0)+d['usage'].get('output_tokens',0),'agent_wall_s':d['wall_s'],'verify_commands':verify_commands(folder/'events.jsonl'),'evidence':str(folder/'measurement.json')})
        summary={'model':'gpt-5.5','rows':rows,'limitations':['One trial per arm/task; token and wall differences cannot establish causal savings.','Real-task comparison isolates language wording on top of prior optional policy; neither arm made a successful verify call.','Controlled comparison uses released HEAD vs candidate, so it includes prior verify fixes as well as new wording.','Candidate urllib3 cell attempted unsupported CLI flag --removed-symbols and received exit 2.','Java negative control unavailable: javac reports no Java Runtime installed.']}
        (root/'reconciled-summary.json').write_text(json.dumps(summary,indent=2))
        for row in rows:print(row['bed'],row['arm'],row['task'],'ok',row.get('passed',row.get('resolved')),'tokens',row['tokens'],'verify',len(row['verify_commands']))
        PY
