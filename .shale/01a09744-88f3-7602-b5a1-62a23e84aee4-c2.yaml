        children = {}
        for row in rows:
            pid, ppid = map(int, row.split())
            children.setdefault(ppid, []).append(pid)
        order = []
        def walk(pid):
            for child in children.get(pid, []):
                walk(child)
            order.append(pid)
        walk(root)
        print('stopping benchmark process tree:', order)
        for pid in order:
            try:
                os.kill(pid, signal.SIGTERM)
            except ProcessLookupError:
                pass
        PY
