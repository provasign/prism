    - cmd: |-
        python3 - <<'EOF'
        import json, glob, os, time, re, collections
        dirs = [d for d in glob.glob(os.path.expanduser("~/.claude/projects/-private-var-folders-*e2e-run-*"))
                if os.path.getmtime(d) > time.time() - 40*3600]
        redundant = 0; total_q = 0; sessions_with_overlap = 0; details = []
        for d in dirs:
            for f in glob.glob(d + "/*.jsonl"):
                qfiles = set(); overlap = collections.Counter(); q_seen = False
                pending = {}  # tool_use_id -> name
                for line in open(f, errors="ignore"):
                    try: j = json.loads(line)
                    except Exception: continue
                    if j.get("type") == "assistant":
                        for c in ((j.get("message") or {}).get("content") or []):
                            if isinstance(c, dict) and c.get("type") == "tool_use":
                                if c["name"].endswith("prism_query"):
                                    pending[c["id"]] = "q"; q_seen = True
                                elif c["name"] == "Bash" and q_seen:
                                    cmd = (c.get("input") or {}).get("command","")
                                    for fp in re.findall(r'[\w./-]+\.(?:py|java|go|ts)\b', cmd):
                                        base = os.path.basename(fp)
                                        if base in qfiles and re.search(r'\b(sed|cat|head|tail|grep)\b', cmd):
                                            overlap[base] += 1
                    if j.get("type") == "user":
                        for c in ((j.get("message") or {}).get("content") or []):
                            if isinstance(c, dict) and c.get("type") == "tool_result" and pending.get(c.get("tool_use_id")) == "q":
                                s = json.dumps(c.get("content"))[:20000]
                                for fp in re.findall(r'[\w./-]+\.(?:py|java|go|ts)\b', s):
                                    qfiles.add(os.path.basename(fp))
                if qfiles:
                    total_q += 1
                    if overlap:
                        sessions_with_overlap += 1
                        redundant += sum(overlap.values())
                        details.append((os.path.basename(f)[:8], len(qfiles), dict(overlap.most_common(3))))
        print(f"sessions with a prism_query result: {total_q}")
        print(f"sessions that then re-read/searched files query already delivered: {sessions_with_overlap}")
        print(f"total redundant bash ops on query-delivered files: {redundant}")
        for t in details[:10]: print("  ", t)
        EOF
