        """Seeded-task targets at a repo's current default-branch tip: functions defined once,
        called from >=1 examples/scripts/bench CODE file (outside the test loop) and from src or tests.
        Streams blobs through one `git cat-file --batch`; one repo per process."""
        import json, re, subprocess, sys, os, collections
        os.environ['GIT_NO_LAZY_FETCH'] = '1'
        repo, lang, out = sys.argv[1], sys.argv[2], sys.argv[3]
        EXT = {'python': ('.py',), 'ts': ('.ts', '.mts', '.js', '.mjs'), 'go': ('.go',)}[lang]
        DEF = {'python': re.compile(r'^(\s*)(?:async\s+)?def\s+([A-Za-z_]\w{4,})\s*\('),
               'ts': re.compile(r'^\s*export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]{4,})\s*[<(]'),
               'go': re.compile(r'^func\s+(?:\([^)]*\)\s*)?([A-Z]\w{4,})\s*[\[(]')}[lang]
        GAP = re.compile(r'(^|/)(_?examples?|scripts?|bench(marks?)?|playground|demos?|samples?|tutorials?|docs?)(/|$)', re.I)
        TEST = re.compile(r'(^|/)(tests?|testing|__tests__|testdata)(/|$)|_test\.go$|\.(test|spec)\.[mc]?[jt]sx?$|(^|/)test_[^/]*\.py$|(^|/)conftest\.py$', re.I)
        SKIP = re.compile(r'(^|/)(node_modules|vendor|dist|build|\.git)(/|$)|\.d\.ts$')
        def git(*a): return subprocess.run(['git', '-C', repo, *a], capture_output=True, text=True).stdout
        tip = git('rev-parse', 'origin/HEAD').strip() or git('rev-parse', 'HEAD').strip()
        files = [l.split('\t') for l in git('ls-tree', '-r', '--format=%(objectname) %(objectsize)\t%(path)', tip).splitlines()]
        files = [(o.split()[0], p) for o, p in files if p.endswith(EXT) and not SKIP.search(p) and int(o.split()[1]) < 400_000]
        kind = lambda p: 'test' if TEST.search(p) else 'gap' if GAP.search(p) else 'src'
        defs, texts = collections.defaultdict(list), {}
        cat = subprocess.Popen(['git', '-C', repo, 'cat-file', '--batch'], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
        for oid, p in files:
            cat.stdin.write(oid.encode() + b'\n'); cat.stdin.flush()
            hdr = cat.stdout.readline().split(); n = int(hdr[2]); data = cat.stdout.read(n); cat.stdout.read(1)
            t = data.decode('utf-8', 'replace'); texts[p] = t
            if kind(p) == 'src':
                for line in t.splitlines():
                    m = DEF.match(line)
                    if m:
                        name = m.group(m.lastindex)
                        if not name.startswith('__'): defs[name].append(p)
        cat.stdin.close(); cat.wait()
        res = []
        for name, where in defs.items():
            if len(where) != 1: continue
            call = re.compile(r'(?<![\w$])' + re.escape(name) + r'\s*\(')
            hits = collections.Counter()
            by = collections.defaultdict(list)
            for p, t in texts.items():
                k = len(call.findall(t)) - (1 if p == where[0] else 0)
                if k > 0: hits[kind(p)] += k; by[kind(p)].append(p)
            if hits['gap'] and (hits['src'] or hits['test']) and 3 <= sum(len(v) for v in by.values()) + 1 <= 25:
                res.append({'name': name, 'def': where[0], 'calls': dict(hits), 'gap_files': by['gap'][:8],
                            'n_files': sum(len(v) for v in by.values()) + 1})
        res.sort([REDACTED:env-secret] r: (-r['calls'].get('gap', 0), r['n_files']))
        json.dump({'repo': repo, 'tip': tip, 'date': git('log', '-1', '--format=%cs', tip).strip(), 'targets': res}, open(out, 'w'), indent=1)
        print(f"{os.path.basename(repo):26} tip {tip[:9]} {len(files):5} files  {len(res):3} targets")
        EOF
