        tasks=json.load(open(H+'/s55-bugfix30-manifest.json'))
        NUM=re.compile(r'^\s*(\d+[\t:→|-]|L\d+[:\s])\s?')
        norm=lambda l: NUM.sub('',l).strip()
        for arm,run in [('native','e2e'),('prism_body_exp','e2e-codexfix-27')]:
            tot=collections.Counter(); dup=collections.Counter(); sessions=0
            for t in tasks:
                f=f'{H}/{run}/{t}.claude-sonnet-5-5.{arm}.json'
                if not os.path.exists(f): continue
                p=idx.get(json.load(open(f)).get('session_id'))
