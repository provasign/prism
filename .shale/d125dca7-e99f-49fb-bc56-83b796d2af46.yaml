          'gson','jib','dubbo','commons-lang'}
        FMT = re.compile(r'\b(black|prettier|reformat|format(ting)?|lint|ruff|isort|pyupgrade|flake8|eslint|biome|typo|spelling|license|copyright)\b', re.I)
        CHANGELOG = re.compile(r'(^|/)(CHANGE(S|LOG)|HISTORY|NEWS|AUTHORS)|(^|/)releases?/|/release[-_]?notes', re.I)
        def git(repo, *a): return subprocess.run(['git', '-C', path(repo), *a], capture_output=True, text=True, errors='replace').stdout
        norm = lambda l: re.sub(r'[\s\'"`,;]+', '', l[1:])
        R = json.load(open('census_all.json'))
        out = []
        for repo, v in R.items():
            by = collections.defaultdict(list)
            for c in v['candidates']: by[c['sha']].append(c)
            for sha, cs in by.items():
                subj = git(repo, 'log', '-1', '--format=%s', sha).strip()
                if FMT.search(subj): continue
                hits = []
                for c in cs:
                    call = re.compile(r'\b' + re.escape(c['name']) + r'\s*\(')
                    for f in c['gap_files']:
                        if CHANGELOG.search(f) or not f.endswith(CODE + DOC) and '.' in f.split('/')[-1]: continue
                        d = git(repo, 'show', '--unified=0', '--format=', sha, '--', f).splitlines()
                        rem = {norm(l) for l in d if l.startswith('-') and not l.startswith('---') and call.search(l)}
                        add = {norm(l) for l in d if l.startswith('+') and not l.startswith('+++') and call.search(l)}
                        if rem and add and rem != add:
                            hits.append((c['name'], f, 'code' if f.endswith(CODE) else 'doc'))
                if not hits: continue
                date = git(repo, 'log', '-1', '--format=%cs', sha).strip()
                stat = git(repo, 'show', '--shortstat', '--format=', sha).strip()
                nfiles = int(stat.split()[0]) if stat else 0
                out.append({'repo': repo, 'sha': sha, 'date': date, 'subject': subj, 'nfiles': nfiles, 'stat': stat,
                            'scorable': repo in SCORABLE, 'code_gap': any(h[2] == 'code' for h in hits), 'hits': hits})
        json.dump(out, open('vetted2.json', 'w'), indent=1)
        print(len(out), 'commits;', sum(o['code_gap'] for o in out), 'with a code-file gap site;',
              sum(o['scorable'] for o in out), 'in scorable repos;',
              sum(o['scorable'] and o['date'] >= '2021' for o in out), 'scorable and 2021+')
        print(collections.Counter(o['repo'] for o in out if o['scorable'] and o['date'] >= '2021').most_common())
        EOF
