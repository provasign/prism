        #!/usr/bin/env python3
        """guard.py <max_tree_mb> <min_free_pct> -- cmd...: run cmd, kill its process tree
        if tree RSS exceeds max_tree_mb or system free memory drops below min_free_pct."""
        import subprocess, sys, time, os, signal, re
        mx, minfree = int(sys.argv[1]), int(sys.argv[2]); cmd = sys.argv[sys.argv.index('--')+1:]
        p = subprocess.Popen(cmd, start_new_session=True)
        peak = 0
        def tree_rss():
            out = subprocess.run(['ps', '-axo', 'pid=,ppid=,rss='], capture_output=True, text=True).stdout.split('\n')
            kids, rss = {}, {}
            for l in out:
                f = l.split()
                if len(f) == 3: kids.setdefault(int(f[1]), []).append(int(f[0])); rss[int(f[0])] = int(f[2])
            tot, st = 0, [p.pid]
            while st:
                q = st.pop(); tot += rss.get(q, 0); st += kids.get(q, [])
            return tot // 1024
        def free_pct():
            m = re.search(r'(\d+)%', subprocess.run(['memory_pressure'], capture_output=True, text=True).stdout.splitlines()[-1])
            return int(m.group(1)) if m else 100
        n = 0
        while p.poll() is None:
            t = tree_rss(); peak = max(peak, t)
            fp = free_pct() if n % 5 == 0 else 100
            if t > mx or fp < minfree:
                os.killpg(p.pid, signal.SIGKILL)
                print(f'GUARD KILL: tree {t} MB, free {fp}%', file=sys.stderr); sys.exit(137)
            n += 1; time.sleep(1)
        print(f'guard: exit {p.returncode}, peak tree rss {peak} MB', file=sys.stderr)
        sys.exit(p.returncode)
        EOF
