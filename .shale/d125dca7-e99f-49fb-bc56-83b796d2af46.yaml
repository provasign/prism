        extract(python): decorators are call sites of the decorated symbol

        A decorator runs when its definition is evaluated, so `@click.argument("x")`
        calls click.argument and a bare `@click.pass_context` calls pass_context with
        the decorated object. Python decorators were kept only as annotation names,
        so decorator-driven APIs had no call edges: click's `argument` showed 2
        callers against 143 `@click.argument(` uses, `version_option` 0.

        Decorator calls (and calls inside their arguments) are now prepended to the
        decorated function's or class's CallSites; a bare decorator becomes a call
        with Argc 1. Measured with prism v0.86.0 + this change: click argument 2 ->
        107 callers, version_option 0 -> 7; flask setupmethod 69 -> 95 (the methods it
        decorates). Decorators on instances in un-annotated module variables
