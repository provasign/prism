        """For each tool result: share of its non-trivial lines already present in context from earlier tool results
        (normalized: stripped, line-number prefixes removed, len>=12). Tokens ~ chars/4."""
        import json, glob, os, re, collections
        H='/Users/tapabratapal/Projects/provasign/research/harness/results'
        P=os.path.expanduser('~/.claude/projects')
