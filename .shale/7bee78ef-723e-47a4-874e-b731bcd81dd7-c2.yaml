        import json
        rows = json.load(open('harness/results/guard-fix-run/results.json'))

        # correlation: prism_calls count vs token ratio
        import statistics
        pts = []
        for r in rows:
            n_tok, p_tok = r['native']['tokens'], r['prism']['tokens']
            calls = r['prism'].get('prism_calls', 0)
            if n_tok and p_tok:
                pts.append((calls, p_tok/n_tok))

        # bucket by call count
        from collections import defaultdict
        buckets = defaultdict(list)
        for calls, ratio in pts:
            bucket = '0' if calls==0 else '1-2' if calls<=2 else '3-5' if calls<=5 else '6+'
            buckets[bucket].append(ratio)
        for b in ['0','1-2','3-5','6+']:
            if b in buckets:
                print(f'{b:5} calls: n={len(buckets[b]):3} mean_ratio={statistics.mean(buckets[b]):.2f}x median={statistics.median(buckets[b]):.2f}x')
        "
