    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness && python3 - <<'EOF'
        import json, glob
        import read_after_locate as R
        # Ceiling question: in the NATIVE baseline arm, what share of cumulative context
        # exposure comes from actions prism could replace at all (search/grep results +
        # file reads)? If that share is < 30%, a 30% total-cost cut via retrieval is
        # unreachable by construction.
        def walk(tp):
            uses={}; events=[]; t=0
            for line in open(tp,errors='ignore'):
                try: j=json.loads(line)
                except: continue
                if j.get('type')=='assistant':
                    for c in (j.get('message') or {}).get('content') or []:
                        if isinstance(c,dict) and c.get('type')=='tool_use': t+=1; uses[c['id']]=c
                        if isinstance(c,dict) and c.get('type')=='text': events.append((t,'assistant',len(c.get('text',''))))
                elif j.get('type')=='user':
                    for c in (j.get('message') or {}).get('content') or []:
                        if isinstance(c,dict) and c.get('type')=='tool_result':
                            u=uses.get(c.get('tool_use_id')); name=u['name'] if u else '?'
                            cmd=(u or {}).get('input',{}).get('command','') if name=='Bash' else ''
                            kind = 'locate' if (name in ('Grep','Glob') or name.startswith('mcp__prism__prism_search') or (name=='Bash' and any(k in cmd for k in ('grep','rg ','find ')))) \
                                else 'read' if name in ('Read',) or name=='mcp__prism__prism_read' or (name=='Bash' and any(k in cmd for k in ('cat ','sed -n','head ','tail '))) \
                                else 'prism' if name.startswith('mcp__prism') else 'edit' if name in ('Edit','Write') else 'bash-other' if name=='Bash' else 'other'
                            events.append((t,kind,len(R._result_text(c))))
            T=max(t,1)
            exposure={}
            for turn,kind,n in events:
                exposure[kind]=exposure.get(kind,0)+n*max(T-turn,1)
            return exposure, T
        rows=[]
        for p in sorted(glob.glob('runs/wide/*.baseline.v070sample.json')):
            cell=json.load(open(p)); tp=R._fingerprint_match(cell['tool_trace'])
            if not tp: print(cell['task'],'no transcript'); continue
            ex,T=walk(tp); tot=sum(ex.values()) or 1
            rep=(ex.get('locate',0)+ex.get('read',0))/tot
            rows.append(rep)
            print(f"{cell['task']:20} turns={T:3} replaceable(locate+read)={rep:5.1%}  locate={ex.get('locate',0)/tot:5.1%} read={ex.get('read',0)/tot:5.1%} bash-other={ex.get('bash-other',0)/tot:5.1%} assistant={ex.get('assistant',0)/tot:5.1%} edit={ex.get('edit',0)/tot:5.1%}")
        print(f"\nMEAN replaceable share of cumulative context exposure (baseline arm): {sum(rows)/len(rows):.1%}  (n={len(rows)})")
        EOF
