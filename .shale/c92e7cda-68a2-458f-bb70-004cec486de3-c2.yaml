    - cmd: |-
        cd ~/Projects/provasign/grove && git commit -m "$(cat <<'EOF'
        fix: multi-hop receiver chains — generic-constraint extends, Java chains, out-of-scope member binding

        Three residual ceiling misses shared one mechanism: receiver chains longer
        than one hop dying before the type was reached.

        1. Generic-constraint extends hid the real base class. In
           `class TreeRepo<Entity extends ObjectLiteral> extends Repo<Entity>` the
           CONSTRAINT's "extends" won the plain Index search, so base-class parsing
           returned nothing, the subclass inherited no field types, and every chain
           starting from an inherited field died at hop 0 (typeorm
           TreeRepository.findRoots / createDescendantsQueryBuilder →
           this.manager.connection.driver.escape). stripLeadingGenericParams removes
           the class's own type-parameter list (arrow-default `>` handled) before
           locating "extends". Shared by TS/Java/PHP/C#/C-family base parsing.

        2. Chain-resolved types outside import scope had no candidates. Candidate
           resolution is import-scoped, but a multi-hop chain routinely ends on a
           type the caller never imports (TreeRepository.ts never imports Driver).
           narrowByChainType now binds to the resolved type's own declared member
           from the full index (tsTypeOwnMember, preferring the file the chain
           resolves the type to) — the chain hops themselves are the evidence.

        3. Java had no chain path at all. jackson's WritableObjectId.writeAsId/
           writeAsField call w.serializer.serialize(...) — a field-of-parameter
           chain. Chain recovery and narrowByChainType now include Java, with
           javaClassFieldTypes (javaFieldRe over the class source, file-scoped like
           tsClassFieldTypes) as the per-hop parser.

        Ceiling deltas (harness/ci_invariants.py, all other corpora unchanged,
        full suite green):
          typeorm-driver-escape   recall 0.946 → 1.000, precision 0.745 → 0.974
          jackson-serialize       recall 0.981 → 1.000
        The typeorm precision jump is the same mechanism from the other side:
        chain resolution now DECIDES, so the blanket dispatch fan-out that
        produced 12 false callers stays out.

        Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
        EOF
        )" && git log --oneline -1
