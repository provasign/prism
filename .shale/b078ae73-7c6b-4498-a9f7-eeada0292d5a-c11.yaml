        package mcp

        import (
        	"context"
        	"os"
        	"path/filepath"
        	"strings"
        	"testing"

        	"github.com/provasign/prism/internal/grove"
        )

        func writeTextCheckRepo(t *testing.T, files map[string]string) string {
        	t.Helper()
        	root := t.TempDir()
        	for rel, body := range files {
        		p := filepath.Join(root, rel)
        		if err := os.MkdirAll(filepath.Dir(p), 0o755); err != nil {
        			t.Fatal(err)
        		}
        		if err := os.WriteFile(p, []byte(body), 0o644); err != nil {
        			t.Fatal(err)
        		}
        	}
        	return root
        }

        func textCheckResult() *grove.ChangeImpactResult {
        	sym := func(file, name string, start, end int) grove.SymbolRecord {
        		return grove.SymbolRecord{FilePath: file, Name: name, Language: "python", Span: grove.LineRange{Start: start, End: end}}
        	}
        	return &grove.ChangeImpactResult{
        		Completeness: "closed",
        		Declarations: []grove.SymbolRecord{sym("pkg/core.py", "get_command", 1, 2)},
        		Callers:      []grove.SymbolRecord{sym("pkg/core.py", "resolve", 4, 5)},
        	}
        }

        // Every code mention inside a listed site: the answer says so and claims
        // completeness for the repository instead of telling the agent to grep.
        func TestTextCrossCheckClean(t *testing.T) {
        	root := writeTextCheckRepo(t, map[string]string{
        		"pkg/core.py": "def get_command(self):\n    pass\n\ndef resolve(self):\n    return self.get_command()\n",
        		"docs/x.md":   "Call `get_command` to look one up.\n",
        	})
        	h := &Handler{Root: root}
        	out := map[string]any{"familyCompleteness": "closed", "coverageNote": dynamicCallerNote}
        	addIndexedCompletenessSafety(out)
        	h.applyTextCrossCheck(context.Background(), out, textCheckResult(), "get_command")
        	tc, _ := out["textCheck"].(string)
        	if !strings.Contains(tc, "all 2 line(s)") || !strings.Contains(tc, "docs/x.md") {
        		t.Fatalf("textCheck = %q", tc)
        	}
        	if safe, _ := out["safeToClaimComplete"].(bool); !safe || out["completeness"] != "closed" {
        		t.Fatalf("clean check should claim repository completeness: %v", out)
        	}
        	if out["coverageNote"] == dynamicCallerNote {
        		t.Fatalf("the advice to run a text search should be replaced")
        	}
        }

        // A mention outside every listed site is shown, and nothing is claimed.
        func TestTextCrossCheckListsOutside(t *testing.T) {
        	root := writeTextCheckRepo(t, map[string]string{
        		"pkg/core.py":  "def get_command(self):\n    pass\n\ndef resolve(self):\n    return self.get_command()\n",
        		"pkg/other.py": "handler = getattr(obj, 'get_command')\n",
        	})
        	h := &Handler{Root: root}
        	out := map[string]any{"familyCompleteness": "closed", "coverageNote": dynamicCallerNote}
        	addIndexedCompletenessSafety(out)
        	h.applyTextCrossCheck(context.Background(), out, textCheckResult(), "get_command")
        	tc, _ := out["textCheck"].(string)
        	if !strings.Contains(tc, "1 of 3 line(s)") || !strings.Contains(tc, "pkg/other.py:1:") {
        		t.Fatalf("textCheck = %q", tc)
        	}
        	if safe, _ := out["safeToClaimComplete"].(bool); safe {
        		t.Fatalf("a mention outside the sites must not claim completeness")
        	}
        }
        EOF
