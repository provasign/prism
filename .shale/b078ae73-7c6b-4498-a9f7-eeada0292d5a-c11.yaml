        package mcp

        import (
        	"context"
        	"fmt"
        	"os"
        	"path/filepath"
        	"regexp"
        	"sort"
        	"strings"
        	"sync"
        	"time"

        	"github.com/provasign/prism/internal/grove"
        	"github.com/provasign/prism/internal/textsearch"
        )

        // Why agents grep after a complete change_impact answer (wide bed, 32
        // cells, 2026-10-18): not the hedges — the three Java answers that listed
        // zero test sites ("every caller is listed", no hedge at all) each sent the
        // agent to "search tests, it might only cover src/main"; the one Go answer
        // that listed callers tagged [test] went straight to the edit. The agent
        // also hunts javadoc `{@link #name}` lines, which the graph excludes and a
        // rename must still touch. A grep shows an empty category by construction;
        // a graph answer shows a list and a word. This block states, with counts,
        // what was scanned and what came back empty for exactly those categories.

        const (
        	coverageCommentLinesShown = 12
        	coverageMaxFilesRead      = 60
        )

        var docFileExts = map[string]bool{".md": true, ".mdx": true, ".rst": true, ".txt": true, ".adoc": true, ".html": true}

        // testFileCache remembers the index's test-file count per root and symbol
        // count: the snapshot walk is the only cost, and the answer must not pay it
        // on every call.
        var testFileCache sync.Map

        type testFileKey struct {
        	root  string
        	count int
        }

        // indexedTestFileCount is how many test files the index holds symbols for.
        func (h *Handler) indexedTestFileCount(ctx context.Context) (int, bool) {
        	if h.Grove == nil {
        		return 0, false
        	}
        	st, err := h.Grove.QuickStatus(ctx)
        	if err != nil {
        		return 0, false
        	}
        	key := testFileKey{h.Root, st.SymbolCount}
        	if v, ok := testFileCache.Load(key); ok {
        		return v.(int), true
        	}
        	files, err := h.Grove.IndexedFilePaths(ctx)
        	if err != nil {
        		return 0, false
        	}
        	n := 0
        	for _, f := range files {
        		if isTestFilePath(f) {
        			n++
        		}
        	}
        	testFileCache.Store(key, n)
        	return n, true
        }

        func anonymousClassLanguage(lang string) bool {
        	switch strings.ToLower(lang) {
        	case "java", "kotlin", "scala", "csharp":
        		return true
        	}
        	return false
        }

        // impactCoverage builds the coverage lines for a change_impact answer.
        func (h *Handler) impactCoverage(ctx context.Context, r *grove.ChangeImpactResult, leaf string) []string {
        	if r == nil || leaf == "" {
        		return nil
        	}
        	var lines []string
        	lang := ""
        	testSites, anonSites := 0, 0
        	for _, group := range [][]grove.SymbolRecord{r.Declarations, r.Supers, r.Family, r.Callers, r.DeclaringTypes} {
        		for _, s := range group {
        			if lang == "" && s.Language != "" {
        				lang = s.Language
        			}
        			if isTestFilePath(s.FilePath) {
        				testSites++
        			}
        			if strings.Contains(s.QualifiedName, "<anonymous") {
        				anonSites++
        			}
        		}
        	}
        	if n, ok := h.indexedTestFileCount(ctx); ok {
        		switch {
        		case n == 0:
        			lines = append(lines, "tests: no test files in the index")
        		case testSites > 0:
        			lines = append(lines, fmt.Sprintf("tests: %d test file(s) indexed; %d of the sites above are in tests", n, testSites))
        		default:
        			lines = append(lines, fmt.Sprintf("tests: %d test file(s) indexed; none declares, overrides or calls %s", n, leaf))
        		}
        	}
        	if anonymousClassLanguage(lang) {
        		if anonSites > 0 {
        			lines = append(lines, fmt.Sprintf("anonymous classes: indexed; %d of the sites above are in one", anonSites))
        		} else {
        			lines = append(lines, fmt.Sprintf("anonymous classes: indexed; none overrides or calls %s (not indexed: anonymous classes inside static field initializers)", leaf))
        		}
        	}
        	lines = append(lines, h.commentMentionLines(ctx, leaf)...)
        	return lines
        }

        // commentMentionLines lists the comment, docstring and documentation lines
        // naming leaf as a whole word: the `{@link #name}` javadoc, the `// Name
        // returns` Go doc comment, the .md example. They are no site in the graph,
        // and a rename decides per task whether to touch them.
        func (h *Handler) commentMentionLines(ctx context.Context, leaf string) []string {
        	if h.Root == "" {
        		return nil
        	}
        	res := textsearch.Search(ctx, h.Root, leaf, textsearch.Options{
        		CaseSensitive: true, MaxHits: 3000, MaxPerFile: 200, Timeout: 4 * time.Second,
        	})
        	if res.TimedOut || res.Truncated {
        		return []string{fmt.Sprintf("comments/docs naming %s: not checked (text search hit its limit)", leaf)}
        	}
        	word := regexp.MustCompile(`(^|[^\pL\pN_$])` + regexp.QuoteMeta(leaf) + `($|[^\pL\pN_$])`)
        	blocks := map[string]map[int]bool{} // file -> lines inside a block comment / docstring
        	filesRead := 0
        	var comments []string
        	perFile := map[string]int{}
        	strings_ := 0
        	for _, hit := range res.Hits {
        		if !word.MatchString(hit.Text) {
        			continue
        		}
        		file := filepath.ToSlash(hit.File)
        		ext := strings.ToLower(filepath.Ext(file))
        		kind := ""
        		switch {
        		case docFileExts[ext]:
        			kind = "comment"
        		case isCommentLineExt(hit.Text, ext):
        			kind = "comment"
        		default:
        			if _, ok := blocks[file]; !ok && filesRead < coverageMaxFilesRead {
        				filesRead++
        				blocks[file] = blockCommentLines(filepath.Join(h.Root, file), ext)
        			}
        			if blocks[file] != nil && blocks[file][hit.Line] {
        				kind = "comment"
        			} else {
        				kind = mentionKind(hit.Text, leaf, ext)
        			}
        		}
        		switch kind {
        		case "comment":
        			perFile[file]++
        			text := strings.TrimSpace(hit.Text)
        			if len(text) > 100 {
        				text = text[:100] + "…"
        			}
        			comments = append(comments, fmt.Sprintf("%s:%d: %s", file, hit.Line, text))
        		case "string":
        			strings_++
        		}
        	}
        	if len(comments) == 0 {
        		line := fmt.Sprintf("comments/docs naming %s: none", leaf)
        		if strings_ > 0 {
        			line += fmt.Sprintf("; %d string literal(s) name it", strings_)
        		}
        		return []string{line}
        	}
        	sort.Strings(comments)
        	head := fmt.Sprintf("comments/docs naming %s (not sites; the task decides whether a rename touches them): %d line(s) in %d file(s)", leaf, len(comments), len(perFile))
        	if len(comments) <= coverageCommentLinesShown {
        		out := []string{head + ":"}
        		for _, c := range comments {
        			out = append(out, "  "+c)
        		}
        		if strings_ > 0 {
        			out = append(out, fmt.Sprintf("  (and %d string literal(s) name it)", strings_))
        		}
        		return out
        	}
        	files := make([]string, 0, len(perFile))
        	for f := range perFile {
        		files = append(files, f)
        	}
        	sort.Strings(files)
        	parts := make([]string, 0, len(files))
        	for i, f := range files {
        		if i == 10 {
        			parts = append(parts, fmt.Sprintf("and %d more file(s)", len(files)-10))
        			break
        		}
        		parts = append(parts, fmt.Sprintf("%s (%d)", f, perFile[f]))
        	}
        	out := []string{head + ": " + strings.Join(parts, ", ")}
        	if strings_ > 0 {
        		out = append(out, fmt.Sprintf("  (and %d string literal(s) name it)", strings_))
        	}
        	return out
        }

        // isCommentLineExt: a line that is a comment by its first characters.
        func isCommentLineExt(line, ext string) bool {
        	t := strings.TrimSpace(line)
        	switch {
        	case strings.HasPrefix(t, "#"):
        		return ext == ".py" || ext == ".pyi" || ext == ".rb" || ext == ".sh" || ext == ".php" || ext == ".yaml" || ext == ".yml" || ext == ".toml"
        	case strings.HasPrefix(t, "//"), strings.HasPrefix(t, "/*"), t == "*", strings.HasPrefix(t, "* "), strings.HasPrefix(t, "*/"), strings.HasPrefix(t, "///"), strings.HasPrefix(t, "--"):
        		return true
        	}
        	return false
        }

        // mentionKind classifies a mention on a code line that is not comment-shaped:
        // after a trailing comment marker it is a comment, inside quotes a string,
        // else code.
        func mentionKind(line, leaf, ext string) string {
        	i := strings.Index(line, leaf)
        	if i < 0 {
        		return "code"
        	}
        	prefix := line[:i]
        	quotes := strings.Count(prefix, `"`) + strings.Count(prefix, "'") + strings.Count(prefix, "`")
        	inString := quotes%2 == 1
        	hash := ext == ".py" || ext == ".pyi" || ext == ".rb" || ext == ".sh" || ext == ".php"
        	if !inString {
        		if strings.Contains(prefix, "//") || (hash && strings.Contains(prefix, "#")) {
        			return "comment"
        		}
        		return "code"
        	}
        	return "string"
        }

        // blockCommentLines marks the lines of a file that lie inside a block comment
        // (/* … */) or, for Python, a triple-quoted string (a docstring). Only the
        // lines strictly inside count; the opening line is classified on its own.
        func blockCommentLines(path, ext string) map[int]bool {
        	data, err := os.ReadFile(path)
        	if err != nil || len(data) > 2<<20 {
        		return nil
        	}
        	out := map[int]bool{}
        	lines := strings.Split(string(data), "\n")
        	if ext == ".py" || ext == ".pyi" {
        		open := ""
        		for i, l := range lines {
        			if open != "" {
        				out[i+1] = true
        				if strings.Contains(l, open) {
        					open = ""
        				}
        				continue
        			}
        			for _, q := range []string{`"""`, `'''`} {
        				if n := strings.Count(l, q); n%2 == 1 {
        					open = q
        					out[i+1] = true
        					break
        				}
        			}
        		}
        		return out
        	}
        	in := false
        	for i, l := range lines {
        		if in {
        			out[i+1] = true
        			if strings.Contains(l, "*/") {
        				in = false
        			}
        			continue
        		}
        		if j := strings.Index(l, "/*"); j >= 0 && !strings.Contains(l[j:], "*/") {
        			in = true
        			out[i+1] = true
        		}
        	}
        	return out
        }
