        				defs = append(defs, def{o.EnclosingRange[0], e, o.Symbol})
        			}
        		}
        		for _, o := range d.Occurrences {
        			if o.SymbolRoles&1 == 0 && strings.HasSuffix(o.Symbol, "assert_err().") {
        				sites++
        				best := def{-1, 1 << 30, "?"}
        				for _, df := range defs {
        					if df.s <= o.Range[0] && o.Range[0] <= df.e && df.e-df.s < best.e-best.s {
        						best = df
        					}
        				}
        				callers[d.RelativePath+" "+best.sym] = true
        			}
        		}
        	}
        	fmt.Println("sites", sites, "distinct callers", len(callers))
        }
        EOF
