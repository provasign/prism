        """Compare compiler definitions (TSV from scipdefs) with grove.db symbols.
        A def is covered when grove has a symbol in the same file with the same
        name whose span contains the definition line."""
        import collections, sqlite3, sys
        defs_path, db_path = sys.argv[1], sys.argv[2]
        db = sqlite3.connect(db_path)
        by = collections.defaultdict(list)
        for f, n, s, e, k in db.execute("select file_path,name,span_start,span_end,kind from symbols"):
            by[(f, n)].append((s, e, k))
        tot, miss = collections.Counter(), collections.Counter()
        examples = collections.defaultdict(list)
        seen = set()
        for line in open(defs_path):
            f, ln, name, kind, parent, suffix = line.rstrip("\n").split("\t")
            key = (f, ln, name, kind)
            if key in seen:
                continue
            seen.add(key)
            ln = int(ln)
            tot[kind] += 1
            if not any(s <= ln <= e for s, e, _ in by.get((f, name), [])):
                miss[kind] += 1
                if len(examples[kind]) < 6:
                    examples[kind].append(f"{f}:{ln} {parent}.{name}")
        print(f"{'kind':16} {'compiler':>8} {'missing':>8}")
        for k, n in tot.most_common():
            print(f"{k:16} {n:8} {miss[k]:8}")
        print(f"{'TOTAL':16} {sum(tot.values()):8} {sum(miss.values()):8}")
        for k, ex in examples.items():
            print(f"\n-- {k}:"); [print("  ", x) for x in ex]
        EOF
