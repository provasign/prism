        // scipdefs prints every non-local definition in a SCIP index as TSV:
        // file, 1-based line, name, kind, parent descriptor name.
        package main

        import (
        	"fmt"
        	"os"

        	"github.com/scip-code/scip/bindings/go/scip"
        	"google.golang.org/protobuf/proto"
        )

        func main() {
        	raw, err := os.ReadFile(os.Args[1])
        	if err != nil {
        		panic(err)
        	}
        	var idx scip.Index
        	if err := proto.Unmarshal(raw, &idx); err != nil {
        		panic(err)
        	}
        	kinds := map[string]scip.SymbolInformation_Kind{}
        	for _, d := range idx.Documents {
        		for _, si := range d.Symbols {
        			kinds[si.Symbol] = si.Kind
        		}
        	}
        	for _, d := range idx.Documents {
        		for _, o := range d.Occurrences {
        			if o.SymbolRoles&int32(scip.SymbolRole_Definition) == 0 || scip.IsLocalSymbol(o.Symbol) {
        				continue
        			}
        			sym, err := scip.ParseSymbol(o.Symbol)
        			if err != nil || len(sym.Descriptors) == 0 {
        				continue
        			}
        			ds := sym.Descriptors
        			name := ds[len(ds)-1].Name
        			parent := ""
        			if len(ds) > 1 {
        				parent = ds[len(ds)-2].Name
        			}
        			last := ds[len(ds)-1].Suffix
        			fmt.Printf("%s\t%d\t%s\t%s\t%s\t%s\n", d.RelativePath, o.Range[0]+1, name, kinds[o.Symbol], parent, last)
        		}
        	}
        }
        EOF
        cat > go.mod <<'EOF'
