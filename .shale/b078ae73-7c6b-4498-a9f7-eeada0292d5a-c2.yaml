        string Rel(string p) => Path.GetRelativePath(root, p).Replace('\\', '/');
        var trees = Directory.EnumerateFiles(root, "*.cs", SearchOption.AllDirectories)
            .Where(p => { var r = Rel(p); return !(r.Contains("/obj/") || r.Contains("/bin/") || r.StartsWith("obj/") || r.StartsWith("bin/")); })
            .OrderBy(p => p, StringComparer.Ordinal)
            .Select(p => CSharpSyntaxTree.ParseText(File.ReadAllText(p), new CSharpParseOptions(LanguageVersion.Latest), path: p))
            .ToList();
        var refs = ((string)AppContext.GetData("TRUSTED_PLATFORM_ASSEMBLIES")).Split(Path.PathSeparator)
            .Where(p => p.EndsWith(".dll")).Select(p => (MetadataReference)MetadataReference.CreateFromFile(p)).ToList();
        var comp = CSharpCompilation.Create("csdecls", trees, refs, new CSharpCompilationOptions(OutputKind.DynamicallyLinkedLibrary, allowUnsafe: true));
        var seen = new HashSet<string>();
        foreach (var tree in trees)
        {
            var model = comp.GetSemanticModel(tree);
            foreach (var node in tree.GetRoot().DescendantNodes())
            {
                ISymbol sym;
                try { sym = model.GetDeclaredSymbol(node); } catch { continue; }
                if (sym == null) continue;
                if (sym is IParameterSymbol || sym is ILocalSymbol || sym is ITypeParameterSymbol || sym is INamespaceSymbol || sym is IRangeVariableSymbol || sym is ILabelSymbol) continue;
                if (sym is IMethodSymbol m && m.MethodKind == MethodKind.AnonymousFunction) continue;
                int line = node.GetLocation().GetLineSpan().StartLinePosition.Line + 1;
                string kind = sym is IMethodSymbol mm ? mm.MethodKind.ToString() : sym is INamedTypeSymbol nt ? nt.TypeKind.ToString() : sym.Kind.ToString();
                string name = sym.Name;
                if (sym is IMethodSymbol { MethodKind: MethodKind.Constructor or MethodKind.StaticConstructor }) name = sym.ContainingType.Name;
                string key = $"{Rel(tree.FilePath)}\t{line}\t{name}\t{kind}";
                if (!seen.Add(key)) continue;
                Console.WriteLine($"{key}\t{sym.ContainingSymbol?.Name}\t");
            }
        }
        EOF
