        C=collections.Counter(); n=0; reread=collections.Counter()
        def classify(line, in_body):
            if in_body: return 'delivered body (source block)'
            if re.match(r'^\s*//',line): return 'notes/headers (// lines)'
            if re.match(r'^\s+\d+- ',line): return 'context lines (N-)'
            if re.match(r'^\s+\d+: ',line) or re.match(r'^\S+:\d+: ',line): return 'match lines'
            if re.match(r'^\s*(method|function|class|interface|field|variable|constructor|type|struct|enum)\s',line.strip()) or 'symbols (' in line: return 'symbol list'
            if re.match(r'^\s*--\s*$',line): return 'context lines (N-)'
            if re.match(r'^\S.*:$',line) or re.match(r'^\*\*`',line): return 'file headers'
            if re.match(r'^── ',line): return 'notes/headers (// lines)'
            return 'other'
        for sid in sids:
            ev=events(sid)
            for idx,(nm,i,res) in enumerate(ev):
                if nm!='mcp__prism__prism' or i.get('op')!='search': continue
                n+=1; in_body=False
