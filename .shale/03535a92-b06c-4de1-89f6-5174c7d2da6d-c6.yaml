        tot=sum(C.values())
        print(f'{n} search answers, {tot/n/1000:.1f}k chars avg')
        for k,v in C.most_common(): print(f'   {k:32} {100*v/tot:4.0f}%  {v/n/1000:4.1f}k/answer')
        print(dict(reread))
