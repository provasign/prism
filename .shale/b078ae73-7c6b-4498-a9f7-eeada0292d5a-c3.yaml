        func dump(root string) string {
        	q := func(sql string) string {
        		out, err := exec.Command("sqlite3", filepath.Join(root, ".grove", "grove.db"), sql).Output()
        		if err != nil {
        			return "ERR " + err.Error()
        		}
        		return fmt.Sprintf("%x", md5.Sum(out))
        	}
        	return q("select from_node||' '||edge_type||' '||to_node||' '||source from edges order by 1") + "/" +
        		q("select id||' '||span_start||' '||span_end from symbols order by 1")
        }

        func ra(native []string) string {
        	var out []string
        	for _, d := range native {
        		if strings.Contains(d, "rust-analyzer") || strings.Contains(d, "rust: incremental") || strings.Contains(d, "rust: full") {
        			out = append(out, d)
        		}
        	}
        	return strings.Join(out, " | ")
        }

        func main() {
        	ctx := context.Background()
        	repo, _ := filepath.Abs(os.Args[1])
        	run := func(name string, args ...string) {
        		cmd := exec.Command(name, args...)
        		cmd.Dir = repo
        		if out, err := cmd.CombinedOutput(); err != nil {
        			fmt.Println(name, err, string(out))
        			os.Exit(1)
        		}
        	}
        	run("git", "checkout", "-q", ".")
        	os.RemoveAll(filepath.Join(repo, ".grove"))
        	eng, err := grove.Open(ctx, grove.Config{RepoRoot: repo})
        	if err != nil {
        		panic(err)
        	}
        	t := time.Now()
        	res, err := eng.Index(ctx, repo)
        	if err != nil {
        		panic(err)
        	}
        	fmt.Printf("cold resident index %.2fs: %s\n", time.Since(t).Seconds(), ra(res.Native))
        	time.Sleep(time.Duration(envInt("WARM_WAIT", 0)) * time.Second)
        	for _, edit := range os.Args[2:] {
        		file, expr, hasExpr := strings.Cut(edit, "|")
        		if hasExpr {
        			run("perl", "-0pi", "-e", expr, file)
        		} else {
        			f, _ := os.OpenFile(filepath.Join(repo, file), os.O_APPEND|os.O_WRONLY, 0)
        			f.WriteString("\n// edit\n")
        			f.Close()
        		}
        		t := time.Now()
        		res, err := eng.Index(ctx, repo)
        		if err != nil {
        			panic(err)
        		}
        		d := time.Since(t).Seconds()
        		inc := dump(repo)
        		cold := filepath.Join(os.TempDir(), "residentcheck-cold")
        		os.RemoveAll(cold)
        		exec.Command("rsync", "-a", "--exclude", ".grove", "--exclude", "target", repo+"/", cold+"/").Run()
        		ce, err := grove.Open(ctx, grove.Config{RepoRoot: cold, OneShot: true})
        		if err != nil {
        			panic(err)
        		}
        		if _, err := ce.Index(ctx, cold); err != nil {
        			panic(err)
        		}
        		ce.Close()
        		same := "SAME"
        		if c := dump(cold); c != inc {
        			same = "DIFF"
        		}
        		fmt.Printf("%s %.2fs %s\n    %s\n", same, d, edit, ra(res.Native))
        	}
        	eng.Close()
        	run("git", "checkout", "-q", ".")
        }

        func envInt(k string, d int) int {
        	var v int
        	if _, err := fmt.Sscan(os.Getenv(k), &v); err == nil {
        		return v
        	}
        	return d
        }
