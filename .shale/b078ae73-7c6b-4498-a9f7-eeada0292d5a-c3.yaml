        """Drive a resident rust-analyzer over LSP: time warm-up, then after an
        edit time call-hierarchy queries for every function in the edited file."""
        import json, os, subprocess, sys, threading, time, queue

        root = os.path.abspath(sys.argv[1]); target = sys.argv[2]
        p = subprocess.Popen(["rust-analyzer"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
        msgs = queue.Queue(); nid = [0]; pending = {}
        def reader():
            f = p.stdout
            while True:
                hdr = b""
                while not hdr.endswith(b"\r\n\r\n"):
                    c = f.read(1)
                    if not c: return
                    hdr += c
                n = int([l for l in hdr.split(b"\r\n") if l.lower().startswith(b"content-length")][0].split(b":")[1])
                m = json.loads(f.read(n))
                if "id" in m and ("result" in m or "error" in m) and m["id"] in pending:
                    pending.pop(m["id"]).put(m)
                elif "id" in m and "method" in m:  # server request: answer null
                    send({"jsonrpc": "2.0", "id": m["id"], "result": None})
                else:
                    msgs.put(m)
        def send(m):
            b = json.dumps(m).encode(); p.stdin.write(b"Content-Length: %d\r\n\r\n" % len(b) + b); p.stdin.flush()
        def req(method, params):
            nid[0] += 1; q = queue.Queue(); pending[nid[0]] = q
            send({"jsonrpc": "2.0", "id": nid[0], "method": method, "params": params}); return q.get(timeout=600)
        def note(method, params): send({"jsonrpc": "2.0", "method": method, "params": params})
        threading.Thread(target=reader, daemon=True).start()
        uri = lambda f: "file://" + os.path.join(root, f)
        t0 = time.time()
        req("initialize", {"processId": os.getpid(), "rootUri": "file://" + root, "capabilities": {"window": {"workDoneProgress": True}, "experimental": {"serverStatusNotification": True}}, "initializationOptions": {"checkOnSave": False, "cachePriming": {"enable": True}}})
        note("initialized", {})
        # wait for quiescent serverStatus
        while True:
            m = msgs.get(timeout=900)
            if m.get("method") == "experimental/serverStatus" and m["params"].get("quiescent"):
                break
        print(f"warm-up (quiescent) {time.time()-t0:.1f}s")
        text = open(os.path.join(root, target)).read()
        note("textDocument/didOpen", {"textDocument": {"uri": uri(target), "languageId": "rust", "version": 1, "text": text}})
        syms = req("textDocument/documentSymbol", {"textDocument": {"uri": uri(target)}})["result"]
        def flat(ss, out):
            for s in ss:
                if s["kind"] in (6, 12): out.append(s)
                flat(s.get("children", []), out)
            return out
        fns = flat(syms, [])
        def outgoing_all():
            t = time.time(); n = 0
            for s in fns:
                pos = s["selectionRange"]["start"]
                items = req("textDocument/prepareCallHierarchy", {"textDocument": {"uri": uri(target)}, "position": pos})["result"] or []
                for it in items:
                    n += len(req("callHierarchy/outgoingCalls", {"item": it})["result"] or [])
            return time.time() - t, n
        d, n = outgoing_all(); print(f"cold queries: {len(fns)} fns, {n} outgoing calls in {d:.2f}s")
        # edit: append a comment and a new call
        note("textDocument/didChange", {"textDocument": {"uri": uri(target), "version": 2}, "contentChanges": [{"text": text + "\n// edit\n"}]})
        d, n = outgoing_all(); print(f"after edit: {len(fns)} fns, {n} outgoing calls in {d:.2f}s")
        pid = p.pid
        rss = subprocess.run(["ps", "-o", "rss=", "-p", str(pid)], capture_output=True, text=True).stdout.strip()
        print(f"rust-analyzer RSS {int(rss)//1024} MB")
        p.kill()
        EOF
