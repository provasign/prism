        		}
        		var next *sitter.Node
        		for i := 0; i < int(n.ChildCount()); i++ {
        			if c := n.Child(i); c != nil && (c.HasError() || c.IsMissing()) {
        				next = c
        				break
        			}
        		}
        		if next == nil {
        			return n
        		}
