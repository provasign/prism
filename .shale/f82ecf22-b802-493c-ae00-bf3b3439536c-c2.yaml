        index: compiler-input changes invalidate the analyzer that reads them

        Build configuration is plaintext (tsconfig.json, pom.xml, Cargo.toml) or
        not indexed at all (go.mod, go.sum), and native scope was the set of
        changed source languages. Editing only tsconfig.json after a completed
        TypeScript pass therefore gave "js-ts: skipped: no changed files in its
        languages", and a go.mod-only edit was a no-op index: the graph kept
        import/type resolution computed under the old configuration (stack audit
        2026-10-20, finding 2).

        The walk now records compiler inputs per analyzer
        (native.CompilerInputAnalyzers): go.mod/go.sum/go.work(.sum);
        tsconfig*.json, jsconfig*.json, package.json; the Maven/Gradle files the
        javac classpath cache already keys on; Cargo.toml/Cargo.lock;
        compile_commands.json; *.csproj/Directory.Build.props; composer.json;
        pyproject.toml/setup.cfg/requirements.txt (availability inputs). They are
        fingerprinted even when gitignored (a generated compile_commands.json
        usually is). Content hashes are stored in meta (native-inputs) and reused
        while size+mtime match, so a touch is not a change. On an added, removed or
        changed input:
        - the analyzer is removed from native-complete, so it gets a full
          run-to-completion pass (on this run and until it completes);
        - the no-op shortcut is skipped for that run;
        - resident worker state is dropped for that analyzer only (TypeScript
          worker programs, javac worker, rust-analyzer server);
        - result.Native says "<analyzer>: compiler inputs changed (<files>);
          running a full pass".
        The first run that records fingerprints reports no change (a cold index
        runs everything anyway). Inputs under an unreadable subtree keep their
        stored state.

        Tested end to end for TypeScript (tsconfig.json) and Go (go.mod edit
        reruns go; touch-only stays a no-op; settles afterwards). The other
        languages share the same path; their file lists are unit-tested only, as
        no Java/Rust/C#/PHP end-to-end fixture runs the decision here.

        Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
        EOF
