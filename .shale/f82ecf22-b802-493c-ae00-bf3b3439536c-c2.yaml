        index: prune stored symbols of a changed file that can no longer be read

        A file whose stat no longer matched its stored record but whose content
        could not be hashed (over the 10 MiB cap, not a regular file, unreadable)
        stayed in currentFiles, so the prune pass kept the symbols of its last
        readable version. Those facts were served as current with nothing marking
        them stale (stack audit 2026-10-20, finding 1: a removed Target stayed
        indexed after a.go grew past the cap).

        Drop the facts rather than keep them labelled stale: Grove already
        documents this contract for the sibling case (CHANGELOG "Parse failures
        invalidate stale symbols: a changed file that fails to parse now has its
        previously stored symbols pruned instead of serving the last successfully
        parsed version"), and there is no per-file staleness label anywhere in the
        store or query results to carry a "last good" claim. Mid-edit syntax errors
        are unaffected: those files still parse partially and index what parsed.
        The error remains in IndexResult.Errors, and is reported again on every run
        until the file indexes, because the file is no longer stored.

        Unreadable directories keep their existing shield (walkFailed): there the
        files are not seen at all, which says nothing about their content.

        Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
        EOF
