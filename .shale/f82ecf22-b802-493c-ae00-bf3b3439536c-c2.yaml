        // firstSyntaxError returns the first ERROR or MISSING node under n in
        // source order, or n itself when none is found below it.
        func firstSyntaxError(n *sitter.Node) *sitter.Node {
        	for n != nil {
        		if n.IsError() || n.IsMissing() {
