        index: retry analyzers without a completed pass on no-change runs, bounded

        The no-op return ("no file changes since last index") came before the
        logic that gives an analyzer without a completed pass a full run. After a
        failed first pass (compiler unavailable, timeout, no edges), installing
        the missing tool and running a plain index changed nothing until --force,
        while Prism's readiness advice said a plain `prism index` would fix it
        (stack audit 2026-10-20, finding 5).

        native.Result now reports Incomplete: analyzers due a full pass that had
        files and did not complete it, split into "unavailable" (never started)
        and failed. The indexer keeps a retry record per analyzer (meta
        native-retry: failures, next-due time, reason):
        - unavailable: rechecked after 15s, doubling to at most 10 min. A
          no-change index runs only the cheap availability probe when due, and the
          full pass only once the probe reports available;
        - ran and failed: re-run after 1 min, doubling to at most 6 h, since a
          failed compiler pass can cost up to the 30 min completion cap;
        - completed: record cleared;
        - compiler inputs changed (finding 2): due immediately, and durable, so an
          interrupted run is retried by the next index with or without changes.
        The same schedule now also applies to runs where other languages changed:
        an incomplete analyzer whose own languages are unchanged is re-run when
        due, not on every edit. Its languages changing still runs it in full.

        The no-change message is accurate: "skipped: no file changes since last
        index; js-ts has no completed pass (<reason>); next retry in 12s, or use
        --force to retry now", or "... still unavailable (<reason>); rechecked
        now, next check in 30s". A retry is reported as "<analyzer>: retrying its
        incomplete full pass (last attempt: <reason>)". The bare "(use --force to
        re-run analyzers)" form remains for a settled index.

        Analyzers with no recorded attempt (no files of their languages, or an
        index from before this record) are not retried on no-change runs; the
        next run with changes attempts them as before.

        Tests: TypeScript unavailable -> pending -> recheck with a fake clock;
        Go unavailable (go off PATH) -> PATH restored -> a plain no-change index
        after the wait completes the pass and records it -> settles to a no-op.

        Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
        EOF
