                if k.startswith("_"):continue
                c=r["cells"].get(arm+"/nocache")
                if not c or not c.get("transcript"):continue
                n+=1
                for l in open(os.path.join(H,c["transcript"])):
                    x=json.loads(l)
                    if x.get("type")!="assistant":continue
                    for u in x["message"]["content"]:
                        if u.get("type")!="tool_use":continue
                        if u["name"]!="Bash":
                            t["prism" if "prism" in u["name"] else "tool:"+u["name"]]+=1; continue
                        for seg in re.split(r'\n|;|&&|\|\||\|',u["input"].get("command","")):
                            k2=classify(seg.strip())
                            if k2 and k2!="pipe-grep": t[k2]+=1
            return n,t
        if __name__=="__main__":
