        # Classify discovery commands per arm: prism (cli/mcp), repo-wide search (grep -r/rg/find/grep over dirs),
        # in-file grep (grep on named files = a read), cat/sed/head reads.
        import json,os,re,sys,shlex,collections
        H=os.path.expanduser("~/Projects/provasign/research/harness")
        SRC=re.compile(r'\.(go|ts|tsx|js|mjs|cjs|py|java|kt|rs|cs|php|rb|c|h|cc|cpp|hpp|scala|swift|md|json|yaml|yml|toml)$')
        def classify(seg):
            try: w=shlex.split(seg)
            except Exception: w=seg.split()
            if not w: return None
            while w and (w[0] in ("sudo","time") or "=" in w[0] and not w[0].startswith("-")): w=w[1:]
            if not w: return None
            c=w[0]
            if c=="prism" and len(w)>1 and w[1] in ("search","read","lookup","query","change-impact","verify"): return "prism"
            if c in ("rg","ag"):
                files=[a for a in w[1:] if not a.startswith("-")]
                return "infile-grep" if len(files)>=2 and all(SRC.search(f) for f in files[1:]) else "repo-search"
            if c in ("grep","egrep","fgrep"):
                flags=[a for a in w[1:] if a.startswith("-")]
                rec=any(("r" in f or "R" in f) and not f.startswith("--") for f in flags) or "--recursive" in flags
                args=[a for a in w[1:] if not a.startswith("-")]
                # drop option values for -A/-B/-C/-e/-m etc is approximate; files = args after the pattern
                files=args[1:]
                if rec or not files: return "repo-search" if rec else "pipe-grep"
                return "infile-grep" if all(SRC.search(f) or "*" in f for f in files) and not any(os.path.splitext(f)[1]=="" for f in files) else "repo-search"
            if c=="find" or c=="fd": return "find"
            if c in ("cat","head","tail","nl") or (c=="sed" and "-n" in w) or c=="awk": return "read-cmd"
            if c=="git" and len(w)>1 and w[1] in ("grep","log","show"): return "git-"+w[1]
            return None
        def tally(results, arm):
            t=collections.Counter(); n=0
            d=json.load(open(results))
