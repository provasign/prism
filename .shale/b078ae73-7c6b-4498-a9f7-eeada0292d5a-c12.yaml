        `inst._zod.parse(...)` inside a `$constructor<$ZodType>("$ZodType", (inst,
        def) => ...)` callback: inst is typed only through a generic, so the
        receiver chain died at its first hop and change_impact on
        _$ZodTypeInternals.parse found 0 of 61 sites (zod, 2026-10-16).

        Property rule (tspropertytypes.go), applied when a chain's prefix has no
        type: collect every declaration of the property (class/interface fields,
        plus property mentions in interface and type-alias bodies). Each declared
        type must resolve to an indexed class or interface (generic parameter ->
        constraint, else default; plain aliases followed); an untyped, external,
        union or primitive declaration, or any non-field symbol of that name,
        stops the rule. Declared types that cannot have the member (fully indexed
        ancestry without it, or an inline object type not mentioning it) drop
        out; every remaining type must reach the same nearest declaration of the
        member, or nothing is decided. A private/protected target outside its
        class is skipped: such access only type-checks through `any` (socket.io
        adapter `socket.client.writeToEngine`, which cost 2 oracle FPs).

        Non-call references to a method member through a resolved receiver
        (`inst._zod.parse = ...`, `const base = inst._zod.parse`) become
        reads/writes edges with reason member-ref; method change_impact accepts
        them as sites like native refs, and the incremental build carries them
        as call-pass output.

        zod change-impact _$ZodTypeInternals.parse: 1 -> 61 edit sites (5 calls,
        52 writes, 5 reads, plus the declaration). Oracles: all 21 within
        baseline; socket.io/express/p-queue at exactly baseline P/R.

