        					}
        				}
        			}
        			skipBlank()
        		}
        		if b, ok := next(); !ok || b != '{' {
        			continue
        		}
        		sl, sc := l, c
        		depth := 0
        		for {
        			b, ok := next()
        			if !ok {
        				break
        			}
        			if b == '{' {
        				depth++
        			} else if b == '}' {
        				depth--
        				if depth == 0 {
        					out = append(out, ktReceiverScope{typ: typ, startLine: sl + caller.Span.Start, startCol: sc + 1,
        						endLine: l + caller.Span.Start, endCol: c + 1})
