        						Confidence: 0.9, Source: core.EvidenceSourceNative, Lines: key})
        				}
        			}
        		}
        		return true
        	})
        	return out
        }

        func containsString(list []string, s string) bool {
        	for _, x := range list {
        		if x == s {
        			return true
        		}
        	}
        	return false
        }
