        		// non-blank character must open the lambda.
        		l, c := li, cs.Col-1+len(name)
        		next := func() (byte, bool) {
        			for l < len(lines) {
        				if c < len(lines[l]) {
        					return lines[l][c], true
        				}
        				l++
        				c = 0
        			}
        			return 0, false
        		}
        		skipBlank := func() {
        			for {
        				b, ok := next()
        				if !ok || (b != ' ' && b != '\\t' && b != '\\r') {
        					return
        				}
        				c++
        			}
        		}
        		skipBlank()
        		if b, ok := next(); ok && b == '(' {
        			depth := 0
        			for {
        				b, ok := next()
        				if !ok {
        					break
        				}
        				c++
        				if b == '(' {
        					depth++
        				} else if b == ')' {
        					depth--
        					if depth == 0 {
