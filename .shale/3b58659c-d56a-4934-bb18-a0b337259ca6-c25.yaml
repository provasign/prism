        TestToolQuery_ManyExactTiesFallBackToConfirmation failed there while
        passing reliably here. Root cause: neither GitHub-hosted runner image
        ships ripgrep, so both fall back to `grep -r`, whose recursive
        traversal order carries no ordering guarantee -- unlike rg's --sort
        path, which the test's fixture depended on to force specific hits
        inside/outside mergeTextSearch's 40-hit confirmation cap. Locally (rg
        installed) the fixture was deterministic; in CI (grep fallback) it
        was not.

        Fix: extracted the single-term reorder into promoteSingleTermSeeds, a
        pure function over (seeds, confirmed map, term) with no grep/grove
        involved, and rewrote both regression tests (plus two new boundary
        tests) to call it directly with hand-built inputs. Deterministic on
        any machine, OS, or grep/rg availability -- the text-search backend is
        no longer in the loop for what these tests are actually checking.

