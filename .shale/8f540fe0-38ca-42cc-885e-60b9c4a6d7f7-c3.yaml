        Three costs every in-session edit paid regardless of edit size:

        - The post-splice store check re-read and sorted every stored edge
          (1.0s on guava's 776k edges) before Index returned. Resident engines
          now defer it: it runs in the background after Index returns and always
          before the next Index or Close touches the store. A mismatch still
          heals through the full diff; the next result reports it.
        - AllSymbols reloaded every symbol (0.8-1.0s). The post-persist symbol set
          is now the resident baseline for unchanged files plus a store read of
          the changed and pruned files, guarded by per-file blob SHAs and the
          table count; any mismatch falls back to the full load.
        - The native-edge carry re-read every stored compiler edge. It is now
          derived from the resident edges minus the rows deleteFileEdges removed,
          guarded by the stored count.

