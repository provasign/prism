        	files := map[string]string{
        		"src/base/Base.java":  "package base;\n\npublic class Base {\n  public Base() {}\n}\n",
        		"src/util/U.java":     "package util;\n\npublic class U {\n  public static int f() { return 1; }\n}\n",
