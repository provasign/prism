        func symbolStoreLess(a, b *core.SymbolRecord) bool {
        	if a.FilePath != b.FilePath {
        		return a.FilePath < b.FilePath
        	}
        	if a.Span.Start != b.Span.Start {
        		return a.Span.Start < b.Span.Start
        	}
        	return a.ID < b.ID
        }

