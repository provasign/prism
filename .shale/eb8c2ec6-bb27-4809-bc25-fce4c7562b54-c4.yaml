        import json, re, sys, datetime, time
        from pathlib import Path

        ROOT = Path.home() / ".claude" / "projects"
        RESDIR = Path("/Users/tapabratapal/Projects/provasign/research/harness/results/guard-fix-run")
        start = time.mktime(datetime.datetime(2026,9,21,16,48,0).timetuple())
        end = time.mktime(datetime.datetime(2026,9,21,21,10,0).timetuple())
        PRISM_NAME_RE = re.compile(r"^mcp__prism__")

        def content_len(c):
            if isinstance(c, str): return len(c)
            if isinstance(c, list):
                n=0
                for item in c:
                    if isinstance(item, dict) and item.get("type")=="text":
                        n += len(item.get("text",""))
                    else:
                        n += len(json.dumps(item))
                return n
            return len(json.dumps(c)) if c is not None else 0

        def op_of(tin, name):
            if isinstance(tin, dict) and "op" in tin: return tin["op"]
            return name.replace("mcp__prism__prism_","").replace("mcp__prism__","")

        def session_tokens_and_ops(f):
            data = f.read_text(errors="ignore")
            tool_use = {}
            tool_result_len = {}
            tok = {"input":0,"cache_read":0,"cache_write":0,"output":0}
            for line in data.splitlines():
                try:
                    j = json.loads(line)
                except Exception:
                    continue
                typ = j.get("type")
                msg = j.get("message") or {}
                if typ == "assistant":
                    usage = msg.get("usage") or {}
                    tok["input"] += usage.get("input_tokens",0) or 0
                    tok["cache_read"] += usage.get("cache_read_input_tokens",0) or 0
                    tok["cache_write"] += usage.get("cache_creation_input_tokens",0) or 0
                    tok["output"] += usage.get("output_tokens",0) or 0
                    for c in (msg.get("content") or []):
                        if isinstance(c, dict) and c.get("type")=="tool_use":
                            tool_use[c["id"]] = (c.get("name",""), c.get("input") or {})
                elif typ == "user":
                    for c in (msg.get("content") or []):
                        if isinstance(c, dict) and c.get("type")=="tool_result":
                            tid = c.get("tool_use_id")
                            if tid:
                                tool_result_len[tid] = content_len(c.get("content"))
            total = sum(tok.values())
            search_sizes = []
            for tid,(name,tin) in tool_use.items():
                if PRISM_NAME_RE.match(name) and op_of(tin,name)=="search":
                    search_sizes.append(tool_result_len.get(tid,0))
            return total, search_sizes

        files = []
        for d in ROOT.iterdir():
            if not d.is_dir() or "e2e-run" not in d.name: continue
            for f in d.glob("*.jsonl"):
                mt = f.stat().st_mtime
                if start <= mt <= end:
                    files.append((mt, f))
        files.sort()
        print(f"{len(files)} transcripts in window", file=sys.stderr)

        results = json.loads((RESDIR/"results.json").read_text())
        if len(files) != 2*len(results):
            print(f"MISMATCH: {len(files)} transcripts vs {2*len(results)} expected (2x{len(results)}) -- aborting", file=sys.stderr)
            sys.exit(1)

        TOK_TOLERANCE = 0.15  # allow 15% slack (usage field granularity / retries)
        mismatches = 0
        rows = []
        for i, task in enumerate(results):
            nat_mt, nat_f = files[2*i]
            pri_mt, pri_f = files[2*i+1]
            nat_tok_t, _ = session_tokens_and_ops(nat_f)
            pri_tok_t, pri_search = session_tokens_and_ops(pri_f)
            exp_nat = task["native"]["tokens"] or 0
            exp_pri = task["prism"]["tokens"] or 0
            ok_n = exp_nat == 0 or abs(nat_tok_t-exp_nat)/max(exp_nat,1) < TOK_TOLERANCE
            ok_p = exp_pri == 0 or abs(pri_tok_t-exp_pri)/max(exp_pri,1) < TOK_TOLERANCE
            if not (ok_n and ok_p):
                mismatches += 1
                print(f"  MISMATCH task={task['task']}: expected native={exp_nat} got~{nat_tok_t}, expected prism={exp_pri} got~{pri_tok_t}", file=sys.stderr)
                continue
            rows.append({
                "task": task["task"], "lang": task.get("lang"),
                "native_resolved": task["native"]["resolved"], "prism_resolved": task["prism"]["resolved"],
                "native_tok": exp_nat, "prism_tok": exp_pri,
                "ratio": (exp_pri/exp_nat) if exp_nat else None,
