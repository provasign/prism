        constructor (contract-changed or not), look up its callers via the same
        ChangeImpactScoped call change_impact already uses, and report which are
        verified test callers under a new `testCoverage` field. A function with no
        verified test caller carries an explicit warning instead of silently passing.
        Never affects verdict/gateFailure -- this signal hasn't earned gating trust
