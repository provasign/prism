        feat(verify): report test coverage for body-only changes, not just contract changes

        verify's existing seed pipeline (missed callers of a changed contract) only
        ever fires on signature change, rename, removal, or interface/type member
        extraction -- a pure body edit (the shape of an ordinary bug fix) was
        invisible to it entirely. Measured (2026-09-23, H1 hard-core-failure review):
        every one of 12 unsolved benchmark tasks was a body-only change, and in every
        case the agent's own test run gave a false pass -- wrong test scope, a hidden
        regression test not yet present, or (once) testing an installed package
        instead of the checkout.

