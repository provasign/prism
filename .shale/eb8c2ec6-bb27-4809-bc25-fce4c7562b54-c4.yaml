        feat(search): raise search's exact-term full-body threshold to match query/impact's

        searchevidence.go's compact search path only delivered a hit's full enclosing
        body when the symbol was <=20 lines; anything bigger got a +/-9 line window,
        even for an exact term match. Raised to the same 160-line/10000-byte bound
        compactSearchBodiesLegacy already uses, now shared as searchFullBodyMaxLines/
        searchFullBodyMaxBytes in delivery.go.

        Rationale (research/docs/HANDOFF.md, turn economics): 95.5% of a session's
        tokens are cache_read (context re-billed every turn); a windowed hit the agent
        immediately re-Reads in full costs a whole extra turn (~50K tokens) to save
        nothing, since the window was never going to be cheaper once re-read. Only
        applies to len(item.terms) > 0 (an exact match, never a fuzzy "related
        spelling" guess), and `selected` is already capped upstream, so a broad
        search still windows every hit -- this can't blow up a large result set.

