        SED = re.compile(r"(^|[|;&(]\s*|xargs\s+|exec\s+)\s*sed\s", re.M)
        rows = []
        for f in sorted(glob.glob(OUT + "/*.json")):
            if f.endswith("manifest.json"): continue
            d = json.load(open(f))
            if "arm" not in d: continue
            tr = d.get("transcript") or ""
            if tr and not os.path.isabs(tr): tr = os.path.join(OUT, tr)
            if not os.path.exists(tr):
                cand = glob.glob(OUT + "/transcripts/" + os.path.basename(f)[:-5] + "*.jsonl")
                tr = cand[0] if cand else ""
            raw = open(tr).read() if tr else ""
            sed = bad = denied = 0
            for l in raw.splitlines():
                try: m = json.loads(l)
                except Exception: continue
                c = m.get("message", {}).get("content")
                if not isinstance(c, list): continue
                for b in c:
                    if not isinstance(b, dict): continue
                    if b.get("type") == "tool_use" and b.get("name") == "Bash":
                        cmd = b["input"].get("command", "")
                        if SED.search(cmd) and re.search(r"sed\s+-[a-zA-Z]*i|sed[^|;&]*\s-i", cmd):
                            sed += 1
                            if GNU.search(cmd) or GI.search(cmd): bad += 1
                    if b.get("type") == "tool_result" and "Not run: " in json.dumps(b.get("content")) and "sed" in json.dumps(b.get("content")):
                        denied += 1
            rows.append(dict(task=d["task"], arm=d["arm"], trial=d.get("trial", 1), resolved=d.get("resolved"),
