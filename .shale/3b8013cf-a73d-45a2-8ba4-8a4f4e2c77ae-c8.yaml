                             note="BSD (macOS) sed" in raw, has_tr=bool(raw)))
        for r in rows:
            print(f"{r['task'][:52]:52} {r['arm'][-8:]:8} t{r['trial']} res={r['resolved']!s:5} calls={r['calls']} ${r['cost']:.2f} sedEdits={r['sed_edits']} gnuSed={r['bad']} guardDenied={r['denied']} noteSeen={r['note']} tr={r['has_tr']}")
        agg = collections.defaultdict(lambda: collections.Counter())
        for r in rows:
            a = agg[r["arm"]]; a["n"] += 1; a["resolved"] += bool(r["resolved"]); a["calls"] += r["calls"] or 0
            a["cost"] += r["cost"]; a["sed_edits"] += r["sed_edits"]; a["bad"] += r["bad"]; a["sessions_bad"] += r["bad"] > 0
        for arm, a in agg.items():
            print(f"\n{arm}: n={a['n']} resolved={a['resolved']} calls={a['calls']} cost=${a['cost']:.2f} sed_edits={a['sed_edits']} gnu_sed_calls={a['bad']} sessions_with_gnu_sed={a['sessions_bad']}")
        EOF
        echo ok
