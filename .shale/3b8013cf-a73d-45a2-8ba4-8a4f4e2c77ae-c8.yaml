merate(events):\n        if e[0]==\"sedread\":\n            prior=[x for x in events[:i] if x[1]==e[1]]\n            if any(x[0]==\"deny\" for x in prior[-3:]): follow[(arm,\"sed read of file just denied\")]+=1\n            elif any(x[0]==\"read\" for x in prior): follow[(arm,\"sed read of file already Read\")]+=1\n            elif prior: follow[(arm,\"sed read of file seen by sed before\")]+=1\n            else: follow[(arm,\"first look at file\")]+=1\nfor k in sorted(c): print(k,c[k])\nfor k in sorted(follow): print(k,follow[k])\nEOF\npython3 guard.py"
