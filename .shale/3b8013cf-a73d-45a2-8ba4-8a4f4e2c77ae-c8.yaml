        import json, os, re, sys, glob, time, collections
        root = os.path.expanduser("~/.claude/projects")
        files = [f for f in glob.glob(root + "/*e2e*/**/*.jsonl", recursive=True)
                 if time.time() - os.path.getmtime(f) < 14*86400 and "/subagents/" not in f]
        SED = re.compile(r"(^|[|;&(]\s*|xargs\s+|exec\s+)\s*(g?sed)\s", re.M)
        rows = []
        sessions = collections.Counter()
        for f in files:
            try:
                lines = [json.loads(l) for l in open(f)]
            except Exception:
                continue
            raw = open(f).read()
            arm = "prism" if "mcp__prism" in raw else "native"
            sessions[arm] += 1
            last_text = ""
            reads = collections.Counter()
            results = {}
            for m in lines:
                if m.get("type") == "user":
                    c = m.get("message", {}).get("content")
                    if isinstance(c, list):
                        for b in c:
                            if isinstance(b, dict) and b.get("type") == "tool_result":
                                cc = b.get("content")
                                if isinstance(cc, list):
                                    cc = " ".join(x.get("text", "") for x in cc if isinstance(x, dict))
                                results[b.get("tool_use_id")] = (str(cc)[:300], b.get("is_error"))
                if m.get("type") != "assistant":
                    continue
                for b in m.get("message", {}).get("content", []):
                    t = b.get("type")
                    if t == "thinking" and b.get("thinking"):
                        last_text = b["thinking"]
                    elif t == "text" and b.get("text"):
                        last_text = b["text"]
                    elif t == "tool_use":
                        name = b.get("name")
                        reads[name] += 1
                        if name == "Bash":
                            cmd = b["input"].get("command", "")
                            if SED.search(cmd):
                                rows.append(dict(file=f, arm=arm, id=b["id"], cmd=cmd, why=last_text[-600:]))
                        last_text = ""
            for r in rows:
                if r["file"] == f:
                    r["result"] = results.get(r["id"])
                    r["tools"] = dict(reads)
        json.dump({"sessions": sessions, "rows": rows}, open(sys.argv[1], "w"), indent=1)
        print(sessions, len(rows))
        EOF
