        cd /Users/tapabratapal/Projects/provasign/research/harness && python3 << 'PY'
        import json, glob, re, collections, statistics

        pairs = {}
        for f in glob.glob('runs/swebench-live/full38/*.json'):
            if 'provenance' in f or 'scored' in f or 'predictions' in f: continue
            r = json.load(open(f))
            pairs.setdefault(r['instance_id'], {})[r['arm']] = r

        def read_targets(rec):
            """Every file-read event: (kind, file). Native Read, prism_read, bash cat/sed-n/head/tail."""
            ev = []
            for c in rec['tool_calls']:
                if c['name'] == 'Read':
                    ev.append(('Read', c['input'].get('file_path','')))
                elif c['name'] == 'mcp__prism__prism_read':
                    ev.append(('prism_read', c['input'].get('file','')))
                elif c['name'] == 'Bash':
                    cmd = str(c['input'].get('command',''))
                    m = re.findall(r'(?:cat|sed -n [^ ]+ ?p?|head [^|>]*|tail [^|>]*)\s+([\w./-]+\.\w+)', cmd)
                    for f2 in m: ev.append(('bash', f2))
            return ev

        def norm(p): return p.split('/')[-1] if p else p  # worktree prefixes differ; match on basename+parent
        def norm2(p):
            parts = p.strip('/').split('/')
            return '/'.join(parts[-2:]) if len(parts)>=2 else p

        # 3) RE-READ HEADROOM in baseline: how many read events hit a file already read this cell?
        rr_events_b, rr_events_p, dup_prism_native = [], [], []
        for tid,p in pairs.items():
            if 'baseline' not in p or 'prism' not in p: continue
            for arm, sink in (('baseline', rr_events_b), ('prism', rr_events_p)):
                seen = collections.Counter()
                rr = 0
                for kind, f in read_targets(p[arm]):
                    key = norm2(f)
                    if seen[key]: rr += 1
                    seen[key] += 1
                sink.append(rr)
            # 4) duplication inside prism arm: same file via prism_read AND native path
            pr_files = {norm2(f) for k,f in read_targets(p['prism']) if k=='prism_read'}
            nat_files = {norm2(f) for k,f in read_targets(p['prism']) if k!='prism_read'}
            dup_prism_native.append(len(pr_files & nat_files))

        print("RE-READ EVENTS per cell (same file read again, any tool):")
        print(f"  baseline: median {statistics.median(rr_events_b)}, mean {statistics.mean(rr_events_b):.1f}, total {sum(rr_events_b)}")
        print(f"  prism   : median {statistics.median(rr_events_p)}, mean {statistics.mean(rr_events_p):.1f}, total {sum(rr_events_p)}")
        print(f"\nDUPLICATION in prism arm (same file read via prism_read AND native Read/cat):")
        print(f"  median {statistics.median(dup_prism_native)}, mean {statistics.mean(dup_prism_native):.1f}, cells with >=1: {sum(1 for x in dup_prism_native if x)}/{len(dup_prism_native)}")

        # 5) LOCALIZATION vs IMPLEMENTATION on failures: did failed cells still edit the gold files?
        slice_tasks = {t['instance_id']: t for t in json.load(open('runs/swebench-live/slice-ab38.json'))}
        scored = {r['instance_id']: r for r in json.load(open('runs/swebench-live/full38/scored.json'))}
        def patch_files(patch):
            return set(re.findall(r'^\+\+\+ b/(.+)$', patch, re.M))
        loc_ok = collections.Counter(); loc_n = collections.Counter()
        for tid, sc in scored.items():
            gold = patch_files(slice_tasks[tid].get('patch') or slice_tasks[tid].get('gold_patch',''))
            gold_code = {g for g in gold if not g.startswith('test') and '/test' not in g and 'CHANGELOG' not in g}
            if not gold_code: continue
            for arm in ('baseline','prism'):
                x = sc['arms'][arm]
                if x['resolved'] is not False: continue   # only FAILED, scored cells
                agent = patch_files(pairs[tid][arm]['model_patch'])
                loc_n[arm] += 1
                if gold_code & agent: loc_ok[arm] += 1
        print(f"\nFAILED cells where the agent still edited >=1 gold code file (localization succeeded, fix wrong):")
        for arm in ('baseline','prism'):
            print(f"  {arm:9}: {loc_ok[arm]}/{loc_n[arm]}")
        PY
