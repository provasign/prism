    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research/harness && python3 - <<'PY'
        import json,glob,re

        def py_retries(cmds):
            n=0
            for i in range(len(cmds)-1):
                a,b=cmds[i],cmds[i+1]
                if re.match(r'^python\s',a) and re.match(r'^python3\s',b) and a[6:]==b[7:]:
                    n+=1
            return n

        total_haiku=0; total_opus=0
        for run in ('haiku5',):
            for f in glob.glob(f'runs/swebench-live/{run}/*.json'):
                if 'provenance' in f or 'scored' in f: continue
                d=json.load(open(f))
                cmds=[str(c['input'].get('command','')) for c in d['tool_calls'] if c['name']=='Bash']
                n=py_retries(cmds)
                total_haiku+=n
                if n: print(f"  {run:10} {d['instance_id'][:32]:32} {d['arm']:9} {n} python->python3 retries")

        for run in ('v055-full','radius8','inject5','smoke5-v0551','jsontext5','context5'):
            for f in glob.glob(f'runs/swebench-live/{run}/*.json'):
                if 'provenance' in f or 'scored' in f: continue
                d=json.load(open(f))
                cmds=[str(c['input'].get('command','')) for c in d['tool_calls'] if c['name']=='Bash']
                total_opus+=py_retries(cmds)

        print(f"\nHaiku run total: {total_haiku} wasted turns (exact command retried verbatim, python->python3)")
        print(f"All Opus runs combined total: {total_opus} wasted turns")
        PY
