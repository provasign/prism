        print(f"total git history commands: {len(git_cmds)}\n")
        cat=collections.Counter()
        for tid,arm,cmd in git_cmds:
            if re.search(r'log\s+.*--all|log\s+.*--grep|log\s+--oneline\s+-i',cmd): k='search ALL history / grep commit messages'
            elif re.search(r'show\s+[0-9a-f]{6,}',cmd) and '--stat' not in cmd and '-- ' not in cmd: k='show one commit, full diff (no path)'
            elif re.search(r'show\s+[0-9a-f]{6,}.*--stat',cmd): k='show one commit, stat only'
            elif re.search(r'show\s+[0-9a-f]{6,}.*-- ',cmd): k='show one commit, path-scoped diff'
            elif re.search(r'log\s+.*--oneline.*-- \S',cmd) or re.search(r'log\s+.*-- \S.*--oneline',cmd): k='log for ONE FILE (history of this file)'
