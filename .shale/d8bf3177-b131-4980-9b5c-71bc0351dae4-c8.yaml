        def sz(cmd_list, timeout=60):
            try:
                r = subprocess.run(cmd_list, cwd=WT, capture_output=True, timeout=timeout)
                return len(r.stdout)
            except Exception as e:
                return -1

        print(f"{'call':60} {'prism_B':>8} {'native_B':>9}")
        tot_p = tot_n = 0
        for c in rec['tool_calls']:
            name = c['name']
            if not name.startswith('mcp__prism'): continue
            i = c['input']
            if name.endswith('prism_read'):
                f = i['file']; off = i.get('offset'); lim = i.get('limit')
                pc = [PRISM, 'read', f, '--format','text']
                if off: pc += ['--offset', str(off)]
                if lim: pc += ['--limit', str(lim)]
                pb = sz(pc)
                # native Read equivalent: the raw lines + "  N\t" prefix overhead (~7B/line)
                try:
                    lines = open(os.path.join(WT,f), errors='replace').read().splitlines()
                    if off: chunk = lines[off-1:off-1+(lim or 2000)]
                    else: chunk = lines[:2000]
                    nb = sum(len(l)+8 for l in chunk)
                except Exception: nb = -1
                label = f"read {f.split('/')[-1]} off={off} lim={lim}"
            elif name.endswith('prism_search'):
                q = i['query']; qs = q if isinstance(q, list) else [q]
                pc = [PRISM, 'search'] + qs + ['--format','text']
                if i.get('scope'): pc += ['--scope', i['scope']]
                if i.get('path'):
                    p = i['path']; pc += ['--path'] + (p if isinstance(p,list) else [p])
                if i.get('exhaustive'): pc += ['--exhaustive']
                pb = sz(pc)
                # native equivalent: grep -rn each term (over path if given)
                nb = 0
                for term in qs:
                    gp = i.get('path'); target = (gp if isinstance(gp,str) else gp[0]) if gp else '.'
                    r = subprocess.run(['grep','-rn','--include=*.py','-e',term,target], cwd=WT, capture_output=True, timeout=60)
                    nb += len(r.stdout)
                label = f"search {str(qs)[:40]} scope={i.get('scope','def')}"
            else:
                continue
            tot_p += max(pb,0); tot_n += max(nb,0)
            print(f"{label:60} {pb:8} {nb:9}")
        print(f"\nTOTALS: prism {tot_p:,} B   native-equivalent {tot_n:,} B   ratio {tot_p/max(tot_n,1):.2f}x")
