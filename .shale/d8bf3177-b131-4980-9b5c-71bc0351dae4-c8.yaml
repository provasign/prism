        import json,re,collections

        def kind(c):
            n=c['name']
            if n.startswith('mcp__prism'): return n.replace('mcp__prism__prism_','prism.')
            if n in ('Read','Edit','Write','Glob','Grep','MultiEdit'): return n
            cmd=str(c['input'].get('command',''))
            if re.search(r'\b(pytest|tox|unittest)\b',cmd): return 'TEST'
            if re.search(r'(?:^|[\s;&|(])(grep|rg|ag|find)\b',cmd): return 'grep'
            if re.search(r'(?:^|[\s;&|(])(cat|sed|head|tail|less|nl)\b',cmd): return 'read-sh'
            if re.search(r'(?:^|[\s;&|(])git\b',cmd): return 'git'
            if re.search(r'python3?\s+-c|<<',cmd): return 'repro'
            if re.search(r'\b(pip|uv|venv|which|ls)\b',cmd): return 'env'
            return 'sh-other'

        for arm in ('no-prism','prism'):
            flat=[]
            for f in sorted(__import__('glob').glob(f'runs/swebench-live/haiku5/*.{arm}.json')):
                d=json.load(open(f))
                flat += [kind(c) for c in d['tool_calls']]
            n=len(flat)
            print(f"\n{arm} — {n} total actions")
            for k,v in collections.Counter(flat).most_common():
                print(f"  {k:10} {v:4}  {v/n:5.1%}")
        PY
