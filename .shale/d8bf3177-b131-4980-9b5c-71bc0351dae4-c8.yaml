            dcache.append(pr['cache_read_tokens'] - b['cache_read_tokens'])
            dout.append(pr['output_tokens'] - b['output_tokens'])
            dcost.append(pr['cost_usd'] - b['cost_usd'])
            dturns.append(pr['turns'] - b['turns'])
            n_prism = sum(1 for c in pr['tool_calls'] if c['name'].startswith('mcp__prism'))
            dose.append((n_prism, pr['cost_usd'] - b['cost_usd'], pr['turns'] - b['turns']))

        med = statistics.median
        print("PAIRED DELTAS (prism - baseline), n =", len(dfresh))
        print(f"  fresh_in : median {med(dfresh):+8.0f}   mean {statistics.mean(dfresh):+8.0f}")
        print(f"  cache_rd : median {med(dcache):+8.0f}   mean {statistics.mean(dcache):+8.0f}")
        print(f"  out      : median {med(dout):+8.0f}   mean {statistics.mean(dout):+8.0f}")
        print(f"  cost     : median {med(dcost):+8.3f}   mean {statistics.mean(dcost):+8.3f}")
        print(f"  turns    : median {med(dturns):+8.1f}   mean {statistics.mean(dturns):+8.1f}")

        # dose-response: does MORE prism use correlate with cheaper or costlier?
        dose.sort()
        lo = [d for n,d,t in dose if n <= 3]; hi = [d for n,d,t in dose if n >= 8]
        lot = [t for n,d,t in dose if n <= 3]; hit = [t for n,d,t in dose if n >= 8]
        print(f"\nDOSE-RESPONSE: prism calls <=3: n={len(lo)}, med dcost {med(lo):+.3f}, med dturns {med(lot):+.1f}")
        print(f"               prism calls >=8: n={len(hi)}, med dcost {med(hi):+.3f}, med dturns {med(hit):+.1f}")

