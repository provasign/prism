        JSX text children were lexed as code: `<code>src/*.ts</code>` opened a
        block comment to the end of the file, a backtick a template literal. grove
        masks callers' bodies to find local declarations and default exports, so
        TSX files got phantom callers (a locally shadowed helper bound to the
        imported one) and lost a default-export caller. Where an expression starts
