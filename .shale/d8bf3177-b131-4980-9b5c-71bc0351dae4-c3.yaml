    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research && git add -A harness/ && git commit -q -F - <<'EOF'
        harness: never record a cell that did no work

        A five-hour rate limit hit mid-run on 2026-08-16. Every subsequent cell
        returned in ~1.2s with turns=1, cost=0, empty patch — 28 of them — and the
        harness WROTE all of them. The resume check skips any cell whose file
        exists, so those 28 would have been permanently empty, and downstream they
        read as "the agent produced nothing", which is a plausible-looking result
        rather than an obvious failure.

        A cell with no turns and no cost is a failed invocation, not a result. It
        is now logged loudly and not recorded, so a relaunch retries it. Verified:
        after purging the 28 poisoned records, the resume skipped exactly the 5
        real completed pairs and continued at task 6.

        Also committing the first 10 real cells of v055-full and their scores —
        the first correctness-scored A/B this project has produced.

          resolve rate      baseline 5/5   prism 4/5
          equal-correctness 4/5 cells, median dcost +0.121, median dturns -1.0
          denials           2 and 3 across 10 cells (previously 8-25 PER CELL)

        The standout is a2aproject__a2a-python-443: both arms resolved, prism 31
        turns/$1.58 against baseline 65/$2.60, with the prism arm making 4 bash
        calls to the baseline's 22 and using exhaustive=true, files_only=true,
        path= and regex= — the v0.55.0 features — to get there.

        The loss matters more than the win at this n: prism failed
        a2aproject__a2a-python-394 where baseline resolved it. Cheaper is easy if
