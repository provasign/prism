        harness: close the correctness loop — per-cell scoring that actually works

        Every benchmark number this project produced was efficiency-only, because
        correctness scoring was documented but never run. Cost at unknown
        resolve-rate is uninterpretable: one arm may simply have done less. That is
        the single largest reason ~$100 of results were deleted on 2026-08-16.

        score_cell.py — scores one cell pair in an ephemeral container, then reports
        resolve-rate FIRST, then tokens/turns/denials, then what the agent actually
        did (bash categories, retry loops, verbatim prism calls). --watch scores
        pairs as a run produces them.

          FIELD MAPPING: the bed stores FAIL_TO_PASS/PASS_TO_PASS (uppercase, from
          mining) and no test_modules; docker_eval wants lowercase plus modules.
          Modules are derived from the F2P node ids and P2P is RESTRICTED to those
          modules -- the beds carry up to 495 P2P ids spanning the whole suite, and
          score() counts "not in the run results" as a regression, so an
          unrestricted list fails every cell for tests that never ran.

        docker_eval.py — two fixes, both found by the GOLD patch scoring
        not-resolved, which is the only reason they were visible at all:

          1. uv-dynamic-versioning raises "This does not appear to be a Git project"
             because a worktree's .git is a FILE pointing at an unmounted host path.
             pip install -e . fails, the package is never importable, and pytest
             reports a collection ERROR -- indistinguishable from "the fix did not
             work". Added UV_DYNAMIC_VERSIONING_BYPASS and HATCH_VCS_PRETEND_VERSION
             to the existing setuptools-scm/PDM bypasses.
          2. Guessing extras (.[dev]/.[test]/.[tests]) cannot supply a project's real
             optional deps: a2a-python then ImportErrors on SQLAlchemy at collection.
             The bed already carries test_cmds (["pytest -rA", "uv run pytest -rA"])
             and the repo ships uv.lock, so honour it -- `uv sync --all-extras`
             reproduces the declared environment, with the pip path as fallback.

        Validated two-sided before trusting it, on a2aproject__a2a-python-279:

            GOLD  patch -> resolved=True   f2p_ok p2p_ok  n_run=34   [13s]
            EMPTY patch -> resolved=False  f2p fails      n_run=34   [13s]

        A positive control alone would not have caught a scorer that says yes to
        everything.

        validate_gold.py — runs that two-sided check across a whole slice before any
        API spend. A task whose GOLD does not resolve is UNSCOREABLE, and including
        it buys cells whose correctness cannot be judged. Docker only, no tokens.

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_012P71u7T9Y23k1tiGV4ixhr
