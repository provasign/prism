        feat(read): line windows — close the capability gap that made prism_read unusable

        prism_read took only `file`. It was whole-file or nothing, and that is why
        agents route around it.

        Measured over 374 real file reads across unaided and prism-armed agents:

            96  25.7%  sed -n A,Bp FILE          <- prism_read could not express
            93  24.9%  Read: whole file
            89  23.8%  Read: offset+limit        <- prism_read could not express
            59  15.8%  cat FILE (whole)
            19   5.1%  grep -A/-B/-C
             7   1.9%  head -N FILE
             4   1.1%  wc -l

        50.6% of file reads are LINE-RANGED. In the prism arm, of 352 reads that
        did not go through prism, 307 (87%) were ranged -- a shape the tool had no
        parameter for. That also explains a dead feature: prism_read's session
        ledger returns a [prism:cached] pointer on a repeat read, and it fired 0
        times in 45 calls, because the agent cannot route a ranged read through a
        whole-file tool and the ledger never sees the repeats it exists to collapse.

        offset/limit now give the same window sed and native Read give:

            prism read <file> --offset 30 --limit 5
            prism_read(file=..., offset=30, limit=5)

        Delivered verbatim and line-numbered, WITH totalLines always reported -- a
        window without a denominator reads as the whole file, which is the
        silent-narrowing failure this codebase keeps re-learning. An out-of-range
        offset clamps and explains rather than erroring: a tool that errors is a
        tool agents route around, which is the whole lesson here.

        Ranged reads deliberately skip the compression path (slicing lines and then
        compressing them is two lossy steps on one piece of content) and require no
        index, so they work before the first index or with the engine down.

        Expected value, stated honestly: this does NOT come with a measured saving.
        The dedup it unlocks is worth roughly 1k tokens/cell on the numbers I have,
        which I judged too small to build for on its own. The case is surface
        completeness -- prism_read should be a real substitute for the read tools
        agents have, not a partial one -- and it removes a reason to route around
        prism that had nothing to do with prism's value.

