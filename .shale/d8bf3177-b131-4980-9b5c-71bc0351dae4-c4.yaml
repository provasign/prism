                    for m in re.finditer(r'(?:^|[\s;&|(])(?:grep|rg)\s+((?:-\S+\s+)*)(?:"([^"]+)"|\'([^\']+)\'|(\S+))',cmd):
                        p=m.group(2) or m.group(3) or m.group(4)
                        if p and not p.startswith('-'): out.append(p)
            return out
        def toks(p): return set(re.findall(r'[A-Za-z_][A-Za-z0-9_]{2,}', p))
        repeat=0; tot=0; cells=0
        percell=[]
        for run in ('v055-full','radius8'):
            for f in glob.glob(f'runs/swebench-live/{run}/*.no-prism.json'):
                ps=pats_of(f)
                if not ps: continue
                cells+=1; percell.append(len(ps))
                seen=collections.Counter()
                for p in ps:
                    for t in toks(p): seen[t]+=1
                tot+=len(seen)
                repeat+=sum(1 for t,n in seen.items() if n>=2)
        print(f"cells with searches: {cells}   searches/cell median {sorted(percell)[len(percell)//2]}, max {max(percell)}")
        print(f"distinct identifiers searched: {tot}")
        print(f"identifiers searched 2+ TIMES in the same cell: {repeat} ({repeat/tot:.0%})")
        print()
