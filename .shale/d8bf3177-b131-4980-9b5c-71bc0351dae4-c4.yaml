        harness: run F2P node ids, not whole modules — radius bed 8 -> 15 scoreable

        Running whole test MODULES was my error, and it was silently discarding
        half the bed. A module drags in every unrelated test it contains -- flaky
        ones, ones needing live network, ones broken in the image -- and any of
        them failing scores the GOLD patch as not-resolved, which reads as "this
        task is bad" rather than "the harness ran the wrong thing".

        Diagnosed all 12 rejects (docker only, no API spend):

            8   PASS once the F2P node ids are named   <- harness bug, mine
            2   missing dependency in the image
            1   collection error
            1   the F2P test needs the LIVE Telegram API and cannot pass offline

        Fixing it took two more corrections worth recording:

          - Node ids are passed as DATA (/tmp/nodes.json, pytest.main from python
            -c), never as shell words. Parametrized names contain spaces and
            brackets -- test_mul[<Tick: 5 minutes>] -- and any quoting scheme
            eventually meets an id that breaks it.
          - P2P ids are NOT passed to pytest. ONE unresolvable node id aborts the
            entire invocation with "ERROR: not found", and beds carry thousands of
            P2P ids whose parametrized names drift between versions. Measured:
            conan-17514 went from scoring correctly to n=0 the moment 150 P2P ids
            were added. Regressions are now read off whichever listed P2P ids
            happen to execute alongside the F2P ones, and the count is reported
            (p2p_checked/p2p_total) so a thin regression check is not mistaken for
            a thorough one. This is a real weakening of regression detection,
            stated rather than hidden.

        Revalidated all 20 two-sided: 15 scoreable, gold resolves and empty does
        not on every one of them.

        slice-radius15.json: 15 tasks, min 8 / median 11 / max 60 files. The bed
        that can actually test the change-impact claim, ready for the moment the
        agent runs in a network-isolated container.

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_012P71u7T9Y23k1tiGV4ixhr
