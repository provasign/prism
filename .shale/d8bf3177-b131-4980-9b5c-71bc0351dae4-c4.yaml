        revert(search): drop the symbol injection; keep the two bug fixes it found

        Reverts the enrichment added in e8007fd. The diagnosis behind it was
        correct and the conclusion drawn from it was wrong.

        WHAT THE DIAGNOSIS GOT RIGHT: 78% of an unaided agent's searches are
        symbol-shaped, 10.2% are literally go-to-definition and 8.5% find-call-
        sites, and 25% of identifiers get searched twice in a cell.

        WHAT IT MISSED: how small that slice is. Decomposing 32 baseline cells,
        859 actions, by phase:

            LOCATE      find a file it will edit        66   7.7%   median  2
            COMPREHEND  decide what to write           276  32.1%   median  8
            IMPLEMENT   edit, test, iterate            517  60.2%   median 12

        Locating code is 7.7% of the work. The issue text usually names the
        module, so the agent is on the right file within two actions. A perfect
        retrieval tool saturates at ~8% of actions on this task family, and the
        injection was optimising the symbol-shaped fraction OF that 8%.

        Measured on the same three tasks before and after:

            magic-wormhole   22/$0.53 -> 29/$0.98   became  20/$0.67 -> 23/$1.06
            PyPSA-1325       19/$0.60 -> 18/$0.64   became  21/$0.67 -> 29/$1.01
            dag-factory-544  25/$1.19 -> 20/$0.84   became  27/$1.26 -> 39/$1.82

        Two prism arms that were wins became losses. NOT causally established --
        n=3 and these tasks swing hard (mypy ran 39/24/64 turns across identical
        configs) -- but the injection put payload on the most-called tool in the
        system, and cache reads compound: a block added at turn 3 of 30 is paid
        ~27 times. That is HANDOFF §2's own lesson and I attached payload to the
        hottest call anyway. An unvalidated change on a hot path goes.

        The dag-factory trace shows the real shape: both arms found telemetry.py
        within 3 turns; the 39-turn run then spent turns 10-35 on git log, git
        show, CHANGELOG, pyproject.toml, PRIVACY_NOTICE.md and uv.lock, working
        out WHAT the change should be. That is comprehension, not retrieval, and
        no search tool addresses it.

        KEPT, because both are independent bugs the analysis surfaced:

          - excludeDirs was [".git", ".grove"], so prism indexed its own session
            transcripts and returned them as the TOP hits for a symbol query.
            Now excludes .shale/.claude/.cursor/.windsurf/.kiro/.devin on rg and
            the native scanner. `search stringsArg` went from 25 hits (mostly
            logs) to 9 real ones.
          - The steering row that pushed scope="text" for everything now splits:
            default for code, scope="text" for strings and messages.

        Also explains the two beds cleanly. Change-impact tasks ARE the locate
        slice -- "list every site this breaks" is 100% of that 7.7% -- which is
        why prism wins 8x there. SWE-bench repair is 7.7% locate and 92%
        everything else, which is why it is flat.

        Gate: go vet + go test ./... green.

