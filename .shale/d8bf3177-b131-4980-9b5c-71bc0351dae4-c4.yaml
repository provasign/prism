        fix(mcp): prism_read's offset/limit were never in the advertised schema

        The bug that made rangeread5 void. `toolRead` was patched to read
        offset/limit via intArg, the tool DESCRIPTION was updated to promise them,
        but the schema's `properties` map was never edited to match -- a
        string-replace silently no-op'd against surrounding text that had already
        drifted. go build, go vet, and every existing test passed, because Invoke
        calls toolRead directly against a bare map[string]any: nothing type-checks
        a key against what tools/list advertises, and every existing test called
        Invoke the same way, bypassing the schema exactly like the bug did.

        Consequence: a real MCP client only ever sends keys listed in inputSchema,
        so the parameter existed in the binary and was UNREACHABLE from any real
        agent. The 2026-08-16 rangeread5 smoke run "verified" ranged reads by
        calling Invoke directly (same blind spot) and then measured live adoption
        at 0/5 -- which was true, but not for the reason reported: the agent read
        "offset/limit give an exact window" in the description, found no such
        parameters in the schema, and correctly used Read/sed instead. Reported as
        evidence about agent behavior; it was evidence about a broken schema. That
        result is void.

        Fixed prism_read's schema. Found and fixed the same class of bug on an
        advertised tool that had NOTHING to do with today's change: prism_query's
        toolQuery reads "limit" (line 870, capping candidate symbols before
        ranking) and it was never in prism_query's schema either -- dead on every
        real call since query intArg("limit", 50) was written, independent of any
        recent edit.

        ADDED: TestSchemaAdvertisesEveryArgTheToolFuncReads. Parses tools.go,
        extracts each toolXxx func body, cross-references it against
        dispatch (case "prism_x": return h.toolXxx) and toolSchema(x)'s declared
        properties -- for every one of the SIX tools actually advertised via
        ToolSchemas() (CLI-only tools fall through the additionalProperties:true
        default and are correctly unchecked). Flags any *Arg(args, "key") read
        whose key is not in that tool's own schema. A short, documented allowlist
        covers genuine pre-rename fallback aliases (symbol/name, qualifiedName/name,
        intent/task, path/file) where the PRIMARY key is declared and checked
        normally and only the legacy alias is exempt.

        Verified fixed over the REAL protocol this time, not Invoke():
        tools/list shows offset/limit in prism_read's properties and limit in
        prism_query's; tools/call with offset=10,limit=3 returns delivery=range,
        startLine=10, endLine=12.

