        c=collections.Counter()
        for run in ('v055-full','radius8'):
            for f in glob.glob(f'runs/swebench-live/{run}/*.no-prism.json'):
                for p in pats_of(f):
                    if DEFN.search(p): c['go-to-DEFINITION (def/class X)']+=1
