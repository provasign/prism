    - cmd: "gh pr create --repo provasign/prism --head fix/hook-paths --title \"hooks: name scripts via \\$CLAUDE_PROJECT_DIR; init upgrades an installed read guard\" --body \"$(cat <<'EOF'\n**Bug (regression from v0.87.3):** prism registered its hooks as `python3 .claude/hooks/<script>.py`, relative to the working directory. Claude Code runs hooks in the shell's current directory, so after an agent ran `cd src/...` python exited 2 (file not found), which Claude Code treats as a block. Every later Bash and Read call was refused. v0.87.3 put the sed guard on every Bash call, which made this common: 3 benchmark sessions hit it. In one (jackson `acceptJsonFormatVisitor`, 2026-10-10), the agent spent 9 calls getting its shell back and wrote stub hook files into the repo; that pair cost 24 calls vs native's 16.\n\n**Fix**\n- Hook commands are `python3 \"$CLAUDE_PROJECT_DIR\"/.claude/hooks/<script>.py` (Claude Code's documented pattern).\n- Install replaces the legacy relative entries (a user's own hooks on the same matcher are kept); uninstall removes both forms.\n- Any `prism init` run upgrades an existing read guard install. brew upgrades the binary but not the scripts and settings copied into the project, so without this, existing users would keep the broken commands, and the v0.87.4 sed conversion would never reach them.\n\n**Tests:** every registered command run through `sh -c` from a subdirectory (the actual failure); legacy migration keeping user hooks; init rewriting a stale installed script. `go test ./...` green; ci_invariants on the candidate.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01KXa6Cv1ZUXcdMqXcJfQFhX\nEOF\n)\" 2>&1 | tail -1"
