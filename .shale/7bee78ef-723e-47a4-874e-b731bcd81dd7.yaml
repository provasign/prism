        import re
        # Reuse mine_2026_tasks.py's language-agnostic core, but with JS/C-specific regexes.
        import sys
        sys.path.insert(0, "harness/build")
        from mine_2026_tasks import gh_json, BUG_RE, SKIP_RE

        def candidates(repo, limit, year, src_re, test_re):
            prs = gh_json("pr", "list", "-R", repo, "--state", "merged", "--limit", str(limit),
                          "--json", "number,title,mergedAt,labels,body")
            out = []
            for p in prs:
                if not (p["mergedAt"] or "").startswith(year):
                    continue
                title = p["title"]
                if SKIP_RE.search(title):
                    continue
                labels = {l["name"].lower() for l in p.get("labels", [])}
                is_bug = bool(BUG_RE.search(title) or BUG_RE.search(p.get("body") or ""))
                is_feat = bool(labels & {"feature", "enhancement", "new feature"})
                if not (is_bug or is_feat):
                    continue
                files = gh_json("pr", "view", str(p["number"]), "-R", repo, "--json", "files")["files"]
                paths = [f["path"] for f in files]
                has_test = any(test_re.search(x) for x in paths)
                has_src = any(src_re.search(x) and not test_re.search(x) for x in paths)
                churn = sum(f.get("additions", 0) + f.get("deletions", 0) for f in files)
                if not (has_test and has_src) or churn > 400 or len(paths) > 25:
                    continue
                out.append({"instance_id": f"{repo.replace('/', '__')}__pr{p['number']}",
                            "repo": repo, "pr": p["number"], "merged_at": p["mergedAt"],
                            "kind": "bug" if is_bug else "feature", "title": title, "churn": churn,
                            "test_files": [x for x in paths if test_re.search(x)],
                            "src_files": [x for x in paths if src_re.search(x) and not test_re.search(x)]})
            return out

        JS_TEST = re.compile(r"(^|/)test/")
        JS_SRC = re.compile(r"\.js$")
        c_js = candidates("expressjs/express", 150, "2026", JS_SRC, JS_TEST)
        print(f"express: {len(c_js)} candidates")
        for c in c_js: print(" ", c["instance_id"], c["merged_at"][:10], c["title"][:60])

        C_TEST = re.compile(r"(^|/)test/")
        C_SRC = re.compile(r"\.[ch]$")
        c_c = candidates("akheron/jansson", 150, "2026", C_SRC, C_TEST)
        print(f"\njansson: {len(c_c)} candidates")
        for c in c_c: print(" ", c["instance_id"], c["merged_at"][:10], c["title"][:60])

        import json
        json.dump(c_js, open("harness/results/mining/express.cands.json", "w"), indent=2)
        json.dump(c_c, open("harness/results/mining/jansson.cands.json", "w"), indent=2)
        EOF
