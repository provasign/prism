    - cmd: |-
        cd /Users/tapabratapal/Projects/provasign/research
        git commit -m "$(cat <<'EOF'
        harness: deny redundant Read calls overlapping prism's own deliveries

        Measured 2026-09-21 (overnight-run/INVESTIGATION.md, jackson-databind
        pr6076): the single largest fixable driver of prism-arm token blowup was
        re-reading content prism already delivered -- 6 native Read calls into a
        file prism had already returned in full via op=read, every one landing
        inside the already-delivered window. The steering instruction ("do not
        re-read unchanged source already included in a Prism result") exists but
        demonstrably doesn't hold up over multi-turn sessions with intervening
        edits/test runs.

        Two new hooks, wired into every prism_init worktree via
        _install_read_guard_hook:
          - PostToolUse on mcp__prism__prism: records (file, from, to) windows
            delivered by op=read into .prism-read-tracker.json.
          - PreToolUse on Read: denies (hookSpecificOutput.permissionDecision=deny)
            a Read whose requested range is >=70% covered by an already-delivered
            window, with a reason pointing back to it. Legitimate pagination past
            the end of a capped delivery (e.g. lines 200-475 after a 1-200 read) is
            never blocked -- only requests that substantially overlap.

        This is enforcement, not advisory text -- the one mechanism this project has
        repeatedly measured to actually change tool-use behavior (prism's own
        --deny-builtin-search history, the deferred-tools steering clause). Both
        hooks verified end-to-end with synthetic stdin against a real worktree
        (pipe-test + jq -e schema validation); not yet measured against a live
        agent run.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_015EeaTQYczmqXMfyKzc1mqD
        EOF
        )"
        git push
