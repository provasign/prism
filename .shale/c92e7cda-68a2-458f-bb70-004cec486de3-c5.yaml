        # Probe A: explicit full MCP tool names in allowedTools. Probe B adds a
        # first-action mandate. Both haiku, same instance, isolated worktrees.
        import json, sys
        from pathlib import Path
        sys.path.insert(0,'.')
        import swebench_ab as ab

        task=[r for r in json.load(open('runs/swebench-live/slice-flask.json'))][0]
        out=Path('runs/swebench-live/haiku-probes'); out.mkdir(exist_ok=True)

        EXPLICIT=["mcp__prism__prism_query","mcp__prism__prism_search","mcp__prism__prism_read",
                  "mcp__prism__prism_lookup","mcp__prism__prism_node","mcp__prism__prism_change_impact"]

        def run(tag, extra_tools, prompt_prefix):
            ab.WT_ROOT=Path(f'/tmp/swebench-wt-{tag}')
            repo=ab.ensure_repo(task['repo'])
            wt=ab.WT_ROOT/f"{task['instance_id']}__prism"
            ab.WT_ROOT.mkdir(parents=True, exist_ok=True)
            ab.sh("git","-C",str(repo),"worktree","prune")
            ab.sh("git","-C",str(repo),"worktree","add","--detach","-f",str(wt),task['base_commit'])
            try:
                ab.sh(str(Path.home()/'bin/prism'),"index",".",cwd=str(wt),timeout=600)
                tools=[t for t in ab.TOOLS_BASE if t not in ab.SEARCH_TOOLS]+["Bash(prism:*)","mcp__prism"]+extra_tools
                steer="\n"+ab.INVESTIGATION_GUIDANCE+"\n"+ab.real_prism_steering()
                prompt=prompt_prefix+ab.BASE_PROMPT.format(repo=task['repo'],problem=task['problem_statement'],steer=steer)
                env=ab.run_agent(prompt,tools,wt,'haiku',mcp=str(ab.MCP_CFG/'prism.json'))
                trace=env.get('tool_trace',[])
                mcp_calls=[t for t in trace if t.startswith('mcp__prism')]
                rec={'tag':tag,'turns':env.get('num_turns'),'cost':env.get('total_cost_usd'),
                     'mcp_prism_calls':mcp_calls,'first6':trace[:6]}
                json.dump(rec,open(out/f'{tag}.json','w'))
                print(tag,'turns',rec['turns'],'cost',round(rec['cost'] or 0,2),'prism MCP calls:',len(mcp_calls), mcp_calls[:3])
            finally:
                ab.sh("git","-C",str(repo),"worktree","remove","--force",str(wt))

        run('probeA-explicit-names', EXPLICIT, "")
        run('probeB-first-action', EXPLICIT,
            "YOUR FIRST ACTION, before anything else: call the MCP tool mcp__prism__prism_query "
            "with task=\"<one sentence of the issue>\" and terms=[\"template_filter\"]. "
            "If it is not in your tool list, first call ToolSearch with query \"select:prism_query\" to load it.\n\n")
        EOF
