    - cmd: |-
        python3 << 'PYEOF'
        path = "internal/mcp/selection.go"
        with open(path, encoding="utf-8") as f:
            lines = f.readlines()

        old_block = lines[208:223]
        new_block = '''\t\t\tif len(perTermSeeds) == 1 {
        \t\t\t\t// One term: no interleave to protect, but the plain
        \t\t\t\t// global promotion this used to be had its own bug --
        \t\t\t\t// discovered 2026-09-02 (django quote_name): an EXACT
        \t\t\t\t// name/qualified-name match (graph rank 100) got pushed
        \t\t\t\t// behind a substring match (geo_quote_name, rank 70)
        \t\t\t\t// because mergeTextSearch's confirmation grep is capped
        \t\t\t\t// (40 hits) and happened to surface the substring
        \t\t\t\t// symbol's own definition lines before the exact
        \t\t\t\t// symbol's -- five geo_quote_name overrides got
        \t\t\t\t// "confirmed" and the real quote_name family, seeded
        \t\t\t\t// correctly at the front by the graph, never did.
        \t\t\t\t// Confirmation is a real signal (two independent hits
        \t\t\t\t// beat one) but must never outrank an exact match on
        \t\t\t\t// the term itself -- pin exact matches first, and let
        \t\t\t\t// confirmation reorder only the remainder.
        \t\t\t\tterm := ""
        \t\t\t\tif len(p.terms) == 1 {
        \t\t\t\t\tterm = strings.ToLower(p.terms[0])
        \t\t\t\t}
        \t\t\t\tvar exact, rest []grove.SymbolRecord
        \t\t\t\tfor _, sd := range seeds {
        \t\t\t\t\tif term != "" && (strings.ToLower(sd.Name) == term || strings.ToLower(sd.QualifiedName) == term) {
        \t\t\t\t\t\texact = append(exact, sd)
        \t\t\t\t\t} else {
        \t\t\t\t\t\trest = append(rest, sd)
        \t\t\t\t\t}
        \t\t\t\t}
        \t\t\t\tconfirmed := make([]grove.SymbolRecord, 0, len(rest))
        \t\t\t\tvar unconfirmed []grove.SymbolRecord
        \t\t\t\tfor _, sd := range rest {
        \t\t\t\t\tif textMerge.confirmed[sd.ID] {
        \t\t\t\t\t\tconfirmed = append(confirmed, sd)
        \t\t\t\t\t} else {
        \t\t\t\t\t\tunconfirmed = append(unconfirmed, sd)
        \t\t\t\t\t}
        \t\t\t\t}
        \t\t\t\tseeds = append(append(exact, confirmed...), unconfirmed...)
        '''.splitlines(keepends=True)

        assert lines[222].strip() == "seeds = append(confirmed, rest...)"
        lines[208:223] = new_block
        with open(path, "w", encoding="utf-8") as f:
            f.writelines(lines)
        print("done")
        PYEOF
      at: 2026-09-02T15:06:24.063819Z
