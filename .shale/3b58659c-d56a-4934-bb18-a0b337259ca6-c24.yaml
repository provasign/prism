    - cmd: |-
        git add internal/mcp/selection.go internal/mcp/selection_test.go internal/mcp/tools.go internal/ranking/signals.go internal/ranking/signals_test.go
        git commit -m "$(cat <<'EOF'
        mcp: fix exact-match seed demotion; drop the dead task param from ranking

        Two independent fixes surfaced investigating a real prism_query miss
        (2026-09-02, django BaseDatabaseOperations.quote_name):

        1. selection.go: the single-term "confirmed" seed promotion did a
           GLOBAL reorder keyed only on whether mergeTextSearch's capped (40
           hits) confirmation grep happened to touch a seed's own definition
           line -- with no floor on the seed's original graph rank. On django,
           geo_quote_name (an unrelated method whose name merely CONTAINS
           "quote_name" as a substring, graph rank 70) got confirmed because
           its files sorted before the real target's in --sort path order and
           consumed the whole cap; the real quote_name family (exact name
           match, rank 100) never got a chance and was demoted below it. Fix:
           an exact name/qualified-name match on the term is pinned ahead of
           the rest before confirmation is allowed to reorder anything --
           confirmation still works as a tie-breaker among inexact matches, it
           just can no longer outrank an exact one. New regression test
           reproduces the exact cap-exhaustion mechanism (not just the
           symptom) deterministically via file-path ordering, and is confirmed
           to fail on the pre-fix code.

        2. Investigating why the free-text task string didn't route this
           correctly surfaced that it structurally couldn't have: task text
           has been intentionally inert for retrieval and ranking since the
           DetectPhase removal (selection.go's own comment says so), and the
           query miss above happened at the term/graph-rank level regardless
           of phrasing. But SignalComputer.Compute still accepted and silently
           ignored a task parameter -- passed from selectContext, referenced
           nowhere in the function body. Removed the parameter entirely rather
           than leave debt that reads as "task text affects ranking" when it
           provably does not. prism_read's tool-schema description for `task`
           claimed the same thing ("used for relevance ranking") while
           compression.Options.Task is already documented in-package as
           deliberately unused by file-read compression -- reworded the
           description to say what actually happens (first read is always
           the complete file) instead of implying a ranking effect that was
           never real for this tool either.

        prism_query's own task description was already accurate ("does not
        affect retrieval, ranking or sizing") and is unchanged. Its `terms`-
        seeded mineTaskIdentifiers fallback (mining identifier-shaped tokens
        out of the task string when explicit terms are weak) is the one place
        task text still does real, deliberate work, and is untouched.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_01HTYLuNJPfgEAXJykbHPpHT
        EOF
        )"
