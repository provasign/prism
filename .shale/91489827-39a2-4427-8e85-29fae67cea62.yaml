        one file, lookup returned the first body and listed the rest as
        "Name (file)" candidates — N identical lines no name/file argument could
        disambiguate. On commons-lang pr1713 the agent fixed only the overload it
        was shown and lost the task; 67/614 benchmark prism sessions hit this
        (79/95 AMBIGUOUS blocks were same-file overloads).

