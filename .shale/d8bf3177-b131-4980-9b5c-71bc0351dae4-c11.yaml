        mcp: graph rollup of a truncated search's full hit set

        When a text search truncates (27% of the 79 real prism_search calls
        replayed from full38 exceed the 25-hit cap; tail runs to 443 hits), the
        result now carries the graph's organization of the ENTIRE hit set alongside
        the sample: an uncapped aggregation pass re-runs the search and groups
        every hit by its innermost enclosing indexed symbol — top 10 symbols with
