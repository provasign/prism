        	return "+" + itoa(nsyms) + " more symbols with " + itoa(nhits) + " hit(s)"
        }

        func itoa(n int) string {
        	if n == 0 {
        		return "0"
        	}
        	neg := n < 0
        	if neg {
        		n = -n
        	}
        	var buf [20]byte
        	i := len(buf)
        	for n > 0 {
        		i--
        		buf[i] = byte('0' + n%10)
        		n /= 10
        	}
        	if neg {
        		i--
        		buf[i] = '-'
        	}
        	return string(buf[i:])
        }''', '''func pluralNote(nsyms, nhits int) string {
