    - cmd: |-
        git add README.md internal/cli/commands.go internal/cli/assets/ internal/cli/readguard.go internal/cli/readguard_test.go && git commit -m "$(cat <<'EOF'
        feat(init): add --read-guard / --no-read-guard for the read-guard hook

        Ships the hook that was measured harness-side on 2026-09-22 (13-task
        controlled A/B: ~11% fewer tokens, no change in resolve rate) as an actual
        product feature instead of a benchmark-only artifact.

        `prism init --read-guard <dir>` writes .claude/hooks/prism_read_tracker.py
        and prism_read_guard.py (embedded in the binary) and registers them in
        .claude/settings.json (PostToolUse on mcp__prism__prism, PreToolUse on
        Read). `prism init --no-read-guard <dir>` removes exactly what install
        added -- the two scripts, .prism-read-tracker.json, and only the
        settings.json entries whose command is prism's own, leaving any of the
        user's own hooks on the same matchers untouched. Both are standalone
        actions, like --print-config: they don't require harness selection.

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
        Claude-Session: https://claude.ai/code/session_015EeaTQYczmqXMfyKzc1mqD
        EOF
        )"
        git log --oneline -1
