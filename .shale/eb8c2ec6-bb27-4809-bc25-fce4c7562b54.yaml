        import statistics
        xs=[r[0] for r in rows]; ys=[r[1] for r in rows]
        n=len(xs)
        mx=sum(xs)/n; my=sum(ys)/n
        cov=sum((x-mx)*(y-my) for x,y in zip(xs,ys))/n
        sx=statistics.pstdev(xs); sy=statistics.pstdev(ys)
        print('n=',n,'corr(calls,tokens)=', cov/(sx*sy))
        "
