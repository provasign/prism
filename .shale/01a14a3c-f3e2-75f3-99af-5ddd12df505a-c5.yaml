            vals.append(statistics.median(r['ms'] for r in d['rows'] if (r['phase'],r['op'],r['repo'],r['arm'])==(phase,op,repo,arm)))
          label={'unindexed_first':'First lookup, no index','indexed_first':'First lookup, existing index','resident':op}[phase]
          rows.append('| '+label+' | '+' | '.join(f'{v:.2f}' for v in vals)+' |')
        report='''# CLI versus MCP latency on small repositories

        Measured 2026-10-17. Local timing only: **zero model API calls**.

        ## Result

        **MCP was faster once ready; CLI saved roughly 7–9 ms on the first lookup with an existing index.** Starting without an index was similar between the transports. These measurements do not support automatically choosing CLI based on a small repository size.

        For occasional one-shot use, CLI is a reasonable option. For repeated use during a coding session, resident MCP has lower local latency. The absolute difference was about 10–23 ms per subsequent call in this sample, not seconds.

        | Operation / phase | Tiny Python CLI, ms | Tiny Python MCP, ms | Chi CLI, ms | Chi MCP, ms |
        |---|---:|---:|---:|---:|
        '''+ '\n'.join(rows)+'''

        All values are medians. There are 3 unindexed first-use samples, 5 indexed first-use samples, and 8 ready-state samples per operation and transport: **192 measured calls** total, excluding preparation/warmup.

        ## Method

        - Same frozen executable for CLI and MCP: candidate used in today's corrected agent comparison, SHA256 `6a539ae62cab737a4424dfd71859a9c304938d85b66bd08177fc7542bbefc9f8`. Its version string is `prism dev`; the hash identifies it. This is not Claude's concurrently edited working tree.
        - Chi snapshot: commit `3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc`, 84 Go files / 12,459 source lines, including tests and examples. Tiny synthetic Python: 3 source files / 29 lines. Both are isolated snapshots under `/private/tmp`; original checkouts were not changed.
        - First-use MCP time includes process launch, initialization, tools/list, and receiving the lookup result. CLI time includes process launch, receiving output, and process exit. MCP shutdown is excluded because a coding host normally keeps it running. MCP initialization plus tools/list was approximately 9 ms with an existing index.
        - Unindexed means no Prism index and a fresh process. It does **not** mean an empty OS page cache or empty Go build cache. Toolchain cache was shared. Fresh snapshots were created for first-use trials, and arm order was seeded and interleaved.
        - Ready MCP measurements initialize a fresh server and complete an unrelated, no-result search to wait for indexing, then time one requested operation. No measured request repeats a previous delivery in that session. CLI starts a fresh process per command on an existing index. This isolates engine/transport reuse without crediting session-pointer replies as full answers.
        - Equivalent operations and arguments were used; CLI requests text output. Output rendering is not identical, as described below. Source-read and lookup results were inspected, and both Chi impact answers contain the same seven symbol sites.
        - Measurements use Python subprocesses and direct MCP stdio on this Mac with Go 1.26.3. They exclude the coding host's shell launcher, approval handling, tool scheduling, model generation, and network/provider latency. The machine was shared with ongoing work; these are local observations, not universal latency guarantees.
        - The initial sandboxed pass blocked Go build-cache writes and produced an incomplete graph. It was discarded. The reported pass ran with approved cache access; status confirms Go compiler analysis completed (1,201 native call edges plus other native evidence). Tiny Python used inferred static analysis and correctly reports partial coverage.
        - A preliminary pointer detector also matched a documentation sentence explaining cached pointers. It was corrected to detect actual pointer lines. Preliminary diagnostics are outside this dataset.

        ## Output parity matters before switching agents to CLI

        On this binary, `prism change-impact Routes.Match --format text` and MCP both find seven symbol sites. However, CLI text returns about **1,537 bytes** without the exact `editSites` list or per-call positions. MCP returns **3,570 bytes**, including eight declaration/call occurrences with line and column positions and the other-mention partition.

        The tiny Python impact answer shows the same rendering difference. Thus CLI's smaller text is not automatically equivalent evidence delivered more cheaply. The missing exact-site representation is one of the features previously measured to reduce follow-up work. This is specifically a finding about the tested CLI **text renderer**, not proof that the engine or CLI JSON lacks those fields.

        Before a CLI-only agent experiment, bring the CLI text renderer to evidence parity with MCP, or deliberately choose and verify another existing output format. Then compare agent outcomes and dollars. Merely changing transport while dropping helpful evidence would confound the experiment.

        ## Cost interpretation

        Latency and model billing are separate. CLI could reduce model input if a CLI-only installation omits MCP tool definitions and uses compact CLI guidance. That requires changing the effective agent configuration; calling CLI while MCP remains registered does not establish a schema saving. Command strings, CLI guidance, error recovery, output size, and extra model requests still count.

        This run measured no billed-token or dollar saving. A paid agent A/B would need explicit approval. Repository size alone is not a sound routing threshold from these results; usage frequency and output parity are more relevant candidates.

        ## Artifacts and reproduction

        - [Raw timings and configuration](results.json)
        - [Exact runner](bench.py)
        - [Fixture metadata](fixtures.json)
        - [Source snapshots](fixtures.tar.gz)
        - [All measured full answers, compressed JSONL](outputs.jsonl.gz)

        For reproduction, use a new scratch directory, copy `bench.py` and `fixtures.json` there, extract `fixtures.tar.gz` to create `sources/`, and provide the binary with the recorded SHA256 as `prism`. Run `python3 bench.py` with access to a writable Go build cache. The runner makes no model calls or network requests; `GOPROXY=off` and `GOTOOLCHAIN=local` are set. Results are written in that scratch directory. The archived results replace temporary output paths with records in the compressed answers file.

        No Prism implementation, installed agent configuration, or Claude work was changed. This report and its artifacts are uncommitted.
        '''
