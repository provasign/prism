            "pallets__click__pr3533", "urllib3__urllib3__pr3786",
        ]

        def load(tid, tag):
            f = f"runs/e2e/{tid}.opus.prism_native.{tag}.json"
            try:
                d = json.load(open(f))
                return d.get("cost_usd") or 0, d.get("turns") or 0, d.get("resolved")
            except FileNotFoundError:
                return None, None, None

        ref_cost = cap_cost = hook_cost = 0
        ref_turns = cap_turns = hook_turns = 0
        n = 0
        for tid in TASKS:
            rc, rt, rr = load(tid, "rerun-v061")
            cc, ct, cr = load(tid, "e0-capisolate")
            # hook: use fixed-hook variant for the two rerun ones, else e1-subst
            hc, ht, hr = load(tid, "e1-subst-hookfix")
            if hc is None:
                hc, ht, hr = load(tid, "e1-subst")
            if None in (rc, cc, hc): continue
            n += 1
            ref_cost += rc; cap_cost += cc; hook_cost += hc
            ref_turns += rt; cap_turns += ct; hook_turns += ht
            print(f"{tid:32} ref=${rc:.2f} cap=${cc:.2f}({(cc/rc-1)*100:+.0f}%) hook=${hc:.2f}({(hc/rc-1)*100:+.0f}%)")

        print(f"\nn={n} tasks")
        print(f"reference (uncapped, no hook): ${ref_cost:.2f}, {ref_turns} turns")
        print(f"cap-only (v0.61.1, no hook):   ${cap_cost:.2f}, {cap_turns} turns  ({(cap_cost/ref_cost-1)*100:+.1f}% cost, {(cap_turns/ref_turns-1)*100:+.1f}% turns)")
        print(f"hook (v0.61.1 + subst hook):   ${hook_cost:.2f}, {hook_turns} turns  ({(hook_cost/ref_cost-1)*100:+.1f}% cost, {(hook_turns/ref_turns-1)*100:+.1f}% turns)")
        EOF
