        			break
        		}
        		extra := len(best.children) + len(best.files) - 1
        		if lines+extra > inventoryLineBudget {
        			// Try a smaller group before giving up: drop this one from
        			// consideration by marking it unsplittable.
        			best.children, best.files = nil, append(best.files, "\\x00"+strconv.Itoa(best.count()))
        			continue
        		}
        		frontier = append(frontier[:bi], frontier[bi+1:]...)
        		for _, ch := range best.children {
        			frontier = append(frontier, ch)
        		}
        		for _, f := range best.files {
        			frontier = append(frontier, &invNode{files: []string{f}})
        		}
