        		var best *invNode
        		bi := -1
        		for i, n := range frontier {
        			// A group is splittable when it has more than one child entry
        			// and is dense enough that its parts are worth naming.
        			if len(n.children)+len(n.files) > 1 && n.count() >= 3 && (best == nil || n.count() > best.count()) {
        				best, bi = n, i
        			}
        		}
