        	// (and any files at the root). Refine the largest splittable group while
        	// the extra lines fit the budget.
        	var frontier []*invNode
        	for _, ch := range root.children {
        		frontier = append(frontier, ch)
        	}
        	lines := len(frontier) + len(root.files)
