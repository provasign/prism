        p=subprocess.Popen([binary,"mcp"],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
        def send(o): p.stdin.write(json.dumps(o)+"\n"); p.stdin.flush()
        def recv(i):
            while True:
                l=p.stdout.readline()
                if not l: return None
                try: j=json.loads(l)
                except: continue
                if j.get("id")==i: return j
        send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"x","version":"0"}}}); recv(1)
        send({"jsonrpc":"2.0","method":"notifications/initialized"})
        send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}); j=recv(2)
        tools=j["result"]["tools"]; print("SCHEMA: %d tools, %d chars (~%d tokens)"%(len(tools),sum(len(json.dumps(t)) for t in tools),sum(len(json.dumps(t)) for t in tools)//4))
        for i,(name,args) in enumerate(calls,start=10):
            send({"jsonrpc":"2.0","id":i,"method":"tools/call","params":{"name":name,"arguments":args}}); j=recv(i)
            text="".join(c.get("text","") for c in j["result"].get("content",[]))
            lines=text.split("\n")
            print(f"\n### {name} {json.dumps(args)[:90]} -> {len(text)} chars, {len(lines)} lines")
            print("\n".join(l[:120] for l in lines[:6])); print("   ..."); print("\n".join(l[:120] for l in lines[-8:]))
        p.kill()
        EOF
