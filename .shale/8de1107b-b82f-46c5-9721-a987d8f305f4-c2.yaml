        		key  string
        		text string
        	}
        	var out []line
        	grouped := 0
        	for _, n := range frontier {
        		if len(n.files) == 1 && n.children == nil && n.path == "" {
        			out = append(out, line{n.files[0], entry(n.files[0])})
        			continue
        		}
        		c := n.count()
        		if len(n.files) > 0 && strings.HasPrefix(n.files[len(n.files)-1], "\\x00") {
        			// unsplittable marker: real count is in the marker
        			c, _ = strconv.Atoi(n.files[len(n.files)-1][1:])
        			c += len(n.files) - 1
        		}
