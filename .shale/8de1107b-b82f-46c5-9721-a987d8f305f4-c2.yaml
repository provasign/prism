        // inventoryLineBudget lines. Returns the lines and a sentence describing
        // their shape.
        func boundedInventory(files []string, hits map[string]int) ([]string, string) {
        	entry := func(f string) string {
        		if n, ok := hits[f]; ok {
        			return f + " (" + strconv.Itoa(n) + ")"
        		}
        		return f
        	}
