    - cmd: |-
        cd ~/Projects/provasign/research/harness && python3 - <<'EOF'
        import json, glob, re
        from collections import defaultdict

        JAVA_REPOS = ("commons-collections", "jackson-databind", "guava", "junit4", "mockito", "gson")

        rows = defaultdict(list)
        for f in glob.glob("runs/e2e/*.json"):
            m = re.match(r"runs/e2e/([^_]+(?:__[^_]+)*)__(.+)\.([a-z]+)\.([a-z_0-9]+?)(?:\.t(\d+))?\.json$", f)
            if not m: continue
            try: d = json.load(open(f))
            except Exception: continue
            model, arm = d.get("model"), d.get("arm")
            if model != "opus": continue
            if arm not in ("baseline", "prism_source"): continue
            task = d.get("task", "")
            if not any(r in task for r in JAVA_REPOS): continue
            rows[(model, arm)].append(d)

        # Per-task best-of-trials pairing (each task ran 2 trials per arm).
        by_task = defaultdict(dict)
        for (model, arm), cells in rows.items():
            for c in cells:
                by_task[c["task"]].setdefault(arm, []).append(c)

        print(f"{'task':45} {'baseline':>10} {'prism':>10}")
        b_resolved = p_resolved = 0
        n = 0
        for task, arms in sorted(by_task.items()):
            if "baseline" not in arms or "prism_source" not in arms: continue
            n += 1
            b = any(c["resolved"] for c in arms["baseline"])
            p = any(c["resolved"] for c in arms["prism_source"])
            b_resolved += b; p_resolved += p
            flag = "  <-- prism wins" if p and not b else ("  <-- baseline wins" if b and not p else "")
            print(f"{task:45} {str(b):>10} {str(p):>10}{flag}")

        print(f"\nn={n} tasks (any-trial-resolved) | baseline {b_resolved}/{n} ({b_resolved/n:.0%}) | prism {p_resolved}/{n} ({p_resolved/n:.0%})")

        # Cell-level (both trials counted)
        tb = sum(1 for c in rows[("opus","baseline")] if c["resolved"]); nb = len(rows[("opus","baseline")])
        tp = sum(1 for c in rows[("opus","prism_source")] if c["resolved"]); npr = len(rows[("opus","prism_source")])
        print(f"cell-level: baseline {tb}/{nb} ({tb/nb:.0%}) | prism {tp}/{npr} ({tp/npr:.0%})")
        EOF
