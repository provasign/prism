        fix(search): name every matching file when text lines are sampled

        A sampled text search showed 25 lines plus a rollup of the densest
        enclosing symbols, so sparse matching files were named nowhere
        (jackson-databind pr5977: staticTyping, 147 matches in 31 files; the fix
        file ObjectArraySerializer.java never appeared and the agent submitted an
        empty diff while grep found it).

        When a term's text lines are truncated (scope text, and the text half of
        scope both), the response now carries a file inventory: every matching
        file once, grouped by directory, with its hit count. Counts come from the
        adaptive count pass (textsearch.Result.FileCounts) or a bounded 2s count
        pass otherwise. Past 80 files the highest-hit files are listed and the
        rest roll up by directory. The shared response budget re-fits sample
        lines around the inventory, and attaches one when it hides whole files of
        a complete result. Unsampled results are unchanged.

        Real query (3 terms, compact MCP): 14,850 -> 15,027 bytes; the file is
        now named.

