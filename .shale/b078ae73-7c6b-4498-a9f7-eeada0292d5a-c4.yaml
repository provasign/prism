        // A search window that ends on a call hands over the callee's body, and the
        // read for the rest of the enclosing function is labelled by direction
        // (jackson-databind pr6030, 2026-10-12: the window ended on
        // `_verifyNoUnwrappedPropertyConflict(ctxt);` and offered only the earlier lines).
        func TestSearchWindowAttachesNextInFlowCallee(t *testing.T) {
        	var big strings.Builder
        	big.WriteString("package ex\n\nfunc resolve(n int) int {\n\ttotal := 0\n")
        	for i := 0; i < 200; i++ {
        		fmt.Fprintf(&big, "\ttotal += n * %d\n", i)
        	}
        	big.WriteString("\t// issue-2883: verify the result before returning\n\tverifyNoConflict(total)\n\treturn total\n}\n\n")
        	big.WriteString("func verifyNoConflict(total int) {\n\tif total < 0 {\n\t\tpanic(\"Conflict between unwrapped property\")\n\t}\n}\n")
        	srv := compactFixture(t, map[string]string{
        		"go.mod":  "module ex\n\ngo 1.22\n",
        		"main.go": big.String(),
        	})
        	got := callCompact(t, srv, "search", map[string]any{"terms": []any{"issue-2883"}, "scope": "text"})
        	if !strings.Contains(got, "next in flow: verifyNoConflict") ||
        		!strings.Contains(got, "// NEXT IN FLOW: line 206 calls verifyNoConflict") ||
        		!strings.Contains(got, `panic("Conflict between unwrapped property")`) ||
        		!strings.Contains(got, "earlier lines: op=read") || strings.Contains(got, "rest: op=read") {
        		t.Fatalf("window did not hand over the callee or label the read direction:\n%s", got)
        	}
        }
        EOF
