sion'],c['ticket']),[]).append(i)\ndef run(k):\n    idxs=groups[k]; c0=calls[idxs[0]]\n    d=f\"{S}/co/{k[0]}-{k[1]}-{k[2]}\"\n    if not os.path.exists(d):\n        subprocess.run(['git','clone','-q','--local','--no-checkout',c0['repo'],d],check=True)\n        subprocess.run(['git','-C',d,'checkout','-q',c0['base']],check=True)\n    res={}\n    for b in ('old','new'):\n        res[b]=mcp_session(BINS[b],d,[calls[i]['args'] for i in idxs],f\"{d}.{b}.log\")\n    for j,i in enumerate(idxs): calls[i]['old']=res['old'][j]; calls[i]['new']=res['new'][j]\n    print('done',k,flush=True)\nos.makedirs(S+'/co',exist_ok=True)\nwith ThreadPoolExecutor(4) as ex: list(ex.map(run,list(groups)))\njson.dump(calls,open(S+'/replayed.json','w'),indent=1)\nEOF\ncd $S && python3 replay.py > replay.log 2>&1 &\necho started"
