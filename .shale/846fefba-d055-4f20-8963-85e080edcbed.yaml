        import os,re,subprocess
        def scan(pat, word=False):
            rx = re.compile(r'\b'+pat+r'\b' if word else pat)
            out=[]
            for root,dirs,files in os.walk('.'):
                dirs[:] = [d for d in dirs if d not in ('.git','.shale','.cache','node_modules','.grove')]
                for f in files:
                    if not f.endswith(('.go','.md','.py','.ts','.js','.json','.yaml')): continue
                    p=os.path.join(root,f)
                    try: lines=open(p,errors='ignore').read().split('\n')
                    except: continue
                    for i,l in enumerate(lines,1):
                        if rx.search(l): out.append(f"{p}:{i}:{l}")
            return out
        for pat in ["hookDenyReason","Reason","func "]:
            hits=scan(pat, word=(pat!="func "))
            raw="\n".join(hits)
            print(f"--- pattern {pat!r}: {len(hits)} hits, raw grep bytes={len(raw)} (~{len(raw)//4} tok)")
