        git tag -a v0.55.2 -m "v0.55.2 — prism_search text-scope responses are plain text, not JSON

        MCP content is free-form text; JSON was never required, only what this
        server sent by default. A pure-text search result now renders as plain
        path:line: text lines instead of a JSON-encoded map.

        Measured (old vs new binary, identical corpus, real protocol call):
          query \"func \"       -22% (586B)
          query \"stringsArg\"  -15% (253B)
          query \"Handler\"      -3%  (76B)
          query \"search text\"  -45% (88B)
        Never a regression across four real queries. prism_search is the
        highest-call-count tool measured (637 calls / 190 cells), and every
        result sits in the session cache for the rest of the run, so the saving
        compounds on every later turn rather than being paid once.

        Falls back to JSON for scope=symbols/both (structured data that would
        lose information if flattened) and for any field the renderer does not
        recognise, rather than risk silently dropping content.

        Smoke-tested on 5 paired SWE-bench-Live cells: correctness unaffected
        (3/5 both arms, no flips), zero contamination, zero denials. Cost/turns
        stayed flat at the median, consistent with the change's own expected
        value — it removes a fixed per-call cost, it does not change what the
        agent does.

        Gate: go vet + go test ./... green (8 new tests); ci_invariants.py green."
        git push origin v0.55.2 2>&1 | tail -2
