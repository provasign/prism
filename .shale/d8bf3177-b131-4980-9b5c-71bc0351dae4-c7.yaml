        schema, the CLI (--context N / -C), and both text renderers (the plain
        grep-style path shipped in 889856b, and the CLI's printTextMatches used
        by prism_query too). A cached file (already delivered whole this session)
        skips context by design -- the agent already has the surrounding lines
        from the earlier full read.

