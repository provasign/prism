        for free, which costs prism nothing either way). That undersold it — the
        real cost is the two-call case: prism_search finds a line, then a
        follow-up ranged prism_read pulls the surrounding lines. Measured in
        today's traces: 13 occurrences of exactly that sequence.

        Sized directly, old two-call vs new one-call, real protocol, same corpus:

            prism_search:            611B
            prism_read(ranged):      985B   -- a full second JSON envelope
            TWO round trips                 1,596B total

            prism_search(context=10) ONE call                  1,152B  (-28%)

        Real, mechanism-backed saving: one fewer tool round trip, one fewer cache
        entry paid on every later turn -- not just gap-closing.

        IMPLEMENTATION NOTE, the one worth remembering: context is NOT built via
        each backend's own -A/-B/-C. rg's context lines use a "-" separator
        instead of ":", GNU grep's differs again, and both insert "--"
        group-separator lines between non-contiguous context blocks -- three text
        formats to parse correctly, with real divergence risk between rg and the
        native fallback (the exact failure class this package already forbids for
        scoping and hidden-file handling, per its own comments). Instead,
        Search() resolves the match set exactly as it always has, then
        attachContext() reads each hit's file directly and slices the window --
        one code path, identical behaviour on every backend, by construction.
        Verified by TestSearch_ContextIdenticalAcrossBackends.

