<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 27H3z' fill='%234f46e5'/%3E%3Cpath d='M16 3 21 27H11z' fill='%23818cf8'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f8fa; --canvas: #fbfbfd; --grid: #e6e8ee; --surface: #ffffff; --surface-2: #f3f4f7; --line: #e3e6ec; --line-strong: #d0d5de;
  --text: #0f172a; --text-2: #475569; --muted: #8590a2;
  --accent: #4f46e5; --accent-2: #eef0ff;
  --edge: #b7bfcc; --in: #ea580c; --out: #4f46e5;
  --ok: #059669; --ok-bg: #ecfdf5; --warn: #b45309; --warn-bg: #fffbeb;
  --r-target: #e11d48; --r-family: #9333ea; --r-site: #ea580c; --r-trans: #d4a017;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.05);
  --shadow-lg: 0 24px 60px rgba(15,23,42,.18), 0 6px 18px rgba(15,23,42,.10);
  --label-halo: rgba(251,251,253,.92); --code-bg: #f7f8fb;
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d12; --canvas: #0d1016; --grid: #1a1f29; --surface: #12161e; --surface-2: #181d27; --line: #232a36; --line-strong: #2f3846;
    --text: #e8ecf3; --text-2: #b4bfcf; --muted: #7c8799;
    --accent: #818cf8; --accent-2: #1e1f3d;
    --edge: #465063; --in: #fb923c; --out: #818cf8;
    --ok: #34d399; --ok-bg: #0c2a20; --warn: #fbbf24; --warn-bg: #2b2108;
    --r-target: #fb7185; --r-family: #c084fc; --r-site: #fb923c; --r-trans: #facc15;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 4px 14px rgba(0,0,0,.45); --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
    --label-halo: rgba(13,16,22,.9); --code-bg: #0f131a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; }
.logo svg { width: 22px; height: 22px; }
.logo small { font-weight: 500; color: var(--muted); font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; margin-left: 2px; }
.vsep { width: 1px; height: 22px; background: var(--line); flex: none; }
.repo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.repo b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.repo .stat { color: var(--muted); font-size: 12px; white-space: nowrap; }
.cmdk { margin-left: auto; display: flex; align-items: center; gap: 8px; width: min(380px, 34vw); height: 34px; padding: 0 8px 0 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--muted); text-align: left; transition: border-color .15s, background .15s; }
.cmdk:hover { border-color: var(--line-strong); background: var(--surface); }
.cmdk span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 11px/1 var(--font); color: var(--text-2); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; background: var(--surface); }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text-2); font-weight: 500; white-space: nowrap; transition: border-color .15s, color .15s; }
.iconbtn:hover { border-color: var(--line-strong); color: var(--text); }
.iconbtn:disabled { opacity: .5; cursor: default; }
.iconbtn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.subbar { height: 46px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
#crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; flex: 1 1 auto; overflow: hidden; white-space: nowrap; }
#crumbs button { background: none; border: 0; padding: 4px 7px; border-radius: 6px; color: var(--text-2); max-width: 240px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
#crumbs button:hover { background: var(--surface-2); color: var(--text); }
#crumbs button.cur { color: var(--text); font-weight: 600; cursor: default; background: none; }
#crumbs .sep { color: var(--line-strong); padding: 0 1px; }
#crumbs .home { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; flex: none; }
.seg[hidden] { display: none; }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 6px; color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg button:disabled { opacity: .45; cursor: default; }
.seg button .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--r-target); }
.switch { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-weight: 500; background: none; border: 0; padding: 4px 2px; white-space: nowrap; }
.switch .track { width: 28px; height: 16px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(12px); }
.switch:disabled { opacity: .45; cursor: default; }
.ctl-group { display: flex; align-items: center; gap: 14px; flex: none; }

main { flex: 1; display: flex; min-height: 0; }
#stage { position: relative; flex: 1; min-width: 0; background: var(--canvas); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#c.drag { cursor: grabbing; }
#c.point { cursor: pointer; }
.float { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow-md); }
#legend { left: 14px; bottom: 14px; padding: 8px; min-width: 172px; max-height: calc(100% - 80px); overflow: auto; }
#legend h4 { margin: 2px 6px 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
#legend button { display: flex; width: 100%; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 6px; border-radius: 6px; text-align: left; color: var(--text); }
#legend button:hover { background: var(--surface-2); }
#legend button.off { opacity: .4; }
#legend button.off .lbl { text-decoration: line-through; }
#legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#legend .sw.sq { border-radius: 3px; }
#legend .sw.ring { background: transparent !important; border: 2px dashed; }
#legend .n { color: var(--muted); margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; font-size: 12px; }
#legend .note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; padding: 5px 6px 2px; border-top: 1px solid var(--line); margin-top: 5px; }
#legend .note i { width: 18px; border-top: 2px dashed var(--muted); flex: none; }
#zoom { right: 14px; bottom: 14px; display: flex; flex-direction: column; padding: 3px; }
#zoom button { width: 30px; height: 30px; border: 0; background: none; border-radius: 7px; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
#zoom button:hover { background: var(--surface-2); color: var(--text); }
#zoom hr { border: 0; border-top: 1px solid var(--line); margin: 2px 4px; }
#minimap { right: 62px; bottom: 14px; width: 172px; height: 116px; overflow: hidden; cursor: pointer; }
#minimap canvas { width: 100%; height: 100%; display: block; }
#status { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; padding: 5px 12px; font-size: 12px; color: var(--text-2); white-space: nowrap; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; border-radius: 999px; }
#status:empty { display: none; }
#tip { position: absolute; pointer-events: none; display: none; padding: 8px 10px; font-size: 12px; max-width: 360px; z-index: 5; border-radius: 9px; }
#tip b { display: block; font-weight: 600; overflow-wrap: anywhere; }
#tip span { color: var(--text-2); display: block; overflow-wrap: anywhere; }
#tip em { color: var(--muted); font-style: normal; display: block; margin-top: 3px; font-size: 11.5px; }
#tip em:empty { display: none; }
#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: color-mix(in srgb, var(--canvas) 70%, transparent); z-index: 6; }
#overlay.on { display: flex; }
#overlay .card { max-width: 440px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-md); }
#overlay .card h3 { margin: 10px 0 6px; font-size: 15px; }
#overlay .card p { margin: 0 0 14px; color: var(--text-2); overflow-wrap: anywhere; }
#overlay .badge { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--warn-bg); color: var(--warn); }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }

aside { width: 404px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.insp-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.insp-title { display: flex; gap: 11px; align-items: flex-start; }
.kbadge { width: 34px; height: 34px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; font: 600 14px/1 var(--mono); color: #fff; }
.insp-title h2 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; line-height: 1.3; }
.insp-title .path { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.copy { border: 0; background: none; color: var(--muted); padding: 2px; border-radius: 4px; display: inline-flex; }
.copy:hover { color: var(--text); background: var(--surface-2); }
.copy svg { width: 13px; height: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; font-weight: 500; }
.chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 500; white-space: nowrap; font-size: 12.5px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.impact { background: var(--r-target); border-color: var(--r-target); color: #fff; }
.btn.primary:hover, .btn.impact:hover { filter: brightness(1.08); }
.btn.primary:hover { background: var(--accent); } .btn.impact:hover { background: var(--r-target); }
.btn svg { width: 14px; height: 14px; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { border: 0; background: none; padding: 10px 8px; margin-bottom: -1px; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 0 6px; }
.insp-body { flex: 1; overflow: auto; padding: 14px 18px 22px; }
.sec { margin-bottom: 18px; }
.sec h3 { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; }
.sec h3 .n { margin-left: auto; letter-spacing: 0; font-weight: 500; text-transform: none; font-size: 11.5px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 18px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface); }
.tile .v { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .k { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
.tile .k i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.verdict { display: flex; gap: 10px; border-radius: 10px; padding: 10px 12px; border: 1px solid; margin-bottom: 14px; }
.verdict.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.verdict.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.verdict svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.verdict.ok svg { color: var(--ok); }
.verdict.warn svg { color: var(--warn); }
.verdict b { display: block; font-weight: 600; }
.verdict span { color: var(--text-2); font-size: 12px; display: block; overflow-wrap: anywhere; }
.verdict details { margin-top: 4px; font-size: 12px; color: var(--text-2); }
.verdict summary { cursor: pointer; color: var(--muted); }
.sig { font: 12px/1.55 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; color: var(--text); }
.doc { color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
ul.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
ul.list li { display: flex; gap: 9px; align-items: center; padding: 7px 10px; cursor: pointer; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list li:hover { background: var(--surface-2); }
.gl { width: 20px; height: 20px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; font: 600 10.5px/1 var(--mono); color: #fff; }
ul.list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
ul.list .nm small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
ul.list .w { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.more { color: var(--muted); font-size: 12px; margin-top: 6px; }
.filegroup { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.filegroup header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--surface-2); font-weight: 550; font-size: 12px; }
.filegroup header svg { width: 14px; height: 14px; color: var(--muted); }
.filegroup header span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; min-width: 0; }
.filegroup header em { font-style: normal; color: var(--muted); font-weight: 500; flex: none; }
.site { display: grid; grid-template-columns: 42px 1fr; gap: 0 8px; padding: 6px 10px; border-top: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.site:hover { background: var(--surface-2); }
.site .ln { font: 11.5px var(--mono); color: var(--muted); text-align: right; }
.site .who { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 500; }
.site .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site .who i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.site .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; flex: none; }
.site code { grid-column: 2; font: 11.5px/1.5 var(--mono); color: var(--text-2); white-space: pre; overflow: hidden; text-overflow: ellipsis; display: block; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; margin: 0; overflow: auto; font: 12px/1.6 var(--mono); tab-size: 4; }
pre.code div { display: flex; }
pre.code .ln { flex: none; width: 50px; padding-right: 12px; text-align: right; color: var(--muted); user-select: none; }
pre.code .tx { white-space: pre; padding-right: 12px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.8; }
.hint kbd { font-size: 10.5px; padding: 2px 4px; }
.empty { color: var(--muted); padding: 6px 0; margin: 0; }

#palette { position: fixed; inset: 0; z-index: 30; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; background: rgba(15,23,42,.32); backdrop-filter: blur(2px); }
#palette.open { display: flex; }
.pal { width: min(640px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.pal-in svg { color: var(--muted); width: 18px; height: 18px; }
#q { flex: 1; height: 52px; border: 0; outline: none; background: none; font-size: 15px; }
#hits { list-style: none; margin: 0; padding: 6px; max-height: 56vh; overflow: auto; }
#hits .grp { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
#hits .hit { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
#hits .hit.on { background: var(--accent-2); }
#hits .gl { width: 22px; height: 22px; font-size: 11px; }
#hits .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
#hits .where { color: var(--muted); font-size: 12px; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; flex: 0 20 auto; min-width: 60px; }
#hits .none { padding: 18px 10px; color: var(--muted); text-align: center; }
.pal-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; background: var(--surface-2); flex-wrap: wrap; }
.pal-foot span { display: inline-flex; gap: 5px; align-items: center; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s; background: var(--text); color: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 500; z-index: 40; pointer-events: none; box-shadow: var(--shadow-md); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) { .repo .stat { display: none; } aside { width: 340px; } }
@media (max-width: 860px) { .logo small { display: none; } #minimap { display: none; } }
@media (max-width: 700px) {
  main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); height: 44%; }
  .subbar { height: auto; flex-wrap: wrap; padding: 6px 12px; } #crumbs { flex-basis: 100%; }
  .repo, .vsep, #reload span { display: none; } .cmdk { width: auto; flex: 1; }
}
</style>
</head>

/* ---------- state <-> URL ---------- */

function overlay(kind, title, text, actions) {
  const box = $("overlay"), card = box.firstElementChild;

  else {
    card.append(el("div", { class: "badge" }, icon("alert")), el("h3", null, title), el("p", null, text));
    for (const [label, fn] of actions || []) card.append(el("button", { class: "btn primary", onclick: fn }, label));

/* ---------- build + layout ---------- */
function radius(n) {

    if (n.id.startsWith("g:")) return Math.max(11, Math.min(26, 9 + 2.4 * Math.sqrt(n.symbols || 1)));
    return n.role === "transitive" ? 9 : Math.max(11, Math.min(18, 10 + 1.3 * Math.sqrt(n.in + n.out)));

  if (n.type === "symbol") return Math.max(n.focus ? 18 : 9, Math.min(26, 8 + 1.8 * Math.sqrt(n.in + n.out)));

}
function build(g) {
  S.byId = new Map(); S.adj = new Map(); S.rings = null;
  const isSym = S.mode === "deps" && g.scope.type === "symbol";

    const synthetic = ks.length === 1 && (ks[0] === "same-change" || ks[0] === "accesses");

// Impact layout: concentric rings with the change at the centre; each ring
// is sorted by path so one package's sites sit together.
function layoutRings() {
  const rings = [[], [], [], []];

    const need = ns.reduce((s, n) => s + n.r * 2 + 40, 0) / (2 * Math.PI - 0.9);

    ns.sort((a, b) => (a.path || "").localeCompare(b.path || "") || (a.line || 0) - (b.line || 0));

q.addEventListener("keydown", e => {
  e.stopPropagation(); // the palette owns its keys; never fall through to graph shortcuts
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); closePalette(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!hits.length) return;
    e.preventDefault(); hitIx = (hitIx + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length; renderHits();
  } else if (e.key === "Enter") { e.preventDefault(); if (hits[hitIx]) choose(hits[hitIx], e.shiftKey); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
});

window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.classList.contains("open") ? closePalette() : openPalette(); return; }
  if (pal.classList.contains("open") || e.metaKey || e.ctrlKey || e.altKey || e.target instanceof HTMLInputElement) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (e.key === "Escape") select(null);
  else if (e.key === "f") fit(true);
  else if (e.key === "+" || e.key === "=") zoomBy(1.35);
  else if (e.key === "-") zoomBy(1 / 1.35);
  else if (e.key === "i") { const id = S.sel && !S.sel.a && S.sel.id.startsWith("s:") ? S.sel.id : S.scope.startsWith("s:") ? S.scope : null; if (id && S.meta?.canImpact) impactOf(id); }
  else if (e.key === "u" || e.key === "Backspace") { const up = parentScope(); if (up !== null) go(up); }
  else if (e.key === "Enter" && S.sel && !S.sel.a && !S.sel.focus) S.mode === "impact" ? impactOf(S.sel.id) : go(S.sel.id);
});

/* ---------- start ---------- */
(async function start() {
  readHash();
  syncTools();
  try { S.meta = await api("/api/meta"); }
  catch (e) { overlay("error", "Cannot reach the Prism graph server", e.message + " — is `prism graph` still running?"); return; }
  renderRepo(); renderCrumbs(); syncTools();
  load();
})();
</script>
