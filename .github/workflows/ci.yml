name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.3"
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 300s
      - run: go build ./...

  gate:
    # Dogfood the PR gate (MKT-01, REL-08): prism ci built from this PR's
    # source fails the PR on a missed site or a new architecture violation
    # (arch_deny rules in prism.yaml). It used to be a non-blocking report.
    name: prism ci (gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build -o /tmp/prism ./cmd/prism
      - name: Gate this PR against its base
        run: /tmp/prism ci . --base "origin/${{ github.base_ref }}" --format github
