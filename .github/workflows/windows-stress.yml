name: windows-stress
# Temporary: reproduce the intermittent Windows runtime crash
# ("found pointer to free object" / "new g is not Gdead") seen in
# internal/mcp tests. Runs only on this investigation branch.
on:
  push:
    branches: [investigate/windows-crash, investigate/windows-crash-released]
jobs:
  stress:
    name: stress (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [fullsuite-a, fullsuite-b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: loop full suite
        shell: bash
        run: |
          export GOTRACEBACK=all
          mkdir -p logs
          fails=0
          for i in 1 2 3 4 5 6; do
            if go test ./... -count=1 -timeout 300s > logs/run$i.log 2>&1; then
              echo "run $i: ok"
            else
              fails=$((fails+1)); echo "run $i: FAIL"
              grep -m4 -E "fatal error|--- FAIL|panic:|database is locked" logs/run$i.log || true
            fi
          done
          echo "variant ${{ matrix.variant }} ($(grep 'provasign/grove ' go.mod | awk '{print $2}')): $fails of 6 full-suite runs failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fails" = 0 ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.variant }}
          path: logs/
