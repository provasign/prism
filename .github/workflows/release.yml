name: Release
on:
  push:
    tags: ["v*.*.*"]
# REL-05: least privilege by default; only the publish job can write the
# release, mint an OIDC token, or attest.
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.11"
  # REL-09: no local paths in the binary, VCS stamp on, fixed ldflags.
  LDFLAGS_BASE: "-s -w -X github.com/provasign/prism/internal/version.Version=${{ github.ref_name }}"
jobs:
  gate:
    name: Gate (tests + engine invariants)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      # The research repository's commit holding the invariant suite and its
      # ground truth. Bump deliberately, like a dependency.
      RESEARCH_SHA: "8dfe92928048ad3a45e1f55debd39c8b0245c2f2"
      ASTKIT_DECOY_VERSION: "v0.16.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test (race detector, pinned Grove)
        run: go test ./... -count=1 -race -timeout 900s
      - name: Build candidate
        run: go build -o /tmp/prism-candidate ./cmd/prism
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: provasign/research
          ref: ${{ env.RESEARCH_SHA }}
          path: research
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install decoy injector
        run: GOBIN=/usr/local/bin go install github.com/provasign/astkit/cmd/decoy@${{ env.ASTKIT_DECOY_VERSION }}
      - name: Restore invariant corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/ci-corpus
          key: ci-corpus-${{ hashFiles('research/harness/scoring/ci_invariants.py', 'research/harness/ci_baseline.json') }}
      - name: Drop empty corpus directories
        # The harness treats any existing directory as already fetched; a
        # cache entry holding an empty or partial checkout would pass a run
        # that never indexed the code.
        run: |
          if [ -d /tmp/ci-corpus ]; then
            for d in /tmp/ci-corpus/*/; do
              [ -d "$d" ] || continue
              if [ -z "$(find "$d" -type f -not -path '*/.git/*' -print -quit)" ]; then
                echo "removing empty corpus dir $d"; rm -rf "$d"
              fi
            done
          fi
      - name: Engine invariants
        working-directory: research
        run: python3 harness/scoring/ci_invariants.py --corpus-root /tmp/ci-corpus --prism /tmp/prism-candidate --decoy-injector /usr/local/bin/decoy

  build-linux:
    needs: gate
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install arm64 cross-compiler
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        # Fully static (-extldflags "-static", plus the netgo build tag so
        # Go's net package doesn't pull in cgo's getaddrinfo/res_search):
        # a cgo binary built on this runner's glibc dynamically requires
        # THAT glibc version at runtime. Measured 2026-09-24: a released
        # binary needed GLIBC_2.34 (pthread_create/__libc_start_main --
        # 2.34 merged libpthread into libc) purely from being built on a
        # newer-glibc host, with no static build in place. It refused to
        # even start on Ubuntu 20.04 (glibc 2.31), Debian 11 (2.31), Amazon
        # Linux 2 (2.26), RHEL 8 (2.28). Static linking removes the runtime
        # dependency entirely; verified indexing/lookup still works (cgo
        # tree-sitter parsers are statically linked in, not disabled) on
        # Ubuntu 20.04 in a container before this was applied here.
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -tags netgo -ldflags="${LDFLAGS_BASE} -extldflags \"-static\"" -o "dist/prism-${{ github.ref_name }}-linux-${{ matrix.goarch }}" ./cmd/prism
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prism-linux-${{ matrix.goarch }}
          path: dist/

  build-darwin:
    needs: gate
    name: Build darwin/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -ldflags="${LDFLAGS_BASE}" -o "dist/prism-${{ github.ref_name }}-darwin-${{ matrix.goarch }}" ./cmd/prism
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prism-darwin-${{ matrix.goarch }}
          path: dist/

  build-windows:
    needs: gate
    name: Build windows/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
            optional: false
          # REL-10: new; not yet proven, so it cannot block a release.
          # install.ps1 falls back to amd64 (emulated) when it is absent.
          - goarch: arm64
            runner: windows-11-arm
            optional: true
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -ldflags="${LDFLAGS_BASE}" -o "dist/prism-${{ github.ref_name }}-windows-${{ matrix.goarch }}.exe" ./cmd/prism
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prism-windows-${{ matrix.goarch }}
          path: dist/

  # REL-03: nothing is public until every asset exists. Build jobs only
  # upload workflow artifacts; this job writes checksums, SBOM, attestation
  # and signature, creates the release as a draft, and publishes it last.
  # install.sh used to abort in the window where binaries were public and
  # checksums.txt was not.
  publish:
    name: Publish release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          path: dist/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/prism-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt*' -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      # REL-04: the checksums file is signed keyless, so an attacker who can
      # replace a release asset cannot also forge checksums.txt. install.sh
      # verifies this bundle when cosign is installed.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          files: |
            dist/*
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

      # The Homebrew formula is NOT published from here. provasign/homebrew-tap
      # refreshes itself daily (.github/workflows/refresh-formulae.yml) from
      # the latest published release; a draft is never "latest", so the tap
      # cannot pick up a half-made release.
      #
      # To publish immediately:
      #   gh workflow run refresh-formulae.yml -R provasign/homebrew-tap
      - name: Homebrew formula
        run: |
          echo "Formula publishing is owned by provasign/homebrew-tap (daily refresh)."
          echo "For an immediate update: gh workflow run refresh-formulae.yml -R provasign/homebrew-tap"
