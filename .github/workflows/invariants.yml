name: Engine invariants
# REL-01 / REL-06: a Grove bump changes the engine under every answer.
# Pull requests that touch go.mod or go.sum run the same invariant suite
# the release gate runs.
on:
  pull_request:
    branches: [main]
    paths: ["go.mod", "go.sum", ".github/workflows/invariants.yml"]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.3"
  GOWORK: "off"
  RESEARCH_SHA: "8dfe92928048ad3a45e1f55debd39c8b0245c2f2"
  ASTKIT_DECOY_VERSION: "v0.16.9"
permissions:
  contents: read
jobs:
  invariants:
    name: Ceiling regression + compile invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build -o /tmp/prism-candidate ./cmd/prism
      - uses: actions/checkout@v7
        with:
          repository: provasign/research
          ref: ${{ env.RESEARCH_SHA }}
          path: research
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: GOBIN=/usr/local/bin go install github.com/provasign/astkit/cmd/decoy@${{ env.ASTKIT_DECOY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: /tmp/ci-corpus
          key: ci-corpus-${{ hashFiles('research/harness/scoring/ci_invariants.py', 'research/harness/ci_baseline.json') }}
      - name: Drop empty corpus directories
        run: |
          if [ -d /tmp/ci-corpus ]; then
            for d in /tmp/ci-corpus/*/; do
              [ -d "$d" ] || continue
              if [ -z "$(find "$d" -type f -not -path '*/.git/*' -print -quit)" ]; then rm -rf "$d"; fi
            done
          fi
      - working-directory: research
        run: python3 harness/scoring/ci_invariants.py --corpus-root /tmp/ci-corpus --prism /tmp/prism-candidate --decoy-injector /usr/local/bin/decoy
